# folio canonical vocabulary (glossary runtime SSoT)
# ★★ このファイルは生成物です。 手編集しないでください (次の再生成で失われます)。 ★★
#
# edit-SSoT (ここを編集する): .claude-plugin/design-system/generator/contract/folio-glossary.glossary.yaml
# 生成 script              : .claude-plugin/design-system/generator/project-vocabulary.sh
# 再生成                   : .claude-plugin/design-system/generator/project-vocabulary.sh \
#                              --out design-intent/vocabulary.yaml
#
# ADR-0052 (SSoT 再指定): 本 file は glossary contract の terms[] からの **生成 projection**。
#   旧 folio-9inj の「手動同鏡・片側編集禁止」(人間規律に依存する二重保持) から機械導出へ転換した。
#   導出規則 (全域関数):
#     canonical  ← contract .terms[].canonical
#     domain     ← contract .terms[].domain
#     definition ← contract .terms[].formal_def
#   語の追加・削除・定義改訂は **contract 側だけ** を編集し、 本 file を再生成して同一 commit で land する。
#
# 機械強制: verify-glossary-parity.sh の vocab-projection 節が「committed == fresh projection」を
#   whole-file byte 比較する (header 1 字・definition 1 字の改竄も FAIL)。 同 script は ci.yml の
#   deterministic floor に blocking 配線済ゆえ、 手編集 / 再生成漏れ (stale) は merge block される。
#
# 消費点 (本 file を runtime SSoT として読む機構):
#   - folio fix     : spec HTML の <span class="term" data-term="X"> へ data-tooltip = definition を materialize
#                     (auto-mark + populate、 REQ-GLOSS-001/002)
#   - folio validate: glossary gate (resolve + tooltip-consistency) / xref-tooltip-consistency
#   - folio build   : Layer 1 consumer root の glossary.html を内部 emitter で derive (ADR-0036)。
#                     ★folio 自身 (self-host root) の glossary.html は contract → pack pipeline
#                     (assemble-glossary.sh + inject-prose.sh) 委譲で生成するため本 file 由来ではない
#                     (build-orchestrates-pack、 ADR-0052)。
#
# schema 規約 (rules §3 / ADR-0034 §2.8 / ADR-0036):
#   - domain = folio-closed | consumer (ADR-0036 §2.2 partition)。 folio-closed = folio 所有・固定ゆえ
#     folio が canonical 定義を ship し consumer は plugin-resident の本 file から derive/auto-mark で
#     受け取る ($CLAUDE_PLUGIN_ROOT)。 consumer = consumer 所有・folio 解説不能。 folio 自身の vocab は
#     全て folio-closed。
#   - definition は単一行 (tooltip 機構は改行を扱わない)。 HTML 特殊文字 (& < > ") は folio fix が
#     attribute-escape して data-tooltip に格納する。
#   - definition に生の > / < を書かない (矢印は → / 比較は文章で表現): scan 系の tag 除去 (<[^>]*>) が
#     属性内の生 > でタグ境界を誤認する latent を avoid する不変条件 (ef4 slice B ceiling)。 contract 側で守る。
#
# forbidden は意図的に載せない (vocabulary gate REQ-CI-013 の誤検出 risk を避ける = #110 D2)。
#   ★"architecture" の forbidden 機械化は ADR-0048 rename 後も不可 (folio-7c4 再評価 2026-07-12 で census
#   確定): REQ-CI-013 は grep -F 部分一致ゆえ (a) 複合語 canonical (architecture-description /
#   architecture-nav-derive 等) を誤検出し、 (b) frozen ADR 約 30 本 + superseded research の歴史 prose に
#   裸出現が数百残る (P-10 で書換不能 = 恒久 RED・gate (d) に per-file waiver 機構なし)。 多義 (1 名 = 3
#   entity) の解消は P-5 forbidden (1 entity = 複数名 用) ではなく、 各 entity へ別 canonical 完全形を
#   宣言する語レベル整理で行う (architecture-description / design-intent space / Layer Architecture・
#   folio-c5r.7)。 概念用法 (arc42 / constitution §1 引用 / Architecture Decision Records) は ADR-0048 §5
#   どおり正当に存続する。
terms:
  - canonical: spec
    domain: folio-closed
    definition: WHAT (設計意図) を declarative に記述する design-intent 文書。 実装 HOW・決定 WHY と content domain を分離する (P-3 / P-7)。
  - canonical: ADR
    domain: folio-closed
    definition: Architecture Decision Record。 設計の WHY (決定・根拠・trade-off) を 1 決定 = 1 文書で記録する frozen な歴史資産 (ADR-worthiness は rules §10.3)。
  - canonical: constitution
    domain: folio-closed
    definition: folio の不変原則 (P-1〜P-14) を定める最上位 spec。 Amendment は user 承認必須・spec graph scan 対象外の特別枠 (P-10)。
  - canonical: invariant
    domain: folio-closed
    definition: spec が常に満たすべき構造的・意味的な不変条件。 EARS 要件と folio validate gate が機械的に保証する。
  - canonical: inventory
    domain: folio-closed
    definition: design-intent 空間の全 spec を <head> JSON-LD から走査して生成する機械可読 index (inventory.json)。 prime digest と object-graph の projection 元 (REQ-VER-010)。
  - canonical: prime
    domain: folio-closed
    definition: inventory から digest を生成する subcommand。 既定は Tier 1 inventory digest、 --boot は Tier 0 pointer digest を emit し SessionStart 注入に使う (REQ-VER-012 / ADR-0055)。
  - canonical: cluster
    domain: folio-closed
    definition: design-intent/ 内の content domain 別ディレクトリ (spec / decisions / research)。 各 cluster は README.html を index に持つ (P-7 3-domain、 具体 dir 名は folio-self-spec §2)。
  - canonical: vocabulary
    domain: folio-closed
    definition: folio-framework 語の canonical 定義を保持する YAML (vocabulary.yaml)。 folio fix の tooltip populate と Layer 1 consumer の glossary.html derive が読む runtime SSoT (P-5)。 SSoT-first に flip した folio 自身では編集の正本 (edit-SSoT) は glossary contract YAML 側にあり、 本 file はそこからの生成 projection (projection stale gate が byte 一致を保証・ADR-0052)。 flip しない Layer 1 consumer では本 file が edit-SSoT を兼ねる (ADR-0051 §2.3)。
  - canonical: SSoT
    domain: folio-closed
    definition: 'Single Source of Truth。 ある object / term の唯一の正準定義 site で、 他所はそこへ参照する。 SSoT-first 転換後は層を明示する修飾付き full 形で用いる: canonical SSoT = 提示層 (生成 HTML) 内の機械層 (精密 normative) / edit-SSoT = 正本 = 提示層を produce する編集起点 (contract YAML、 ADR-0051 §2.3)。'
  - canonical: dual-audience
    domain: folio-closed
    definition: 1 HTML artifact が machine (精密 normative = canonical SSoT) と human (essence + 視覚 view) の双方を同一 DOM に併せ持つ pattern (ADR-0033)。 artifact 自身が canonical WHAT (提示層) で機械層はその内部にある。 SSoT-first に flip した doc は編集の源が正本 (edit-SSoT) = contract YAML に分かれ、 flip しない doc は提示層が edit-SSoT を兼ねる (ADR-0050 / ADR-0051 §2.3)。
  - canonical: data-audience
    domain: folio-closed
    definition: 要素が machine 向けか human 向けかを示す属性 taxonomy (machine | human の 2 値)。 dual-audience の構造分離に使う。
  - canonical: EARS
    domain: folio-closed
    definition: Easy Approach to Requirements Syntax。 要件を ubiquitous / event / state / optional / unwanted の 5 pattern で記述する記法。
  - canonical: essence
    domain: folio-closed
    definition: defined-object の定義 site の既存内容を再利用した plain-text 要約。 xref tooltip の生成元 (rules §9.2、 新規に書き起こさない = P-7)。
  - canonical: dogfood
    domain: folio-closed
    definition: folio 自身を folio の規約・機構で構築し検証する self-application。 規約が実用に耐えるかの検証手段。
  - canonical: floor
    domain: folio-closed
    definition: deterministic な機械検査層 (folio validate gate)。 二層 enforcement の下限で、 機械化可能な品質を CI で強制する (ADR-0028)。
  - canonical: ceiling
    domain: folio-closed
    definition: LLM review 層 (Phase F spec-review agent)。 floor が機械検査できない意味的品質を補完する上限 (ADR-0028)。
  - canonical: xref
    domain: folio-closed
    definition: defined-object への in-band な untyped cross-reference (a class=xref + data-tooltip)。 folio fix が穴を materialize し validate が completeness を機械保証する (ADR-0034)。
  - canonical: defined-object
    domain: folio-closed
    definition: 一意 canonical ID を持つ参照可能 object (principle P-N / requirement REQ-* / decision ADR-NNNN / rule §)。 Class A xref の対象。
  - canonical: canonical name
    domain: folio-closed
    definition: 1 entity に対する唯一の正準名 (P-5)。 表記ゆれ・同義語を禁じ、 用語の一貫性を保つ。
  - canonical: progressive disclosure
    domain: folio-closed
    definition: 情報を Tier 1 (digest) から Tier 2 (lead) Tier 3 (full body) へ段階開示する pattern。 folio prime の inventory digest が体現する。
  - canonical: caller-marker
    domain: folio-closed
    definition: spec 編集を gate する hook 機構 (.folio/architect-active marker file or env var)。 folio-architect 経由の編集のみ許可する (ADR-0006)。
  - canonical: gate
    domain: folio-closed
    definition: folio validate / CI が spec 集合へ課す機械検査の単位。 block (violation = exit 1) と warn (exit code 非影響) の 2 channel を持つ (rules §10.2 / REQ-VER-023)。
  - canonical: marker
    domain: folio-closed
    definition: HTML comment による所有境界の宣言 (folio:chrome-* / folio:nav-curated / folio:landing-hero 等)。 内側が build 所有か人間所有かは機構ごとに定まる。
  - canonical: golden
    domain: folio-closed
    definition: 期待出力を file として commit し byte 比較で回帰を検出する基準 (tests/baselines)。 更新は --accept + diff review の明示手続きを経る (REQ-VER-004)。
  - canonical: keystone
    domain: folio-closed
    definition: 機構の前提 (marker / opt-in signal) を持たない対象を検査せず skip し clean を保つ設計原則。 誤発火より無検査を選び、 採用は対象側の明示 opt-in に委ねる。
  - canonical: frozen
    domain: folio-closed
    definition: accepted 後に本文を改訂しない歴史資産 (ADR / constitution)。 実装との乖離は living spec が divergence trace として記録する (P-10)。
  - canonical: chrome
    domain: folio-closed
    definition: folio build が全 page の marker 領域へ注入・維持するナビ枠 (skip-link / breadcrumb / ページ内目次 / prev-next、 ADR-0039 §2.3)。 手編集は再 build が上書きする。
  - canonical: curated region
    domain: folio-closed
    definition: marker の内側を人間が author し、 folio build が verbatim に往復保全する領域 (nav-curated / landing-hero)。 chrome と所有の向きが逆。
  - canonical: remediate
    domain: folio-closed
    definition: validate が検出した違反を解消する操作・tool の総称。 表示層 regen は folio build、 graph materialize は folio fix が分担する (rules §11.2)。
  - canonical: fold
    domain: folio-closed
    definition: details/summary による折り畳み表示。 machine 精密部や長大列を既定で畳み、 人間向け要旨を常時可視に保つ (dual-audience の human view 側)。
  - canonical: sandbox
    domain: folio-closed
    definition: tests/ の決定的 verification framework (scenario YAML + runner + fixtures + golden)。 hook / CLI を mock payload・隔離 root で単体検証する (ADR-0013 / 0017)。
  - canonical: harness
    domain: folio-closed
    definition: scenario を実行し assertion する runner 実装 (tests/runner.sh)。 kind (hook / cli-golden / cli-scaffold 等) ごとの実行経路を持つ (REQ-VER-011)。
  - canonical: landing
    domain: folio-closed
    definition: design-intent/index.html の入口 template (hero 一文 → 単一 CTA → 読者別カード → cluster 一覧、 ADR-0039 §2.2)。 型は build 所有・文言は curated。
  - canonical: architecture-description
    domain: folio-closed
    definition: 構造の WHAT を 1 文書で捉える doc-type (ISO/IEC/IEEE 42010)。 system の構成要素・関係・原則を記述する。 folio-self-spec はその instance。 design-intent space (空間全体) でも Layer Architecture (2 層構造) でもない。
  - canonical: design-intent space
    domain: folio-closed
    definition: folio repo の design-intent/ ディレクトリ全体 = spec / decisions / research / assets を含む設計意図の空間 (P-7 3-domain、 constitution §1 の architecture specification framework が書く対象)。 architecture-description (空間内の 1 doc-type) でも Layer Architecture でもない。
  - canonical: Layer Architecture
    domain: folio-closed
    definition: constitution §3 が定める folio の 2 層構造 = Layer 0 META FRAMEWORK (folio 自身) と Layer 1 consumer (folio を使う project)。 design-intent space (design-intent/ 空間) でも architecture-description (doc-type) でもない。
