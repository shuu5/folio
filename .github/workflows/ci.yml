# folio verification CI — ADR-0028 §2.4 "minimal CI" (deterministic floor の merge gating)。
#
# verification.html §4.2「完成形 = 全 scenario PR ごと auto-run + merge gating」の軽量版。
# 3 段で検証する:
#   (1) folio validate    = deterministic floor 18-gate (link / jsonld / broken-reverse / vocabulary
#                           / delta-marker / dual-audience-structural / xref-resolve / xref-uniqueness
#                           / xref-tooltip-consistency / xref-completeness / glossary / nav-regen-drift
#                           / nav-dead-link / cluster-reachability / ears-coverage / render-safety / readability-floor
#                           / how-outside (floor-2 = block 〔ADR-0047〕 / floor-1 = warn、 engine 設計 §10 B5-II)、
#                           ADR-0020/0025/0028/0033/0034/0035/0037/0039)
#   (2) tests/runner.sh   = sandbox 全 scenario (cli-golden / hook / agent-structural、 ADR-0013/0018)
#   (3) render-gate       = render-safety ceiling (playwright headless render、 verification.html
#                           REQ-VER-022 / tests/render-gate/README.md)。 corpus 全 page を 3 viewport
#                           (375/768/1280) で render し、 flowchart の cluster/node/label 幾何欠陥
#                           4 class + chrome 幾何 2 class (horizontal-overflow / nav-over-content、
#                           ADR-0039 §2.8) を捕捉する deterministic ceiling = folio dogfood (CI-only)。
#                           (1) の render-safety gate (REQ-VER-021) は pure-bash で render 後 DOM を
#                           見れず既知パターンしか lint できない floor。 非 flowchart 図は vacuous
#                           warning で可視化する。 全 page × viewport の screenshot を artifact 保存
#                           (人間 review の補助、 golden 化しない)。 決定性は vendored mermaid +
#                           pinned playwright + pinned font (fonts-noto-cjk) で担保。
#                           正式 decision 記録は ADR-0037 (+ ADR-0039 §2.8 で 3 viewport / chrome arm 拡張)。
#
# LLM ceiling (Phase F review agent = REQ-CI-011 declarative-form / 012 what-only) は
# 非決定的ゆえ CI 非搭載 (authoring advisory、 ADR-0028 §2.3)。 render-gate は決定的ゆえ blocking。
# Inspect AI / Promptfoo 移行は post-1.0 / optional に DEFER (ADR-0028 §2.4)。
name: folio verification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # node24 ランタイム (v4 = node20 は 2026-06-02 強制移行で deprecation)
        with:
          fetch-depth: 0   # census-guard の base-ref coupling が base sha を必要とする (政策A / folio-7n17)

      # yq は ubuntu-latest に非搭載。 runner.sh + vocabulary gate (mikefarah/yq v4.x) が依存。
      # local 開発環境 (v4.53.2) と同 minor に pin して再現性を確保する。
      - name: Install yq (mikefarah v4.x)
        run: |
          YQ_VERSION=v4.53.2
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Verify toolchain (bash + jq + yq)
        run: |
          bash --version | head -1
          jq --version
          yq --version

      # deterministic floor。 root 既定 = design-intent/ (CWD = repo root 前提)。 exit 1 で merge block。
      - name: folio validate (deterministic floor — 18 gate)
        run: .claude-plugin/bin/folio validate

      # 照会 graph 終端完備の deterministic floor (engine §10④⑦ / B5)。 design-system 生成 doc corpus
      # (contract/) の到達性 / dangling / 孤立 を検証する graph floor を CI floor に乗せる (B5-III)。
      # graph 構造は有限ゆえ floor が例外的に exhaustive = guarantee (exit 1 で merge block)。 ★graph
      # ceiling (照会 note / role 真正性) は CEILING=PENDING の advisory ゆえ CI 非ゲート (fidelity-* lens)。
      - name: folio verify-graph (deterministic floor — 照会 graph 終端完備)
        run: .claude-plugin/bin/folio verify-graph

      # 語彙鮮度 gate (REQ-VER-029・folio-hef.3)。 assemble-srs.sh + lib/common.sh が emit する
      # data-component / data-prose-slot token == srs.census-vocab.yaml を bijection assert する deterministic
      # floor。 新部品追加・改名・削除で語彙未更新を赤にし、 SRS 語彙 SSoT の鮮度を機械強制する
      # (render census 本体は mzn.3 Phase C で退役・本 gate は語彙 bijection として存続)。 graph 系 (rolemap) には触れない (M-A 非破壊)。
      - name: SRS census-vocab 整合 gate (deterministic floor — emit == census-vocab)
        run: .claude-plugin/design-system/generator/verify-census-vocab.sh

      # spec-graph JSON-LD emit keystone (folio-u7y2)。 生成 page を inventory/validate/fix + folio build
      # chrome に参加させる機構を肯定実証 + per-shape mutation-kill (emit 欠落 = vacuous-green / JSON-LD 改竄 /
      # chrome drift / 逆グラフ drift) で pin する pure-bash 敵対回帰。 render-gate 非依存 (uv/playwright 不要)。
      - name: spec-graph JSON-LD emit 敵対回帰 (deterministic — head_graph emit + scan 到達 + fix 逆グラフ + chrome 共存)
        run: .claude-plugin/design-system/generator/test-graph-emit.sh

      # canonical-drift gate (folio-u7oc)。 out-of-scan generated-canonical (design-intent/vision.html) は
      # validate 走査外・inventory node 外で、 SSoT (contract/prose) 側の変更や srs.css 改訂が canonical へ
      # 伝播しないまま 10 日 silent drift した前科がある (WCAG fix 未伝播・folio-u7oc 起票事由)。 本 gate は
      # canonical == fresh 再生成 (assemble-vision + inject-prose full pipeline) を生成 timestamp 正規化後の
      # byte 一致で検査する fail-closed gate。 決定的 (bash/yq/perl・render 非依存) ゆえ deterministic floor に
      # 配線して merge block させる — CI 配線しない限り gate は inert で再発防止にならない (Leg B 要件)。
      - name: canonical-drift gate (deterministic floor — out-of-scan canonical == fresh 再生成)
        run: .claude-plugin/design-system/generator/verify-canonical-drift.sh

      # glossary parity gate (folio-9inj 設置・ADR-0052 で projection モデルへ転換)。 定義文字列は 5 site に複製される: (1) vocabulary.yaml の definition /
      # (2) glossary contract の formal_def / (3) spec contract 3 本の glossary[].def / (4) spec HTML の inline
      # data-tooltip / (5) spec contract の prose html 内 data-tooltip。 (4) は folio validate
      # (xref-tooltip-consistency) が CI blocking で pin する。 (5) は verify-spec §11 round-trip が pin するが
      # CI 非配線 (local admin-funnel gate・CI 配線は folio-vt1t = 6lsu 治癒後)。 (1)(2)(3) の
      # 逐語一致を見る gate は verify-glossary-parity.sh の vocab-projection / def-parity 節しかない。 CI 非配線のままだと
      # 「vocabulary.yaml だけ編集 → folio fix + folio build → validate green」で contract の formal_def が stale の
      # まま land する fail-open になる (folio-7ts2 の vocab ⊃ contract drift と同一クラス)。 よって deterministic
      # floor に配線して merge block させる。 決定的 (yq/jq のみ・render 非依存) ゆえ verify-census-vocab.sh と同格。
      - name: glossary parity gate (deterministic floor — vocab-projection byte 一致 + def-parity 逐語一致)
        run: .claude-plugin/design-system/generator/verify-glossary-parity.sh

      # 上記 gate 自身の検出力 floor-proof (mutation-kill)。 vocab-projection / def-parity の各不変条件を script mutation で
      # 破って FAIL することを実証し、 vacuous-green を封じる。 V0 count pin (129/41) の drift もここで赤くなる
      # (非 CI 期に pin が latent 赤のまま腐った前科の再発防止 = 本 gate を CI に乗せる主目的の 1 つ)。
      - name: glossary parity gate 敵対回帰 (gate 自身の検出力 floor-proof)
        run: .claude-plugin/design-system/generator/test-adversarial-glossary-parity.sh

      # glossary build→pack 委譲 (ADR-0052 build-orchestrates-pack) の keystone 敵対回帰。 上の parity gate が
      # SSoT 間の *定義一致 (projection byte 一致/逐語)* を見るのに対し、 本 suite は folio build が self-host の glossary.html を
      # assemble+inject へ委譲して生成する経路そのものを per-shape mutation-kill で pin する:
      #   - DOM 構造クラス 2 つ (self-host = h4 / consumer fallback = span) の双方に改竄実弾を撃つ
      #     (1 instance の実弾は構造差 instance の穴を証明しない = jyfh/r8k 教訓)
      #   - marker keystone の条件 emit を per-instance 対照 (folio=付く / clinic=付かない) で pin
      #   - 委譲の前提崩れ (contract 不在・slug 欠落) が内部 emitter へ fallback せず hard-fail すること
      #     (fallback すると folio build 1 回で rich→素朴の silent revert が起き、 以後
      #      committed(素朴)==emit(素朴) で nav-regen-drift が恒真 PASS 化して劣化を隠す)
      #   - normalize の共有 fail-open (perl 不在で両辺が空 file → 空==空 = 差分なし) の回帰 pin
      # 決定的 (bash/yq/jq のみ・render 非依存) ゆえ verify-glossary-parity.sh と同格の deterministic floor。
      - name: glossary pack 委譲 keystone 敵対回帰 (per-shape MK・deterministic floor)
        run: .claude-plugin/design-system/generator/test-adversarial-glossary-pack.sh

      # F6 recapture-parity gate (folio-lwhz Leg B 配線)。 flip 済み spec (verification = ears-requirement-row) と
      # 未 flip spec (rules/relations = details.spec-row) の per-file shape union で「原本 anchor 集合 == contract
      # requirements 集合」を照合する。 contract の requirement 追加/削除が原本と乖離したまま land する fail-open を
      # deterministic に block する (R0 count pin = 3 contract / 60 id)。
      - name: recapture-parity gate (deterministic floor — 原本 anchor 集合 == contract 集合)
        run: .claude-plugin/design-system/generator/verify-recapture-parity.sh
      - name: recapture-parity gate 敵対回帰 (R7b zero-anchors 含む・gate 自身の検出力 floor-proof)
        run: .claude-plugin/design-system/generator/test-adversarial-recapture-parity.sh

      # F8 verification drift gate (folio-lwhz Leg B 配線)。 flip 済み canonical verification.html が
      # 「contract からの fresh 再生成 (assemble+inject+fix+build) と timestamp 正規化後 byte 一致」であることを
      # 照合し、 hand-edit 温存や生成 pipeline drift を deterministic に block する (物理指紋 4 clause 込み)。
      # u7oc の canonical-drift gate の in-scan flip 版 (同クラスの silent drift 前科への恒久 gate)。
      - name: verification drift gate (deterministic floor — landed == fresh 再生成 byte 一致)
        run: .claude-plugin/design-system/generator/verify-verification-drift.sh
      - name: verification drift gate 敵対回帰 (per-shape MK 7 本・gate 自身の検出力 floor-proof)
        run: .claude-plugin/design-system/generator/test-adversarial-verification-drift.sh

      # F8 同型: srs-verification drift gate (folio-bxpm Leg B 配線)。 flip 済み canonical srs-verification.html の
      # in-scan drift を同原理 (fresh 再生成 byte 一致 + 物理指紋 4 clause) で block する (lwhz F8 の instance#3)。
      # CI 未配線のまま land すると gate は committed だが dormant = 常時経路 fail-open (bxpm 独立 ceiling major)。
      - name: srs-verification drift gate (deterministic floor — landed == fresh 再生成 byte 一致)
        run: .claude-plugin/design-system/generator/verify-srs-verification-drift.sh
      - name: srs-verification drift gate 敵対回帰 (per-shape MK 7 本・gate 自身の検出力 floor-proof)
        run: .claude-plugin/design-system/generator/test-adversarial-srs-verification-drift.sh

      # F8 同型: rules drift gate (folio-d7bq Leg B 配線)。 flip 済み canonical rules.html の in-scan drift を
      # 同原理 (fresh 再生成 byte 一致 + 物理指紋 4 clause) で block する (lwhz F8 の instance#4・spec-pack 経路)。
      - name: rules drift gate (deterministic floor — landed == fresh 再生成 byte 一致)
        run: .claude-plugin/design-system/generator/verify-rules-drift.sh
      - name: rules drift gate 敵対回帰 (per-shape MK 7 本・gate 自身の検出力 floor-proof)
        run: .claude-plugin/design-system/generator/test-adversarial-rules-drift.sh

      # 政策A 恒久防御 (a)(c) の常設配線 (ADR-0053 / folio-7n17)。 drift gate が捕捉できない両側同時退行
      # (extractor-collapse の vacuous PASS — fresh 再生成も同様に collapse し byte 一致で PASS する) を
      # frozen census + COLLAPSE/M-SELFCMP/F19 敵対 test で block する (REQ-VER-031 の常設 enforcement)。
      - name: verification census/collapse 敵対回帰 (§10b frozen census arm + COLLAPSE + M-SELFCMP + F19 census 群)
        run: .claude-plugin/design-system/generator/test-adversarial-verification.sh
      # 数字上書き防壁: frozen census の裸の値変更 (契約変更を伴わない census bump = 退行 launder) を
      # base-ref coupling で block する。 base-ref は PR base sha / push は before sha (fetch-depth: 0 が前提)。
      - name: census-guard (数字上書き防壁・census 値変更 ⟺ contract 変更 coupling)
        run: .claude-plugin/design-system/generator/census-guard.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

      # 政策A rules arm の常設配線 (ADR-0053 §2.6 / folio-7wbn Leg B・verification 対と同型)。
      - name: rules census/collapse 敵対回帰 (§10b frozen census arm + COLLAPSE + M-SELFCMP + CEN laundering 群)
        run: .claude-plugin/design-system/generator/test-adversarial-spec.sh
      - name: census-guard rules (数字上書き防壁・per-spec 呼出し = 案X spec 名引数化)
        run: .claude-plugin/design-system/generator/census-guard.sh rules "${{ github.event.pull_request.base.sha || github.event.before }}"

      # 政策A floor 本体の landed canonical 直接実走 (folio-7wbn ceiling 開示 (iii) の充足・verification 側の
      # 同一 latent (7n17 由来) も対称に閉じる)。 adv suite は contract からの staging を subject にし landed
      # canonical を検査せず、 F8 drift gate は byte 一致のみで frozen census arm を発火させない — §10b census
      # arm と §11 round-trip はこの直接 step でのみ CI 発火する。 SKIP_REPRO = 案A 裁定 (in-scan flip の repro
      # arm は構造 false-drift・byte identity は F8 が正規被覆)・SKIP_RENDER = render-gate job (gate F sweep) が別途被覆。
      - name: 政策A floor 実走 — verify-verification (landed canonical vs frozen census + contract round-trip)
        run: SKIP_REPRO=1 SKIP_RENDER=1 .claude-plugin/design-system/generator/verify-verification.sh --artifact .claude-plugin/design-system/generator/contract/folio-verification.spec.yaml design-intent/spec/verification.html
      - name: 政策A floor 実走 — verify-spec/rules (landed canonical vs frozen census + contract round-trip)
        run: SKIP_REPRO=1 SKIP_RENDER=1 .claude-plugin/design-system/generator/verify-spec.sh --artifact .claude-plugin/design-system/generator/contract/folio-rules.spec.yaml design-intent/spec/rules.html

      # ======================================================================
      # relations arm (folio-uryh Leg W が追記・★blocking 発火は admin Leg A)
      # ----------------------------------------------------------------------
      # ★★land 前提 (これを守らないと main が中間 RED になる): 下記 6 step は ★live canonical を実走しうる。
      #   folio-6vox の flip (relations.html を contract 生成物へ置換) が ★未 land の間は該当 step が RED になるのが
      #   ★正常 — canonical が hand-authored 原本ゆえ物理指紋段 / 構造段で正しく落ちる (gate バグではない)。
      #   ゆえに本 step 群は ★flip commit と同一 bundle (flip-first) で land すること (admin Leg A・lwhz/d7bq/bxpm 同型)。
      #   ★soft 化 (continue-on-error) / dormant 化での単独配線は ★却下 (latent-red-rot = fail-open。 契約
      #   folio-uryh「CI 発火経路の完全性」)。 blocking のまま bundle で入れるのが唯一の正しい land 形。
      # ----------------------------------------------------------------------
      # F8 同型: relations drift gate (lwhz F8 の instance#5・spec-pack 経路)。 ★relations 固有の穴:
      # verify-relations.sh は generated ⊆ contract (fabrication-free) しか見ず generated == canonical を
      # 見ないため、 DRAFT contract が自己整合 PASS しつつ canonical に対し lossy な silent クラス (8kuf 実証) を
      # 検出できない。 本 gate が「landed == fresh 再生成 byte 一致 + 物理指紋 4 clause」で塞ぐ。
      - name: relations drift gate (deterministic floor — landed == fresh 再生成 byte 一致)
        run: .claude-plugin/design-system/generator/verify-relations-drift.sh
      - name: relations drift gate 敵対回帰 (per-shape MK 14 case・gate 自身の検出力 floor-proof)
        run: .claude-plugin/design-system/generator/test-adversarial-relations-drift.sh

      # ★relations base 敵対 suite の blocking 配線 (folio-uryh 自己点検 ceiling major fix)。
      #   ★peer 非対称の是正: verification は test-adversarial-verification.sh が、 rules は test-adversarial-spec.sh が
      #   base arm (M1-M15 round-trip / census-count / repro-build conformance) と census/collapse arm を ★1 file に
      #   同居 させるため 1 step で両方発火する。 relations は census/collapse を別 file へ切り出した結果、
      #   ★base arm がどの CI step からも走らない 状態になっていた (= verify-relations.sh の中核検出力 —
      #   機械層 round-trip の順序付き一致 / 未対応 block type の fail-closed abort / census-count / repro-build
      #   BYTE-DIFF — が blocking backstop 無しになる fail-open。 将来の骨抜き改変が CI 緑のまま通る)。
      #   ★ORIGIN 明示注入は下記 floor step と ★同理由: 既定 ORIG は flip 後 live landed == 生成物 の自己比較へ
      #   退化し P1/P2 が恒真 PASS 化する (COLLAPSE-1 が当該 vacuity を実演済)。 ★実測: 本 step の逐語形で 83/0。
      #   ★M15 は RELATIONS_ORIGIN_HTML を ★呼出し単位 でインライン指定するため step 単位注入に上書きされない。
      - name: relations 敵対回帰 (base arm・M1-M15 round-trip / census-count / repro-build conformance)
        run: RELATIONS_ORIGIN_HTML=.claude-plugin/design-system/generator/spec-origin/relations.origin.html .claude-plugin/design-system/generator/test-adversarial-relations.sh

      # 政策A relations arm の常設配線 (ADR-0053 §2.6 / folio-uryh・verification/rules 対と同型)。
      - name: relations census/collapse 敵対回帰 (§10b frozen census arm + CEN/CEN-rel + M-SELFCMP + SNAPPIN + COLLAPSE + XARM/LIVEPIN)
        run: .claude-plugin/design-system/generator/test-adversarial-relations-census.sh
      - name: census-guard relations (数字上書き防壁・per-spec 呼出し = 案X spec 名引数化)
        run: .claude-plugin/design-system/generator/census-guard.sh relations "${{ github.event.pull_request.base.sha || github.event.before }}"

      # 政策A floor 本体の landed canonical 直接実走 (verification/rules 対と同型)。
      # ★RELATIONS_ORIGIN_HTML を ★明示注入 する: §11 の既定 ORIG は live landed canonical ゆえ、 flip 後は
      #   ORIG==生成物 の ★自己比較 に退化し extractor collapse に恒真 PASS する。 独立 oracle = flip 前 canonical
      #   + heal snapshot (provenance は spec-origin/relations.origin.heal.py に逐語記録) を与えて非 vacuous 化する。
      # ★SKIP_REPRO / SKIP_RENDER の必須性 (lyl6 継承): SKIP_REPRO 欠落 = in-scan flip の repro arm が構造
      #   false-drift で RED / SKIP_RENDER 欠落 = verify job で render_gate_f が crash する。 rules 版 (上記) と逐語同型。
      - name: 政策A floor 実走 — verify-relations (landed canonical vs frozen census + 原本 round-trip)
        run: SKIP_REPRO=1 SKIP_RENDER=1 RELATIONS_ORIGIN_HTML=.claude-plugin/design-system/generator/spec-origin/relations.origin.html .claude-plugin/design-system/generator/verify-relations.sh --artifact .claude-plugin/design-system/generator/contract/folio-relations.spec.yaml design-intent/spec/relations.html

      # sandbox 全 scenario。 runner は 1 scenario/起動ゆえ glob ループ。 全件集約し 1 件でも FAIL なら block。
      # (cli-golden の inventory/prime/validate-clean は spec 数変化で golden 再生成 = --accept が必要になり、
      #  未再生成 PR はここで FAIL する = golden maintenance を強制する設計。)
      - name: sandbox scenarios (tests/runner.sh — 全 scenario)
        run: |
          fail=0
          for s in tests/scenarios/*.yaml; do
            name=$(basename "$s")
            echo "::group::sandbox ${name}"
            if bash tests/runner.sh "$s"; then
              echo "PASS ${name}"
            else
              echo "::error file=${s}::sandbox scenario FAILED: ${name}"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::1 件以上の sandbox scenario が FAIL しました"
            exit 1
          fi
          echo "all sandbox scenarios GREEN"

  # render-safety ceiling (verification.html REQ-VER-022、 floor = REQ-VER-021 の二層上層)。 verify (bash floor) と並列の独立 job。
  # browser 依存ゆえ別 job に隔離し、 fast な bash 検証を遅らせない。 deterministic ゆえ blocking。
  render-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # install ~3分 + 全 corpus (~49 page) × 3 viewport render + screenshot ~7分 + artifact upload (~170MB) 数分。 apt/DL hang で runner を長時間占有させない。
    steps:
      - name: Checkout
        uses: actions/checkout@v5   # node24 ランタイム

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CJK font を pin して text shaping を CI/local で固定する (spec 図は日本語 label を含む)。
      # --with-deps は IPAfont を入れるが、 font set を明示 pin して決定性を実装で裏打ちする (REQ: blocking gate)。
      - name: Pin CJK font (determinism)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      # playwright 版は requirements.txt で pin → chromium revision 固定 → mermaid (vendored) + font と
      # 併せ render を三重 pin。 --with-deps で headless chromium の system lib も入れる。
      - name: Install playwright (pinned) + chromium
        run: |
          python3 -m pip install -r tests/render-gate/requirements.txt
          python3 -m playwright install --with-deps chromium

      # detector が「まだ欠陥を捕捉できる」ことを fixture で自己検証 (版 drift への回帰ガード)。
      - name: render-gate self-test (detector 検出力の floor-proof)
        run: python3 tests/render-gate/check.py --selftest

      # 全 corpus を実ブラウザ × 3 viewport で render し、 flowchart 幾何 overlap + chrome 崩れ
      # (horizontal-overflow / nav-over-content) + render 不足を検出。 1 件でも exit 1 で merge block。
      # screenshot は workspace 外 (RUNNER_TEMP) へ — リポジトリを汚さず .gitignore も要らない。
      - name: render-safety ceiling (全 corpus × 3 viewport の幾何 sweep)
        run: python3 tests/render-gate/check.py --screenshot-dir "$RUNNER_TEMP/render-shots"

      # ---- SRS render-gate (gate F、 taxonomy §5.2) — 生成 SRS プレゼンの low-contrast /
      #      horizontal-overflow / component-overlap を light/dark × 3 viewport で検出。 既存 folio
      #      render-gate (mermaid 専用) とは別系統。 detector は probe.js の定数 SSoT を流用。 ----
      - name: SRS render-gate self-test (detector 検出力の floor-proof)
        run: python3 .claude-plugin/design-system/generator/render-gate-srs.py --selftest

      # 生成 SRS dogfood corpus を build (assemble → inject) し gate F をかける。 srs.css の
      # contrast 退行 (dark accent への白文字崩れ等) を CI で blocking 捕捉する。 yq は SRS build の
      # 依存ゆえ verify job と同 version を install (jq/perl は ubuntu-latest 標準)。
      - name: Install yq (SRS build 依存、 mikefarah v4.x)
        run: |
          YQ_VERSION=v4.53.2
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
      - name: SRS gate F (dogfood artifact を build して render-gate にかける)
        run: |
          gen=.claude-plugin/design-system/generator
          bash "$gen/assemble-srs.sh" "$gen/contract/ec-checkout.srs.yaml" "$RUNNER_TEMP/srs-asm.html"
          bash "$gen/inject-prose.sh" "$gen/prose/ec-checkout.prose.yaml"   "$RUNNER_TEMP/srs-asm.html" "$RUNNER_TEMP/srs-filled.html"
          python3 "$gen/render-gate-srs.py" "$RUNNER_TEMP/srs-filled.html"

      # ---- gate F 全 instance sweep (A 段 = folio-vuf 非 mermaid 13 (risk+changelog+roadmap+srs-verification 追加後) / B 段 = folio-jyfh mermaid 6・user 裁定
      #      2026-07-08: 全 contract 掃引)。 19 artifact (srs-clinic は上の ec と対で SRS 全 instance を被覆) を
      #      build → render-gate-srs.py (doc-type 非依存 detector) で light/dark × 3 viewport の low-contrast /
      #      horizontal-overflow / component-overlap を blocking 捕捉。 srs.css 共有トークンの contrast 退行
      #      (dark 側の実欠陥 4 点を本 gate 初回実走が検出・land 済) を全 pack 面で再発防止する。
      #      mermaid instance (arch / datamodel / spec×3 / clinic-vision) は renderer が SVG settle polling
      #      (期待図数へ到達するまで最大 15s/session・不足 = mermaid-shortfall FAIL・fail-closed) で非同期
      #      render を待ってから検査する (folio-jyfh B 段)。
      #      撤退条件: 本 step 合計が 300s を超えたら並列化/分割を再検討 (user 裁定の付帯条件)。 ----
      - name: gate F sweep (全 instance を build して render-gate にかける)
        run: |
          gen=.claude-plugin/design-system/generator
          # mermaid pack (B 段) は assets/mermaid.min.js を非同期 load して SVG 化する。 配信 root
          # (RUNNER_TEMP) の assets/ に vendor が無いと render せず svgCount=0 → renderer が
          # mermaid-shortfall FAIL に倒す (fail-closed 側で守られる) が、 健全経路のため事前 staging する。
          # 参照形は 2 種 (clinic 系 assets/ ・ folio self-spec 系 ../assets/) とも browser の URL 正規化で
          # 配信 root の /assets/ に解決する (RFC 3986: root を越える .. は discard)。 -e 下ゆえ cp 失敗 = step 赤。
          mkdir -p "$RUNNER_TEMP/assets"
          cp design-intent/assets/mermaid.min.js "$RUNNER_TEMP/assets/mermaid.min.js"
          t0=$(date +%s); fail=0
          gate() { # $1=label $2=out|stdout (assemble の出力形・glossary のみ stdout) $3=pack $4=contract $5=prose
            local label=$1 mode=$2 pack=$3 contract=$4 prose=$5
            local asm="$RUNNER_TEMP/gfa-$label.asm.html" out="$RUNNER_TEMP/gfa-$label.html"
            if [ "$mode" = stdout ]; then
              bash "$gen/assemble-$pack.sh" "$gen/contract/$contract" > "$asm" || { echo "::error::[$label] assemble FAIL"; fail=1; return 0; }
            else
              bash "$gen/assemble-$pack.sh" "$gen/contract/$contract" "$asm" || { echo "::error::[$label] assemble FAIL"; fail=1; return 0; }
            fi
            bash "$gen/inject-prose.sh" "$gen/prose/$prose" "$asm" "$out" || { echo "::error::[$label] inject FAIL"; fail=1; return 0; }
            if python3 "$gen/render-gate-srs.py" "$out"; then
              echo "[$label] gate F OK"
            else
              echo "::error::[$label] gate F FAIL (low-contrast / overflow / overlap / render 破綻)"; fail=1
            fi
          }
          gate srs-clinic      out    srs       clinic-appointment.srs.yaml         clinic-appointment.prose.yaml
          gate adr             out    adr       clinic-double-booking.adr.yaml      clinic-double-booking.adr.prose.yaml
          gate research        out    research  clinic-double-booking.research.yaml clinic-double-booking.research.prose.yaml
          gate principle       out    principle folio-constitution.principle.yaml   folio-constitution.principle.prose.yaml
          gate testcases       out    testcases clinic-appointment.testcases.yaml   clinic-appointment.testcases.prose.yaml
          gate interface       out    interface clinic-appointment.interface.yaml   clinic-appointment.interface.prose.yaml
          gate glossary-clinic stdout glossary  clinic-appointment.glossary.yaml    clinic-glossary.prose.yaml
          gate glossary-folio  stdout glossary  folio-glossary.glossary.yaml        folio-glossary.prose.yaml
          gate vision-folio    out    vision    folio-vision.vision.yaml            folio-vision.prose.yaml
          gate risk            out    risk      clinic-risk.risk.yaml              clinic-risk.risk.prose.yaml
          gate changelog       out    changelog clinic-changelog.changelog.yaml     clinic-changelog.changelog.prose.yaml
          gate roadmap         out    roadmap   clinic-roadmap.roadmap.yaml         clinic-roadmap.roadmap.prose.yaml
          gate srs-verification out   srs-verification folio-srs-verification.spec.yaml folio-srs-verification.prose.yaml
          # ---- B 段: mermaid 6 instance (SVG settle polling は renderer 側・folio-jyfh) ----
          gate arch            out    arch         clinic-architecture.arch.yaml     clinic-architecture.arch.prose.yaml
          gate datamodel       out    datamodel    clinic-appointment.datamodel.yaml clinic-appointment.datamodel.prose.yaml
          gate rules           out    spec         folio-rules.spec.yaml             folio-rules.prose.yaml
          gate verification    out    verification folio-verification.spec.yaml      folio-verification.prose.yaml
          gate relations       out    relations    folio-relations.spec.yaml         folio-relations.prose.yaml
          gate vision-clinic   out    vision       clinic-appointment.vision.yaml    clinic-appointment.vision.prose.yaml
          echo "gate F sweep 所要: $(( $(date +%s) - t0 ))s (撤退条件 300s)"
          if [ "$fail" -ne 0 ]; then echo "::error::gate F sweep に FAIL あり"; exit 1; fi
          echo "gate F sweep GREEN (19 artifact)"

      # 全 page × viewport の full-page screenshot を artifact 保存 (ADR-0039 §2.8: 人間 review の
      # 補助に充てるのみで golden 比較はしない — pixel golden は brittle)。 FAIL 時こそ目視材料が
      # 要るため always()。 sweep 前に selftest で落ちた場合は dir 不在 → ignore で空 upload を許容。
      # サイズ実測 ~170MB (JPEG q80、 縦長 page の full-page ゆえ) — public repo の artifact storage は
      # 無料 + retention 14 日で自動失効するため完全性 (全 page 証拠) を優先する。
      - name: Upload render screenshots (人間 review 補助、 golden ではない)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshots
          path: ${{ runner.temp }}/render-shots
          if-no-files-found: ignore
          retention-days: 14
