# vision.rolemap.yaml — vision-pack (doc_type: vision) の抽象ロール graph 写像 (rolemap)
#
# folio 文書規律エンジン roadmap 段階3 後 (folio-c5r.4)。 engine doc §3 表 (照会 = 抽象ロール graph) を vision-pack の
# 具体 node-type へ写像する pack 側 SSoT (詳細は arch.rolemap.yaml / srs.rolemap.yaml 冒頭注記)。 core
# (lib/graph-common.sh) の reader が読み、 verify-graph.sh が
#   (1) floor: scope 内 edge.role == roles[node-type] を pin (co-author + enforce・二重担保)
#   (2) graph: principle 終端への到達可能性 / dangling / 孤立 を組み立てる
# のに使う。 rolemap = pack / リーダー = core (additive・無改変)。
#
# ★vision の hallmark = 「なぜ作るか」の前方照会 + 自己終端: features[] (claim) が SRS の要件 (充足照会) を
#   *別文書 cross-document link* で指し、 再掲しない (案A)。 ゆえ edge-bearing pack
#   (GRAPH_EDGELESS_PACKS = srs|principle に含まれない)。 verify-graph.sh は contract/*.yaml を無条件 glob し
#   graph_pack_of でファイル名 (clinic-appointment.vision.yaml) から pack=vision を導出して同名 rolemap を発見・必須化する
#   (opt-in registry でない)。 ゆえ本 rolemap は新設と同時に pass-1 floor pin (edge.role == roles[features]=claim) +
#   forbidden_roles=[exploration] を *常時* 課される = floor を通すこと自体が受入条件。
# ★pass-2 reachability: vision は自前の inline principle 終端 (PRIN-PATIENT-TRUST) を terminal.id_expr で宣言するため
#   vision→終端 edge が張られ、 VISION-CLINIC-APPT は *終端完備* になる (arch と同型・記述型でも完全な照会 graph 終端を実証)。
#   clinic 母体は constitution ゼロ生成 (c5r.2) ゆえ外部 principle へ forward できず、 inline principle 自己終端に確定
#   (grill 論点2)。 SRS は edgeless のまま・vision の backward edge が SRS へ終端到達路を供給する。
pack: vision

# node-type (contract の構造要素) → 抽象ロール (§3 表・GRAPH_ROLE_ALLOWLIST 内)。
# features = claim (実現を主張する機能の方向 = 主張)。 前方照会先 (SRS の FR=claim) の役割は
# verify-vision.sh の verify_cross_doc_refs が HTML data-*-role で別途扱う (graph の roles は *source node* の intrinsic role)。
# objectives / stakeholders / success_criteria / risks は graph edge を持たない純内容 node ゆえ roles に載せない
# (arch が components/quality/risks を載せないのと同型・edge-bearing のみ pin 対象)。
roles:
  features: claim   # 機能の方向 = 実現の主張

# 前方 cross-doc 照会 edge (1 本)。 features[].refs.srs[] が SRS へ向かう。 arch decisions→SRS と同型ゆえ
# direction: backward (vision→照会先 だが reachability は照会先→vision。 局所の ID 実在検証は verify-vision.sh が担う)。
# ★edge.role token = *source node-type (features) の intrinsic role* = claim を |edges| 回 emit
#   (arch の map("claim") と同型。 照会先 ID 列・照会 relationship role〔SRS=claim〕は role_expr でなく
#    verify-vision.sh の verify_cross_doc_refs が別経路で扱う)。 vision は ADR を照会しない (arch と違い根拠照会なし)。
edges:
  - from_node: features                                              # roles[features] = claim が edge.role の期待値 (二重担保)
    role_expr: '[.features[].refs.srs[]] | map("claim") | .[]'       # source 役割 (claim) を |srs edges| 回
    count_expr: '[.features[].refs.srs[]] | length'                  # |srs edges| (空 ref 検出)
    target_docid_expr: '.cross_doc.srs_doc_id'                       # 照会先 doc の doc_id (graph dangling 用)
    direction: backward                                             # vision→SRS は toward-terminal の逆 (reachability は SRS→vision)

# この pack が持つ照会終端 node = inline principle id (domain-local 終端・vision 自身が宣言)。
# doc 自身 → 終端 node の edge を graph に張り、 VISION-CLINIC-APPT を終端完備にする。
terminal:
  id_expr: '.principle.id'

# contract外 (folio-self) を指す照会 = external-ref warn。 vision (clinic instance) には無い。
external: []

# この pack に存在してはならない抽象ロール。 vision は探索文書でない (探索は research-pack)。
# floor が「rolemap に exploration 不在」かつ「corpus に exploration role 不在」を scan で実証。
forbidden_roles:
  - exploration
