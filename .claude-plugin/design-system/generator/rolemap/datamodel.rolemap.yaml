# datamodel.rolemap.yaml — data-model-pack (doc_type: data-model) の抽象ロール graph 写像 (rolemap)
#
# folio engine post-B6 (folio-1q8o / c5r Tier C)。 engine doc §3 表 (照会 = 抽象ロール graph) を datamodel-pack の
# 具体 node-type へ写像する pack 側 SSoT (詳細は arch.rolemap.yaml / srs.rolemap.yaml 冒頭注記)。 core (lib/graph-common.sh)
# の reader が読み、 verify-graph.sh が
#   (1) floor: scope 内 edge.role == roles[node-type] を pin (co-author + enforce・二重担保)
#   (2) graph: principle 終端への到達可能性 / dangling / 孤立 を組み立てる
# のに使う。 rolemap = pack / リーダー = core (additive・無改変)。
#
# ★datamodel の hallmark = 情報構造 WHAT の前方照会: entities[] / relationships[] / data_policy[] (いずれも claim) が
#   SRS の要件 (充足照会) を *別文書 cross-document link* で指し、 再掲しない (案A)。 ゆえ edge-bearing pack
#   (GRAPH_EDGELESS_PACKS = srs|principle に含まれない)。 verify-graph.sh は contract/*.yaml を無条件 glob し
#   graph_pack_of でファイル名 (clinic-appointment.datamodel.yaml) から pack=datamodel を導出して同名 rolemap を発見・必須化する
#   (opt-in registry でない)。 ゆえ本 rolemap は新設と同時に pass-1 floor pin (edge.role == roles[node]=claim) +
#   forbidden_roles=[exploration] を *常時* 課される = floor を通すこと自体が受入条件。
# ★pass-2 reachability: datamodel は自前 inline principle 終端 (PRIN-DATA-MINIMUM) を terminal.id_expr で宣言するため
#   doc→終端 edge が張られ、 DM-CLINIC-APPT は *終端完備* になる (arch/vision と完全ミラー・leaf-sink なし・D4 toward-terminal)。
pack: datamodel

# node-type (contract の構造要素) → 抽象ロール (§3 表・GRAPH_ROLE_ALLOWLIST 内)。
# entities / relationships / data_policy = claim (採用した情報構造判断 = 主張)。 前方照会先 (SRS の FR/NFR=claim) の
# 照会 relationship role は verify-datamodel.sh の verify_cross_doc_refs が HTML data-dm-role で別途扱う
# (graph の roles は *source node* の intrinsic role)。
roles:
  entities: claim        # 情報のかたまり = 構造の主張
  relationships: claim   # つながりと決まり = 構造の主張
  data_policy: claim     # データの扱い = 構造の主張

# 前方 cross-doc 照会 edge (3 本)。 entities/relationships/data_policy[].refs.srs[] が SRS へ向かう。 arch→SRS と同型ゆえ
# direction: backward (datamodel→SRS だが reachability は SRS→datamodel。 局所の ID 実在検証は verify-datamodel.sh が担う)。
# ★edge.role token = *source node-type の intrinsic role* = claim を |edges| 回 emit
#   (arch decisions の map("claim") と同型。 照会先 ID 列・照会 relationship role〔SRS=claim〕は
#    role_expr でなく verify-datamodel.sh の verify_cross_doc_refs が別経路で扱う)。
edges:
  - from_node: entities                                                   # roles[entities] = claim が edge.role の期待値 (二重担保)
    role_expr: '[.entities[].refs.srs[]] | map("claim") | .[]'            # source 役割 (claim) を |entities srs edges| 回
    count_expr: '[.entities[].refs.srs[]] | length'                       # |entities srs edges| (空 ref 検出)
    target_docid_expr: '.cross_doc.srs_doc_id'                            # 照会先 doc の doc_id (graph dangling 用)
    direction: backward                                                  # datamodel→SRS は toward-terminal の逆 (reachability は SRS→datamodel)
  - from_node: relationships                                              # 同 source 役割 (relationships=claim)
    role_expr: '[.relationships[].refs.srs[]] | map("claim") | .[]'       # source 役割 (claim) を |relationships srs edges| 回
    count_expr: '[.relationships[].refs.srs[]] | length'                  # |relationships srs edges|
    target_docid_expr: '.cross_doc.srs_doc_id'
    direction: backward
  - from_node: data_policy                                                # 同 source 役割 (data_policy=claim)
    role_expr: '[.data_policy[].refs.srs[]] | map("claim") | .[]'         # source 役割 (claim) を |data_policy srs edges| 回
    count_expr: '[.data_policy[].refs.srs[]] | length'                    # |data_policy srs edges|
    target_docid_expr: '.cross_doc.srs_doc_id'
    direction: backward

# この pack が持つ照会終端 node = inline principle id (自前 domain-local 終端・データ最小化原則)。
# doc 自身 → 終端 node の edge を graph に張り、 DM-CLINIC-APPT を終端完備にする (leaf-sink なし・D4)。
terminal:
  id_expr: '.principle.id'

# contract外 (folio-self) を指す照会 = external-ref warn。 datamodel (clinic instance) には無い。
external: []

# この pack に存在してはならない抽象ロール。 datamodel は探索文書でない (探索は research-pack)。
# floor が「rolemap に exploration 不在」かつ「corpus に exploration role 不在」を scan で実証。
forbidden_roles:
  - exploration
