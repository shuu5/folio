machine_preamble:
  - { type: dl, html: "<div><dt>Status</dt><dd><span class=\"badge badge--active\">active</span></dd></div> <div><dt>Doc-Type</dt><dd><span class=\"term\" data-term=\"spec\" data-tooltip=\"WHAT (設計意図) を declarative に記述する design-intent 文書。 実装 HOW・決定 WHY と content domain を分離する (P-3 / P-7)。\">spec</span></dd></div> <div><dt>Version</dt><dd>1.2.0</dd></div> <div><dt>Layer</dt><dd>core (Layer 0)</dd></div> <div><dt>Stakeholders</dt><dd>Developer · AI Agent · External Reviewer</dd></div> <div><dt>Depends-on</dt><dd><a href=\"rules.html\">rules</a> · <a href=\"verification.html\">verification</a></dd></div>" }
  - { type: note, html: "<p>本文書は folio の generator が<strong>機械 <span class=\"term\" data-term=\"SSoT\" data-tooltip=\"Single Source of Truth。 ある object / term の唯一の正準定義 site で、 他所はそこへ参照する。 SSoT-first 転換後は層を明示する修飾付き full 形で用いる: canonical SSoT = 提示層 (生成 HTML) 内の機械層 (精密 normative) / edit-SSoT = 正本 = 提示層を produce する編集起点 (contract YAML、 ADR-0051 §2.3)。\">SSoT</span> から生成する SRS プレゼン HTML</strong> の <strong>done-condition (完成判定)</strong> を定義する design-intent spec。 folio 自身の spec を <span class=\"term\" data-term=\"sandbox\" data-tooltip=\"tests/ の決定的 verification framework (scenario YAML + runner + fixtures + golden)。 hook / CLI を mock payload・隔離 root で単体検証する (ADR-0013 / 0017)。\">sandbox</span> で検証する <a href=\"verification.html\">verification.html</a> (<a class=\"xref\" href=\"./verification.html#req-ver-001\" data-tooltip=\"検証 scenario は tests/scenarios/ 配下の YAML ファイル (構造は §3.2 で定義)。\">REQ-VER-001</a>〜023 / <a class=\"xref\" href=\"./verification.html#req-nav-001\" data-tooltip=\"folio validate は folio-generated marker (head-anchored) を持つ生成 index.html を folio build の emit と byte 比較し drift を block する。 marker 無し (hand-authored) index は keystone skip — body の escaped 言及には反応しない。\">REQ-NAV-001</a>〜007) とは <strong>別 audience</strong> (consumer が生成する成果物向け) で、 元は verification.html §3.9 にあった内容を <a href=\"../decisions/ADR-0040-human-layer-presentation-compression.html\">ADR-0040</a> readability box 整合のため独立 spec へ分離したもの。 設計 SSoT は <a href=\"../research/srs-component-taxonomy.html#s5-done-condition\">SRS 部品 taxonomy §5</a>、 生成方式は <a href=\"../decisions/ADR-0042-hybrid-generation-dense-table-readability.html\">ADR-0042</a> / <a href=\"../decisions/ADR-0041-human-layer-visual-design-system.html\">ADR-0041</a>。</p>" }
  - { type: note, html: "<p>本文書は IETF <a href=\"https://datatracker.ietf.org/doc/html/rfc2119\"><strong>RFC 2119</strong></a> および <a href=\"https://datatracker.ietf.org/doc/html/rfc8174\"><strong>RFC 8174</strong></a> / <a href=\"https://datatracker.ietf.org/doc/html/bcp14\"><strong>BCP 14</strong></a> に定義される MUST / SHOULD / MAY のキーワード解釈規約に従う。</p>" }

sections:
  - id: "s0"
    anchor: "s0-reader-guide"
    tint: "info"
    kicker: "§0 / 読み方"
    heading: "§0. Reader's Guide"
    essence: "この spec は、 folio の generator が機械 SSoT (contract + prose YAML) から生成する <strong>SRS プレゼン HTML</strong> が「完成した (GREEN)」と言える条件を定める。 決定的で blocking な <strong><span class=\"term\" data-term=\"floor\" data-tooltip=\"deterministic な機械検査層 (folio validate gate)。 二層 enforcement の下限で、 機械化可能な品質を CI で強制する (ADR-0028)。\">floor</span></strong> と LLM の <strong><span class=\"term\" data-term=\"ceiling\" data-tooltip=\"LLM review 層 (Phase F spec-review agent)。 floor が機械検査できない意味的品質を補完する上限 (ADR-0028)。\">ceiling</span></strong> の二層で、 <strong>floor 単独では GREEN を宣言しない</strong>のが要。"
    blocks: []
    machine_blocks:
      - { type: note, html: "<p>読み方: §1 が<strong>機械/LLM 検証境界</strong> (何を決定的 floor が裁き、 何を LLM ceiling が裁くか) を宣言し、 §2 がその境界に沿って done-condition を REQ-VER-024〜030 で形式化する。 §3 が検証被覆 (RTM)、 §4 が参照。 REQ-VER-001〜023 / REQ-NAV-001〜008 (folio 自身の verification) は姉妹 spec <a href=\"verification.html\">verification.html</a> にある。</p>" }
  - id: "s1"
    anchor: "s1-boundary-model"
    tint: "brand"
    kicker: "§1 / 検証境界"
    heading: "§1. 機械/LLM 検証境界と done-condition モデル"
    essence: "機械 SSoT から生成した SRS プレゼン HTML の完成判定を、 決定的で blocking な <strong>floor</strong> と LLM の <strong>ceiling</strong> の二層で定義する (REQ-VER-024〜030、 SRS 部品 taxonomy §5)。 <strong>機械/LLM 検証境界</strong>: 件数・構造・render・構成同一性など<strong>算術的に自明なもの</strong>だけを floor が blocking で裁き、 自由文の捏造・可読性・意味カバレッジは LLM の ceiling (<span class=\"term\" data-term=\"gate\" data-tooltip=\"folio validate / CI が spec 集合へ課す機械検査の単位。 block (violation = exit 1) と warn (exit code 非影響) の 2 channel を持つ (rules §10.2 / REQ-VER-023)。\">gate</span> J / I / K) が裁く。 一次根拠は fabrication-free-by-construction (<a href=\"rules.html#s12-srs-design-system\">rules §12</a>・構造捏造は構成上不可能) ゆえ、 静的 ban 群は非 blocking の warn 級 backstop に留め、 <strong>floor 単独で GREEN を宣言しない</strong>。"
    blocks: []
    machine_blocks:
      - { type: prose, html: "以下は folio 自身の spec 検証 (<a href=\"verification.html#s3-6-verification-specific\">verification.html §3.6</a> / <a href=\"verification.html#s3-8-nav-req\">§3.8</a>) と異なり、 <strong>consumer が機械 SSoT から生成する SRS プレゼン HTML</strong> の done-condition を定義する (design-system generator <code>.claude-plugin/design-system/generator/</code> が実装)。 設計 SSoT は <a href=\"../research/srs-component-taxonomy.html#s5-done-condition\">SRS 部品 taxonomy §5</a> (二層判定式 floor + ceiling)、 生成方式は <a href=\"../decisions/ADR-0042-hybrid-generation-dense-table-readability.html\">ADR-0042</a> (ハイブリッド = 構造決定的・prose のみ opus) / <a href=\"../decisions/ADR-0041-human-layer-visual-design-system.html\">ADR-0041</a>。 conformance は generator-local の <code>test-adversarial.sh</code> + <code>render-gate-srs.py --selftest</code> (sandbox scenarios でなく generator-local + CI <span class=\"term\" data-term=\"dogfood\" data-tooltip=\"folio 自身を folio の規約・機構で構築し検証する self-application。 規約が実用に耐えるかの検証手段。\">dogfood</span> — 生成物向けゆえ consumer の <code>folio validate</code> には入れない)。 本 spec は taxonomy §5 で設計済みの二層モデルを REQ-VER 形式で形式化する (新規 <span class=\"term\" data-term=\"ADR\" data-tooltip=\"Architecture Decision Record。 設計の WHY (決定・根拠・trade-off) を 1 決定 = 1 文書で記録する frozen な歴史資産 (ADR-worthiness は rules §10.3)。\">ADR</span> を要さない)。 <strong>機械/LLM 検証境界</strong>: 自由文の意味的忠実性 (契約への忠実さ・捏造・矛盾・可読性) は決定的アルゴリズムで判定不能ゆえ、 機械 floor は algorithmic に自明なもの (件数・id・集合・派生・構造の存在/完全性・幾何 render 健全性) <em>のみ</em>を blocking で裁き (escape 健全性の検査は warn 級 backstop の領分)、 意味検証は独立コンテキストの LLM reviewer を複数束ねる ceiling (<a href=\"../research/srs-component-taxonomy.html#s5-done-condition\">taxonomy §5.3</a> gate I/J/K) が担う (確信は reviewer 数と敵対的突合で調整・別建ての決定的安全網を後付けしない)。 その<strong>一次根拠 = fabrication-free-by-construction</strong> (<a href=\"rules.html#s12-srs-design-system\">rules §12</a> が WHAT の SSoT・構造捏造は構成上排除済み) ゆえ、 機械 census (全列挙 backstop) が捏造を再検査するのは重複検査であり、 静的 hidden-render ban 群 (REQ-VER-024) の意味権威は ceiling gate I/J にあり、 これら決定的機構は honest-bug を実捕捉する <strong>warn 級 backstop</strong> (非 blocking) である。 blocking の部品件数照合は <strong>census-count arm</strong> (REQ-VER-024 blocking arm・source DOM の静的件数 ↔ contract 期待件数・render 不要) が、 post-build 改変の検出は<strong>構成同一性 arm</strong> (<a href=\"#req-ver-030\">REQ-VER-030</a>) が担う (機構と検出完全性の論証は同 record が SSoT)。 census closure 語彙の全単射 (REQ-VER-029) は本境界下では<strong>語彙鮮度の floor</strong> である (census 消費の基盤ではない)。 各 REQ-VER の gate 割当・blocking arm と warn 級 backstop の区分は本 spec が SSoT。" }
  - id: "s2"
    anchor: "s2-done-condition-req"
    tint: "violet"
    kicker: "§2 / done-condition"
    heading: "§2. done-condition REQ (REQ-VER-024〜030)"
    essence: "生成 SRS の done-condition を 5 REQ で形式化する (REQ-VER-024〜030・027/028 は欠番)。 各 REQ が §1 の境界のどこ (blocking floor / warn 級 backstop / ceiling) に属すかを、 各 REQ の <span class=\"term\" data-term=\"essence\" data-tooltip=\"defined-object の定義 site の既存内容を再利用した plain-text 要約。 xref tooltip の生成元 (rules §9.2、 新規に書き起こさない = P-7)。\">essence</span> と machine 部の双方に明記する。"
    blocks:
      - type: requirements
        ids: ["REQ-VER-024", "REQ-VER-025", "REQ-VER-026", "REQ-VER-029", "REQ-VER-030"]
  - id: "s3"
    anchor: "s3-coverage-rtm"
    tint: "info"
    kicker: "§3 / 被覆 RTM"
    heading: "§3. Coverage RTM (requirement traceability)"
    essence: "done-condition REQ (024〜030) の検証被覆を一覧する。 <strong>scenario 列が空 = 未検証 gap</strong> を可視化する (VER-030 は scenario spawn 待ち)。"
    blocks:
      - type: table
        caption: "SRS done-condition requirement coverage matrix (REQ-VER-024〜030)"
        headers: ["REQ", "<span class=\"term\" data-term=\"EARS\" data-tooltip=\"Easy Approach to Requirements Syntax。 要件を ubiquitous / event / state / optional / unwanted の 5 pattern で記述する記法。\">EARS</span>", "derives-from", "scenario (verifies)", "verified"]
        rows:
          - ["<a class=\"cov-req\" href=\"#req-ver-024\"><span class=\"badge badge--req\">VER-024</span></a>", "<span class=\"req__ears req__ears--event\">Event</span>", "<a href=\"../research/srs-component-taxonomy.html#s5-done-condition\">taxonomy §5.2</a> / <a href=\"../decisions/ADR-0042-hybrid-generation-dense-table-readability.html\">ADR-0042</a>", "<code>generator/test-adversarial.sh</code> (A22–A33 + RG1-a〜e)", "✓"]
          - ["<a class=\"cov-req\" href=\"#req-ver-025\"><span class=\"badge badge--req\">VER-025</span></a>", "<span class=\"req__ears req__ears--event\">Event</span>", "<a href=\"../research/srs-component-taxonomy.html#s5-done-condition\">taxonomy §5.2</a> gate F / <a href=\"../decisions/ADR-0037-render-safety-ceiling.html\">ADR-0037</a> + <a href=\"../decisions/ADR-0041-human-layer-visual-design-system.html\">ADR-0041</a>", "<code>render-gate-srs.py --selftest</code> + CI <code>render-gate</code> job (CI-only)", "✓"]
          - ["<a class=\"cov-req\" href=\"#req-ver-026\"><span class=\"badge badge--req\">VER-026</span></a>", "<span class=\"req__ears req__ears--ubiquitous\">Ubiq.</span>", "<a href=\"../research/srs-component-taxonomy.html#s5-done-condition\">taxonomy §5.1 / §5.3</a> / <a href=\"../decisions/ADR-0041-human-layer-visual-design-system.html\">ADR-0041</a> §2.5", "<code>test-adversarial.sh</code> A22 (floor≠GREEN) + ceiling agents (LLM)", "✓"]
          - ["<a class=\"cov-req\" href=\"#req-ver-029\"><span class=\"badge badge--req\">VER-029</span></a>", "<span class=\"req__ears req__ears--event\">Event</span>", "bd folio-hef.3 / <a href=\"../research/srs-component-taxonomy.html#s5-done-condition\">taxonomy §5</a> + bd folio-mzn.2 (語彙鮮度 floor)", "<code>verify-census-vocab.sh</code> lock test + genuine (ec / clinic) + <code>verify-graph.sh</code> 非破壊", "✓"]
          - ["<a class=\"cov-req\" href=\"#req-ver-030\"><span class=\"badge badge--req\">VER-030</span></a>", "<span class=\"req__ears req__ears--event\">Event</span>", "<a href=\"rules.html#s12-srs-design-system\">rules §12</a> (fabrication-free-by-construction) / bd folio-mzn.3", "<code>generator/test-adversarial.sh</code> repro-build seed (tamper→FAIL / 生成時刻のみ→PASS / 入力欠落→測定系 error / 正規化 mutation-kill・spawn: bd folio-3d23)", "✗"]
    machine_blocks:
      - { type: prose, html: "各 REQ-VER-* を <strong>derives-from (派生元 taxonomy / ADR) × scenario (検証 file) × verified</strong> で一覧する (<a href=\"constitution.html#p-13\">P-13</a> trace matrix)。 ceiling gate (I/J/K) は LLM ゆえ scenario 列は決定的 floor / selftest を指す。" }
