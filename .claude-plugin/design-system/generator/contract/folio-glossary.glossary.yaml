# folio-glossary.glossary.yaml — machine SSoT for the glossary-pack instance #1 (folio self-host)
# doc_type: glossary (canonical vocabulary). The most "terminal/lookup" doc-type for the generator:
# no chapters/EARS — a flat set of dual-audience term entries.
# Each term is dual-audience: human layer = plain definition (prose slot, opus-authored);
# machine layer = structured record (canonical en・slug/anchor term-<slug>・JSON-LD schema:DefinedTerm・
# cross-doc anchors data-xref-target) in a native <details> fold.
# ★本 contract = glossary の唯一の edit-SSoT (ADR-0052 で SSoT 再指定・folio-9inj の「手動同鏡」から転換):
#   - design-intent/vocabulary.yaml = 本 contract の terms[] からの **生成 projection** (runtime SSoT)。
#     導出は project-vocabulary.sh の全域関数 (canonical ← canonical / domain ← domain /
#     definition ← formal_def)。 語の追加・削除・定義改訂は **本 contract だけ** を編集し、
#     `project-vocabulary.sh --out design-intent/vocabulary.yaml` で再生成して同一 commit で land する。
#     機械強制 = verify-glossary-parity.sh の vocab-projection 節 (committed == fresh projection の
#     whole-file byte 比較・敵対回帰 V16-V22)。 旧「両 file を人手で同鏡」は導出に置換され、 片側編集は
#     projection 再生成で消える (drift が構造的に起こらない)。
#   - design-intent/glossary.html = 本 contract から folio build が pack pipeline
#     (assemble-glossary.sh + inject-prose.sh) 委譲で生成する提示層 canonical (build-orchestrates-pack)。
#     旧 source SSoT だった素朴 emit 版は ADR-0052 で置換済 (Layer 1 consumer 向け内部 emitter は存続)。
#   同 gate は ci.yml の deterministic floor job に blocking step として配線済ゆえ、 手編集・再生成漏れは
#   merge block される (CI 非配線だと「vocabulary.yaml だけ編集 → folio fix → validate green」で本 contract が
#   stale のまま land する fail-open になる = folio-7ts2 の drift と同一クラス)。
#   定義文字列は spec contract 3 本 (folio-rules / folio-verification / folio-relations) の glossary[].def にも
#   複製され、 同 gate の def-parity 節 (DEF_REGISTRY strict・V23-V25) が逐語 pin する。 spec HTML の inline
#   data-tooltip は folio validate (vocabulary.yaml と照合・CI blocking) + verify-spec §11 round-trip (local gate・CI 非配線・配線は folio-vt1t) が連鎖 pin する。
# Schema mirrors srs/adr/spec conventions: cover + terms[] (no chapters; terms are the body).
# fabrication-free: every visible token derives from this contract. plain definitions live in the
# prose manifest (folio-glossary.prose.yaml) and are injected by inject-prose.sh (core, unmodified).
doc_type: glossary
doc_id: folio-glossary
title: "folio glossary — canonical vocabulary"
version: "1.1.0"
# source_spec / source_vocab — instance の由来を記録する documentary field (assemble/verify は読まない)。
# ★ADR-0052 で向きが反転した: 両者は本 contract の *派生先* (glossary.html = pack pipeline 委譲の生成物 /
#   vocabulary.yaml = project-vocabulary.sh の生成 projection)。 flip 前は本 contract がこの 2 file から
#   起こされた (folio-9inj 当時の read-only source) ため、 値は起源の記録として据置く。
source_spec: "design-intent/glossary.html"
source_vocab: "design-intent/vocabulary.yaml"
term_set_id: "folio:glossary"
term_set_name: "folio canonical vocabulary"
# graph node 識別 + 前方照会 (verify-graph.sh が読む graph メタ・HTML には render しない)。
# spec-pack 同型: meta.doc_id = 大文字 graph node ID、 cross_doc_refs = principle 終端 (P-5 canonical naming) への
# 前方照会。 glossary は canonical-name の SSoT ゆえ P-5 (constitution) を実装根拠として前方照会する非 edgeless node。
meta:
  doc_id: "FOLIO-GLOSSARY"
  doc_type: "glossary"
  # cover-head / cover-tail (core_emit_cover_head / _tail) が読む cover の SSoT
  # (spec-pack 同型: graph node 識別の doc_id/doc_type と cover メタを同居)。
  title: "folio glossary"
  eyebrow_left: "用語集 (Glossary)"
  eyebrow_right: "folio — canonical vocabulary"
  subtitle: "folio-framework 語の canonical 定義集 — 非エンジニアにも届く平易定義 + 機械可読 term レコードの dual-audience 用語集"
  version: "1.1.0"
  reader: "folio を読む全ての人 — 非エンジニアの読者と、 用語を参照する機械 (CLI / 他 spec の .term) の双方"
cross_doc_refs:
  - rel: "constitution"
    target: "P-5"
    note: "canonical naming principle — glossary が canonical-name SSoT を担う実装根拠"
# graph.principle_edge — verify-graph.sh が読む前方照会 edge (spec-pack 同型)。 cross_doc_refs (上) は
# human 可読の照会記述、 こちらは graph reader が消費する機械 edge (role=implementation・target=FOLIO-CONSTITUTION 終端)。
# glossary は canonical-name SSoT として P-5 (constitution) を実装根拠に前方照会する非 edgeless node ゆえ
# principle 終端へ到達する edge を 1 本張る (rolemap/glossary.rolemap.yaml edges[] と二重担保)。
graph:
  principle_edge:
    target_doc_id: "FOLIO-CONSTITUTION"
    role: "implementation"
# canonical_page — 「本 contract の生成物は folio canonical page (design-intent/glossary.html) であり
# folio build が pack pipeline へ委譲して生成・維持する」宣言 (ADR-0052 build-orchestrates-pack)。
# ★条件 emit の弁別 field: 本 block を持つ contract の出力にだけ assemble-glossary.sh が folio scanner
#   互換 head (folio-generated marker / folio-doc-type / folio-status / design-intent 相対 @id) を emit する。
#   clinic-appointment.glossary.yaml は generator demo suite = canonical page でないゆえ本 block を持たず、
#   marker 非付与で出力 byte 不変。 marker を無条件 hardcode すると demo 成果物に虚偽の「folio build 生成物」
#   marker が付き、 folio build/validate の marker keystone (marker 持ち page だけを drift 検査する) を
#   汚染する (folio-wg2l fence「clinic 汚染防止」)。
# ★folio-generated の値は folio build/validate 側の keystone 判定 (== "folio-build") と一致必須。
#   委譲の precondition (graph.principle_edge + meta.doc_id の実在) は bin/folio 側が hard-fail で検査する。
canonical_page:
  id: "./glossary.html"          # <head> JSON-LD の DefinedTermSet @id (design-intent 相対) + 各 term の inDefinedTermSet
  generated_by: "folio-build"    # <meta name="folio-generated" content="…"> = nav-regen-drift / build --check の keystone
  doc_type: "glossary"           # <meta name="folio-doc-type" content="…">
  status: "active"               # <meta name="folio-status" content="…">
cover:
  # eyebrow / title / subtitle / reader / cover-summary は .meta.* (core cover-head/_tail) が SSoT。
  # ここは bespoke の cover-meta dl (verify-glossary §6 が .cover.meta[] を突合) のみを持つ。
  meta:
    - label: "doc-type"
      value: "glossary (用語集)"
    - label: "status"
      value: "active"
    - label: "version"
      value: "1.1.0"
    - label: "用語数"
      value: "36"
    - label: "読了目安"
      value: "約 12 分"
footer:
  gen_meta: "folio design-system generator — glossary-pack (instance #1 / folio self-host)"
  # instance タグ (footer chrome の出自 span)。 assembler の hardcode を contract 由来へ parametrize
  # (folio-c5r.3 ceiling BLK-FOOTER-INSTANCE-TAG)。 本値は旧 hardcode と同一 = 出力 byte 不変。
  instance_tag: "folio self-host (instance#1)"
# approval-block (core_emit_approval_block) — doc-meta 形 (spec-pack 同型)。 用語集は
# vocabulary.yaml SSoT から派生する自己適用ゆえ stamp は self (= 承認済以外) で表示される。
approval:
  - role: "文書種別"
    who: "glossary (canonical vocabulary)"
    when: "v1.1.0"
    stamp: "active"
  - role: "生成 (engine glossary-pack)"
    who: "folio design system"
    when: "2026-06-24 生成"
    stamp: "生成"
# chrome glossary-term-table (core emit_glossary) — 主題語 terms[] とは別。 用語集ページ自体の
# 構造 (dual-audience / 機械層) を読み解くための doc-mechanics 補助語 (非エンジニアの道標)。
glossary:
  - term: "dual-audience"
    en: "dual-audience"
    def: "1 つのページを、 人が読む平易な説明と機械が読む正確な記録の両方に使う作り。 この用語集では各語が平易定義 (人) と term レコード (機械) を併せ持つ。"
  - term: "machine layer"
    en: "machine layer"
    def: "各語の折り畳み (details) の中にある、 機械が参照するための構造化記録 (正式名・anchor・domain・JSON-LD)。"
  - term: "self-host"
    en: "self-host"
    def: "folio が自分自身の言葉を folio のやり方で記述すること。 この用語集は folio 語を folio の generator で生成した自己適用 (dogfood) の一例。"
# domain 区分 (人間層の signpost・PW-01 / folio-229)。 order + friendly label の SSoT。 assemble は
# terms[] が domains 順に連続グループ化されていることを不変条件で強制し、 各 domain を人間層 section 見出し
# (domain-heading) + TOC (glossary-toc) へ render する。 folio-framework は単一 domain (folio-closed) だが
# 単一でも成立する設計 (1 section + 1 TOC entry)。 domain 別語数は terms から導出 (magic number 不可・folio-bhe)。
domains:
  - id: "folio-closed"
    label: "folio-framework の言葉"
# xref friendly gloss (人間層 term-usage『使われる文書:』行・PW-02 / folio-229)。 各 term の cross_refs の
# 生 doc-ID を非エンジニア可読な日本語ラベルへ。 key = terms[].cross_refs に現れる全 token を網羅
# (assemble が欠落を fail-closed)。 機械層 fold の生 doc-ID (data-xref-target) と dual-audience に対応。
xref_gloss:
  "P-3": "原則 P-3"
  "P-5": "原則 P-5"
  "P-7": "原則 P-7"
  "P-10": "原則 P-10"
  "rules §10.3": "ルール §10.3"
  "rules §9.2": "ルール §9.2"
  "rules §10.2": "ルール §10.2"
  "rules §11.2": "ルール §11.2"
  "folio-self-spec §2": "自己仕様 §2"
  "REQ-VER-010": "検証要件 REQ-VER-010"
  "REQ-VER-012": "検証要件 REQ-VER-012"
  "REQ-VER-023": "検証要件 REQ-VER-023"
  "REQ-VER-004": "検証要件 REQ-VER-004"
  "REQ-VER-011": "検証要件 REQ-VER-011"
  "ADR-0033": "決定 ADR-0033"
  "ADR-0028": "決定 ADR-0028"
  "ADR-0034": "決定 ADR-0034"
  "ADR-0006": "決定 ADR-0006"
  "ADR-0013": "決定 ADR-0013"
  "ADR-0017": "決定 ADR-0017"
  "ADR-0039 §2.3": "決定 ADR-0039 §2.3"
  "ADR-0039 §2.2": "決定 ADR-0039 §2.2"
  "ADR-0050": "決定 ADR-0050"
  "ADR-0051 §2.3": "決定 ADR-0051 §2.3"
terms:
  # --- 1.0.0 starter set: 中核 8 語 (folio-作法の最頻出語、 ADR-0036 §3 / #130 grill 確定) ---
  - canonical: "spec"
    en: "spec"
    slug: "spec"
    domain: "folio-closed"
    formal_def: "WHAT (設計意図) を declarative に記述する design-intent 文書。 実装 HOW・決定 WHY と content domain を分離する (P-3 / P-7)。"
    plain_slot: "plain-spec"
    cross_refs:
      - "P-3"
      - "P-7"
  - canonical: "ADR"
    en: "ADR"
    slug: "ADR"
    domain: "folio-closed"
    formal_def: "Architecture Decision Record。 設計の WHY (決定・根拠・trade-off) を 1 決定 = 1 文書で記録する frozen な歴史資産 (ADR-worthiness は rules §10.3)。"
    plain_slot: "plain-ADR"
    cross_refs:
      - "rules §10.3"
  - canonical: "constitution"
    en: "constitution"
    slug: "constitution"
    domain: "folio-closed"
    formal_def: "folio の不変原則 (P-1〜P-14) を定める最上位 spec。 Amendment は user 承認必須・spec graph scan 対象外の特別枠 (P-10)。"
    plain_slot: "plain-constitution"
    cross_refs:
      - "P-10"
  - canonical: "invariant"
    en: "invariant"
    slug: "invariant"
    domain: "folio-closed"
    formal_def: "spec が常に満たすべき構造的・意味的な不変条件。 EARS 要件と folio validate gate が機械的に保証する。"
    plain_slot: "plain-invariant"
    cross_refs: []
  - canonical: "inventory"
    en: "inventory"
    slug: "inventory"
    domain: "folio-closed"
    formal_def: "design-intent 空間の全 spec を <head> JSON-LD から走査して生成する機械可読 index (inventory.json)。 prime digest と object-graph の projection 元 (REQ-VER-010)。"
    plain_slot: "plain-inventory"
    cross_refs:
      - "REQ-VER-010"
  - canonical: "prime"
    en: "prime"
    slug: "prime"
    domain: "folio-closed"
    formal_def: "inventory から progressive disclosure 用の Tier 1 digest を生成する subcommand。 AI への context 注入に使う (REQ-VER-012)。"
    plain_slot: "plain-prime"
    cross_refs:
      - "REQ-VER-012"
  - canonical: "cluster"
    en: "cluster"
    slug: "cluster"
    domain: "folio-closed"
    formal_def: "design-intent/ 内の content domain 別ディレクトリ (spec / decisions / research)。 各 cluster は README.html を index に持つ (P-7 3-domain、 具体 dir 名は folio-self-spec §2)。"
    plain_slot: "plain-cluster"
    cross_refs:
      - "P-7"
      - "folio-self-spec §2"
  - canonical: "vocabulary"
    en: "vocabulary"
    slug: "vocabulary"
    domain: "folio-closed"
    formal_def: "folio-framework 語の canonical 定義を保持する YAML (vocabulary.yaml)。 folio fix の tooltip populate と folio build の glossary.html derive が読む runtime SSoT (P-5)。 SSoT-first に flip した folio 自身では編集の正本 (edit-SSoT) は glossary contract YAML 側にあり、 本 file はその逐語同鏡。 flip しない Layer 1 consumer では本 file が edit-SSoT を兼ねる (ADR-0051 §2.3)。"
    plain_slot: "plain-vocabulary"
    cross_refs:
      - "P-5"
  # --- 既収録 folio-framework 語 (xref/dual-audience 系譜で author 済) ---
  - canonical: "SSoT"
    en: "SSoT"
    slug: "SSoT"
    domain: "folio-closed"
    formal_def: "Single Source of Truth。 ある object / term の唯一の正準定義 site で、 他所はそこへ参照する。 SSoT-first 転換後は層を明示する修飾付き full 形で用いる: canonical SSoT = 提示層 (生成 HTML) 内の機械層 (精密 normative) / edit-SSoT = 正本 = 提示層を produce する編集起点 (contract YAML、 ADR-0051 §2.3)。"
    plain_slot: "plain-SSoT"
    cross_refs:
      - "ADR-0051 §2.3"
  - canonical: "dual-audience"
    en: "dual-audience"
    slug: "dual-audience"
    domain: "folio-closed"
    formal_def: "1 HTML artifact が machine (精密 normative = canonical SSoT) と human (essence + 視覚 view) の双方を同一 DOM に併せ持つ pattern (ADR-0033)。 artifact 自身が canonical WHAT (提示層) で機械層はその内部にある。 SSoT-first に flip した doc は編集の源が正本 (edit-SSoT) = contract YAML に分かれ、 flip しない doc は提示層が edit-SSoT を兼ねる (ADR-0050 / ADR-0051 §2.3)。"
    plain_slot: "plain-dual-audience"
    cross_refs:
