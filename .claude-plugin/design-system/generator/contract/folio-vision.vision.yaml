  eyebrow_left: folio design-intent / vision
  eyebrow_right: なぜ作るかの宣言
  subtitle: なぜ folio を作るのか。 北極星 (目指す状態) と、 そこへ向かう目標・成功基準・機能の方向をまとめる
  version: "0.1"
  date: "2026-07-04"
