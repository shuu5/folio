# folio 文書規律エンジン — vision-pack 入力 contract (instance#2 / folio-self・folio-qvv)
#
# ドメイン: folio 自身。 北極星 folio-7wn (非エンジニア×機械 両対応の完璧文書生成ツール) を、 folio の
# design-intent/ suite の vision 文書として self-host する (記述型 instance#2・qvv 裁定 2026-07-04)。
# 内容の接地 (fidelity anchor): bd folio-7wn description (grill-me 2026-06-16 の 5 論点確定) +
# research/document-discipline-engine-design.html §1 + auto-memory folio-ultimate-vision-generalized-doc-tool.md。
#
# ★instance#1 (clinic) との構造差 = opt-in の非発火 3 点 (質的 vision の反例実証・grill 論点5 + qvv 裁定A):
#   - cross_doc 節なし: folio は SRS を持たず、 rules への照会は「グラフ充足のための照会作文」になるため
#     非発火が honest (照会先文書が生まれたら結ぶ)。 refs.srs は空配列 [] を明示 (片肺 contract の fail-closed)。
#   - pitch なし / goal_tree なし: 質的 vision (定量 metric 無し) ゆえ Moore 文法・目標ツリーは張らない。
#   - success_criteria は「数字」でなく「達成できたと言える状態」(質的な物差し) で書く。
# 終端 = inline principle 自己終端 (clinic 同型・qvv 裁定B)。 constitution は特別枠ゆえ機械 edge は張らない
#   (narrative の人間層言及のみ)。
#
# 読者 = folio が何のためにあるのかを知りたい人 (開発の専門知識は不要・専門語はやさしい言葉を併記)。

doc_type: vision

