# §1 北極星 (north_star)。 text = 目指す状態を言い切る一文 / narrative = なぜその状態かの叙述本体。
north_star:
  text: どんなプロジェクトの文書も、 専門家でない人が頑張れば読め、 機械が黙って検証できる 「完璧な文書一式」 として生成できる状態にする。
  narrative: 文書には二つの病気があります。 「書いた人と同じ専門知識がないと読めない」 ことと、 「書かれた瞬間から実体とずれて静かに嘘になっていく」 ことです。 folio は、 人間向けのやさしい層と機械向けの厳密な層を同じ 1 枚のページに同居させ、 構造は機械が毎回検査し、 意味は独立のレビュワーが敵対的に確かめる — という規律で、 自分自身の文書からこの病気を取り除いてきました。 目指す状態は、 この規律を folio 固有のものにしておかず一般化し、 どんなプロジェクトでも 「読める・検証できる・古びない」 文書一式が当たり前に手に入ることです。

# §2 解くに値する問題 (problem)。 非発火 (cross_doc なし) ゆえ no_restate は持たない。
problem:
  paragraphs:
    - ソフトウェアの文書は、 多くの場合ふたりの読者のどちらかを諦めています。 専門家向けに書けば発注者や現場の人が読めず、 やさしく書けば厳密さが失われて機械や検証の役に立ちません。 その結果、 「読まれない正式文書」 と 「正しさを誰も保証しないやさしい説明」 が別々に増えていきます。
    - もう一つの病気は劣化です。 コードや決定は動き続けるのに、 文書は書かれた瞬間から止まっています。 実体との食い違いを見つける仕組みがなければ文書は静かに嘘になり、 嘘になった文書は読まれなくなり、 読まれない文書は直されません。 この悪循環は、 書き手の注意力や善意では止まりません。

# §3 関係者 (stakeholders)。 gain = このビジョンがその立場に約束する「得るもの」(操作でなく便益)。
stakeholders:
  entries:
    - { id: ST-1, name: 発注者・事業側の読者 (非エンジニア), gain: 専門知識がなくても、 頑張れば文書一式を自分の言葉で理解でき、 「わかったつもり」 のまま承認しなくてよくなる。 }
    - { id: ST-2, name: 書き手 (エンジニア・文書作成者),     gain: 読みやすさと厳密さの両立を個人技で背負わされない。 規律の実行と検査はエンジンが肩代わりする。 }
    - { id: ST-3, name: 機械の読み手 (AI エージェント・検証系), gain: 文書のどこを読めば正確なデータが得られるかが構造で保証され、 推測に頼らず検証や生成に使える。 }
    - { id: ST-4, name: プロジェクトの将来のメンバー,        gain: 文書と実体のずれが仕組みで検出されるため、 古い文書に騙されずに合流できる。 }

# §4 目標 (objectives) + 成功基準 (success_criteria)。 ★質的 vision: SC は数字でなく「達成できたと言える状態」。
objectives:
  - { id: G-1, name: ふたりの読者の両立, desc: 同じ 1 枚の文書が、 非エンジニアの読解と機械の検証の両方に耐える状態にする (人間層と機械層の同居 = dual-audience)。 }
  - { id: G-2, name: 嘘を仕組みで防ぐ,   desc: 捏造・脱落・実体との食い違いを、 決定的な機械検査と独立レビュワーの二層で見つかる状態にする (二層を床 = floor・天井 = ceiling と呼ぶ)。 }
  - { id: G-3, name: どこでも同じ規律,   desc: folio 固有でなく、 どんなプロジェクトのどんな文書種にも同じ規律を着せられる状態にする。 }

success_criteria:
  entries:
    - { id: SC-1, name: 説明なしで歩ける,           desc: 予備知識のない読者が、 案内なしで文書一式を読み歩き、 「何を・なぜ・どう確かめるか」 を自分の言葉で言い直せる。, for_goal: G-1 }
    - { id: SC-2, name: 全文書が二層検査済み,       desc: 出荷される文書は例外なく、 機械検査 (floor) と独立レビュー (ceiling) の両方を通過している。, for_goal: G-2 }
    - { id: SC-3, name: 新しい文書種は差し込むだけ, desc: 新しい文書種やプロジェクトの追加が、 エンジン本体の変更なしに部品 (パック) の追加だけで済む。, for_goal: G-3 }

# §5 主要機能の方向 (features)。 ★folio は照会先の要件文書 (SRS) をまだ持たないため refs.srs は空配列を明示
#   (cross_doc 非発火・照会先が生まれたら結ぶ)。 方向の接地は folio-7wn grill 5 論点。
features:
  - id: F-1
    name: ふたりの読者へ同時に組み上げる
    desc: 機械の正本 (契約データ) から、 人間向けの読みやすい層と機械向けの厳密な層を、 同じ 1 枚のページへ決定的に組み上げる。 元データに無いことは書けない。
    refs:
      srs: []
  - id: F-2
    name: 二層の検証を標準にする
    desc: 構造・件数・つながりは決定的な機械検査 (floor) が毎回固め、 意味の忠実さ (捏造・歪み・読み味) は独立した AI レビュワー (ceiling) が敵対的に確かめる。 両方を通らない文書は出荷しない。
    refs:
      srs: []
  - id: F-3
    name: 文書種パックを電池同梱する
    desc: 要件定義・設計判断の記録・調査記録・不変原則・用語集などの定番文書種を 「パック」 として同梱し、 薄い共通エンジンの上で差し替えられるようにする。
    refs:
      srs: []
  - id: F-4
    name: 文書一式を照会でつなぐ
    desc: 文書同士の 「なぜ」 を照会リンクでつなぎ、 どの記述からたどっても最終的に動かせない原則へ行き着くことを機械が確かめられるようにする。
    refs:
      srs: []

# §6 リスク (risks) + 非目標 (non_goals)。 非発火ゆえ non_goals は照会 (srs_code/srs_label) を持たない。
risks:
  - { id: R-1, name: 規律の重さで書き手が離れる, desc: 規律の実行コストが書き手の負担として漏れ出すと、 文書を書くこと自体が避けられ、 規律ごと放棄される。 規律はエンジンが背負うのが前提。 }
  - { id: R-2, name: 機械化のやりすぎ,           desc: 意味の正しさまで決定的プログラムで裁こうとすると、 検査は際限なく複雑化し (悪い形を列挙し続ける罠)、 それ自体が保守の重荷になる。 機械は数えられるものだけを持ち、 意味は独立レビュワーに委ねる。 }
  - { id: R-3, name: 生成物の専門家退行,         desc: 「専門家ならなんとか読める」 水準で満足すると、 北極星 (非エンジニアが読める) から静かに遠ざかる。 読みやすさの検査を専門家の目だけで行うと起きる。 }

non_goals:
  text: 文書の中身を人の代わりに考えるツールは作りません。 何を約束し何を決めるかは人が書き、 folio はそれが 「読める・検証できる・古びない」 形であり続けることだけを引き受けます。 また、 汎用のエディタやプロジェクト管理ツールも作りません。 軸は文書規律の一点です (R-3 と同じく、 軸を守るための線引き)。

# §7 指針価値 (principle = 照会 graph の終端・inline 自己終端 = qvv 裁定B)。
principle:
  id: PRIN-READER-FLOOR
  text: 「専門家なら読める」 を合格にしない。 迷ったら、 非エンジニアの読者が読める側・機械が検証できる側に倒し、 その両立のためなら機能の多さと生成の速さを諦める。
  narrative: これは北極星の言い換えではなく、 判断の規則です。 たとえば 「専門用語のままにすれば早く出せる」 という提案は、 速さより読者を優先するこの原則が退けます。 逆に 「やさしくするために厳密さを削る」 という提案も、 機械が検証できる側を守るこの原則が退けます。 機能・速度・読みやすさ・検証可能性がぶつかったとき、 ここが最後の判定基準です。

