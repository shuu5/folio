      - { type: subhead, anchor: "s3-5-ears-mapping", heading: "§3.5 EARS → Gherkin 1:1 mapping", essence: "各 EARS pattern と Gherkin 構文 (Given / When / Then) の 1:1 対応を下表に示す。" }
