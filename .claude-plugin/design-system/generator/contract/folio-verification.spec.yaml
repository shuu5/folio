  doc_id: FOLIO-VERIFICATION
  doc_type: spec
  title: "folio verification — sandbox verification framework spec"
  eyebrow_left: "仕様 (Spec)"
  eyebrow_right: "folio — sandbox verification framework"
  subtitle: "v1.2.0 · status: active · sandbox verification framework spec (機能単位 use case verification の SSoT)"
  version: "1.2.0"
  date: "2026-06-24"
  status: "active"
  reader: "Developer, AI Agent, External Reviewer — folio を consume する開発者・AI Agent・外部レビュアー"
  layer: "core"
  glossary_automark: "enabled"
  xref_completeness: "enabled"
  stakeholders: ["Developer", "AI Agent", "External Reviewer"]

