requirements:
  - id: "REQ-VER-001"
    anchor: "req-ver-001"
    ears_pattern: "ubiquitous"
    essence: "検証 scenario は <code>tests/scenarios/</code> 配下の YAML ファイル (構造は §3.2 で定義)。"
    statement: "<span class=\"ears-id\">REQ-VER-001</span>: Each verification scenario file <span class=\"ears-shall\">SHALL</span> be a YAML file placed under <code>tests/scenarios/</code> with the structure defined in §3.2."
  - id: "REQ-VER-002"
    anchor: "req-ver-002"
    ears_pattern: "ubiquitous"
    essence: "各 scenario は canonical な <code>req_id</code> を 1 つ参照する (<a href=\"rules.html#s10-mandatory\">rules §10</a> / <a href=\"relations.html#s5-3-ears\">relations §5.3</a>、 または verification 固有の REQ-VER-*)。"
    statement: "<span class=\"ears-id\">REQ-VER-002</span>: Each scenario <span class=\"ears-shall\">SHALL</span> reference one canonical <code>req_id</code> from <a href=\"rules.html#s10-mandatory\">rules.html §10</a> (REQ-CM-* / REQ-CI-*) or <a href=\"relations.html#s5-3-ears\">relations.html §5.3</a> (REQ-REL-*), or be a verification-specific REQ-VER-* defined in this §3."
  - id: "REQ-VER-003"
    anchor: "req-ver-003"
    ears_pattern: "ubiquitous"
    essence: "scenario の assertion 主軸は <code>exit_code</code> とする。"
    statement: "<span class=\"ears-id\">REQ-VER-003</span>: Each scenario <code>expect</code> block <span class=\"ears-shall\">SHALL</span> specify <code>exit_code</code> as the primary assertion."
  - id: "REQ-VER-006"
    anchor: "req-ver-006"
    ears_pattern: "ubiquitous"
    essence: "scenario assertion は <code>permissionDecision</code> JSON を主軸に<strong>すべきでない</strong> (upstream bug 既知ゆえ、 §3.3 の <code>exit_code</code> 中心と対)。"
    statement: "<span class=\"ears-id\">REQ-VER-006</span>: Scenario assertion <span class=\"ears-shall\">SHOULD NOT</span> rely on <code>permissionDecision</code> JSON output as primary, due to known upstream bugs (Issue #37210 / #33106 / #39344 / #18312、 すべて Closed/not planned 状態 ―― 詳細は <a href=\"../research/plugin-sandbox-verification-research.html#s2-6-deny-bug\">research §2.6</a>)。"
  - id: "REQ-VER-004"
    anchor: "req-ver-004"
    ears_pattern: "ubiquitous"
    essence: "golden baseline は TypeScript compiler 流 2-dir model (<code>reference/</code> = VCS golden / <code>local/</code> = 実行生成・gitignore)。 更新は明示的 accept workflow (<code>--accept</code>) を経る。"
    statement: "<span class=\"ears-id\">REQ-VER-004</span>: baseline file <span class=\"ears-shall\">SHALL</span> follow the TypeScript compiler 2-dir model: <code>tests/baselines/reference/</code> (VCS 管理、 golden) vs <code>tests/baselines/local/</code> (実行生成、 .gitignore)。 baseline 更新は明示的 accept workflow (例: <code>runner.sh --accept</code>) を経る MUST。"
  - id: "REQ-VER-007"
    anchor: "req-ver-007"
    ears_pattern: "unwanted"
    essence: "<code>spec_path</code> 外への spec (<code>.html</code>) 作成は、 PreToolUse path-boundary hook が deny する (exit 2)。"
    statement: "<span class=\"ears-id\">REQ-VER-007</span>: IF a Write tool creates a <code>.html</code> file carrying <code>&lt;meta name=\"folio-doc-type\" content=\"spec\"&gt;</code> outside the configured <code>spec_path</code>, THEN the PreToolUse path-boundary hook <span class=\"ears-shall\">SHALL</span> deny (exit 2)。 scenario: <code>scenarios/path-boundary.yaml</code> (<a class=\"xref\" href=\"../decisions/ADR-0003-plugin-architecture.html\" data-tooltip=\"folio v0.4.2-draft\">ADR-0003</a> §2.1 Option Pragmatic、 絶対 path 配下も第 2 branch <code>*\"/$2\"*</code> で gate)。"
  - id: "REQ-VER-008"
    anchor: "req-ver-008"
    ears_pattern: "unwanted"
    essence: "<span class=\"term\" data-term=\"cluster\" data-tooltip=\"design-intent/ 内の content domain 別ディレクトリ (spec / decisions / research)。 各 cluster は README.html を index に持つ (P-7 3-domain、 具体 dir 名は folio-self-spec §2)。\">cluster</span> の <code>README.html</code> index に未掲載の新規 <code>.html</code> 作成は、 PostToolUse README-index hook が notify する (exit 2、 file は作成済の staleness 通知)。"
    statement: "<span class=\"ears-id\">REQ-VER-008</span>: IF a Write tool creates a <code>.html</code> file under a cluster directory that contains a <code>README.html</code> index, and the new file is not listed in that index, THEN the PostToolUse README-index hook <span class=\"ears-shall\">SHALL</span> notify (exit 2、 PostToolUse のため file は作成済)。 scenario: <code>scenarios/readme-index.yaml</code>。 これは check 型 staleness 通知で、 ADR-0003 §2.1「README update」の試作 slice。 ADR literal は「自動更新 (mutate)」だが 試作は check 型を採用 (divergence trace = specs/README.html §6.2)。"
  - id: "REQ-VER-009"
    anchor: "req-ver-009"
    ears_pattern: "event-driven"
    essence: "live-load した session で plugin を統合検証するとき、 agent が <a href=\"../../tests/e2e/runbook.md\">e2e runbook</a> を実 Edit/Write で歩いて live hook を発火させ、 観察を golden baseline に記録する。 一次 assertion = <strong>file 作成有無</strong> (deny ⇒ 不在 / notify ⇒ 存在)。"
    statement: "<span class=\"ears-id\">REQ-VER-009</span>: <span class=\"ears-when\">WHEN the folio plugin is verified as an integrated tool in a live-loaded session (§4.1 Step 2 worktree integration)</span>, an agent <span class=\"ears-shall\">SHALL</span> walk the e2e runbook scenarios (<code>tests/e2e/runbook.md</code>) by issuing real Edit/Write tool calls so the live hooks fire, and <span class=\"ears-shall\">SHALL</span> record per-scenario observations as golden baselines under <code>tests/e2e/baselines/reference/</code>。 primary assertion = <strong>file 作成有無</strong> (PreToolUse deny ⇒ file 不在、 PostToolUse notify ⇒ file 存在 + 通知)。 deny は transcript に確実には現れない (<a href=\"../research/plugin-sandbox-verification-research.html#s2-6-deny-bug\">research §2.6</a>) ため、 exit code でなく file system state を一次 assertion とする。 実装 = <a href=\"../../tests/e2e/README.html\">tests/e2e/</a> (runbook + golden、 sandbox 単体テストの mock payload 検証 (REQ-VER-001〜008) とは別 layer の統合検証)。"
  - id: "REQ-VER-010"
    anchor: "req-ver-010"
    ears_pattern: "event-driven"
    essence: "<code>folio inventory</code> は <a href=\"relations.html#s4-1-structure\">relations §4.1 schema</a> 準拠の <code>inventory.json</code> を生成する (§4.4.1 の dir を走査、 cli-golden diff で検証、 非決定的 <code>generatedAt</code> は除外)。"
    statement: "<span class=\"ears-id\">REQ-VER-010</span>: <span class=\"ears-when\">WHEN the <code>folio inventory</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> produce an <code>inventory.json</code> conforming to the <a href=\"relations.html#s4-1-structure\">relations.html §4.1 schema</a> (required fields <code>$schema</code> / <code>generatedAt</code> / <code>folioVersion</code> / <code>specs[]</code>), scanning the directories defined in <a href=\"relations.html#s4-4-1-scan\">relations.html §4.4.1</a>。 conformance は §3.4 golden baseline との <code>kind: cli-golden</code> diff で検証する (非決定的 <code>generatedAt</code> は <code>normalize.exclude_paths</code> で除外)。 scenario: <code>scenarios/inventory-gen.yaml</code> (REQ-VER-011 <span class=\"term\" data-term=\"harness\" data-tooltip=\"scenario を実行し assertion する runner 実装 (tests/runner.sh)。 kind (hook / cli-golden / cli-scaffold 等) ごとの実行経路を持つ (REQ-VER-011)。\">harness</span> が実行)。"
  - id: "REQ-VER-011"
    anchor: "req-ver-011"
    ears_pattern: "event-driven"
    essence: "<code>kind: cli-golden</code> の scenario は、 harness が <code>bin/folio</code> を repo root で実行し output と golden を <code>jq</code> 正規化して byte-exact 比較 + <code>exit_code</code> 一致を assert する (CLI 検証の SSoT、 hook 経路と別)。"
    statement: "<span class=\"ears-id\">REQ-VER-011</span>: <span class=\"ears-when\">WHEN a scenario carries <code>kind: cli-golden</code></span>, the verification harness <span class=\"ears-shall\">SHALL</span> (1) run <code>bin/folio</code> with the scenario <code>command</code> at repo root, (2) normalize both the produced <code>output_file</code> and the <code>golden</code> via <code>jq -S</code> with <code>normalize.exclude_paths</code> deleted, and (3) assert byte-exact equality of the normalized JSON plus <code>exit_code</code> match。 golden 更新は明示的 accept workflow (<code>--accept</code>、 §3.4 REQ-VER-004) を経る MUST。 これは hook scenario (<code>kind: hook</code>) の exit-code 中心 assertion (REQ-VER-003) とは 別の assertion 経路を成す (CLI subcommand 検証の SSoT、 <a href=\"../decisions/ADR-0018-cli-golden-harness.html\">ADR-0018</a> で trace)。"
  - id: "REQ-VER-012"
    anchor: "req-ver-012"
    ears_pattern: "event-driven"
    essence: "<code>folio prime</code> は Tier 1 inventory digest (per-spec <code>@id</code>/<code>title</code>/<code>summary</code>/<code>doc-type</code>/<code>status</code>) を stdout に出力する (<code>inventory.json</code> stale なら自動再生成、 実 context 注入は SessionStart e2e で検証)。"
    statement: "<span class=\"ears-id\">REQ-VER-012</span>: <span class=\"ears-when\">WHEN the <code>folio prime</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> emit a Tier 1 inventory digest (per-spec <code>@id</code> / <code>title</code> / <code>summary</code> / <code>doc-type</code> / <code>status</code>、 <a href=\"relations.html#s4-2-tier\">relations.html §4.2 Tier 1</a>) to stdout as agent-readable text, auto-regenerating <code>inventory.json</code> if missing or stale (<a href=\"../decisions/ADR-0007-context-injection.html\">ADR-0007 §2.4</a>)。 conformance は §3.4 golden baseline との <code>kind: cli-golden</code> (<code>capture: stdout</code> + <code>compare: text</code>) diff で検証する。 scenario: <code>scenarios/prime-digest.yaml</code>。 SessionStart hook による実 context 注入 (<a class=\"xref\" href=\"../decisions/ADR-0007-context-injection.html\" data-tooltip=\"forward (user 承認済、 実装は Track 2 spawn)\">ADR-0007</a> §2.1、 matcher 省略で全 source 発火) は e2e (REQ-VER-009 型) で検証 = <strong>SessionStart:startup 注入 PASS</strong> (fresh session で Tier 1 digest が context に注入されることを確認)。 PreCompact は ADR-0007 amend (2026-05-25) で除去 (stdout 非注入)。"
  - id: "REQ-VER-013"
    anchor: "req-ver-013"
    ears_pattern: "event-driven"
    essence: "<code>folio validate</code> は spec 集合を走査し <strong>(a) internal link-integrity + (b) jsonld structural</strong> の 2 gate を検査する (exit 0=clean / 1=violation / 2=tool error、 <code>--root</code> で検査 root override 可、 prose gate は試作 scope 外)。"
    statement: "<span class=\"ears-id\">REQ-VER-013</span>: <span class=\"ears-when\">WHEN the <code>folio validate</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> scan the spec set (<a href=\"relations.html#s4-4-1-scan\">relations.html §4.4.1</a> と同一 = <code>design-intent/{spec,decisions,research}</code> の <code>&lt;head&gt;</code> JSON-LD <code>.html</code>) and check two gates: (a) <strong>internal link-integrity</strong> — each JSON-LD relation <code>@id</code> resolves to an existing target file, and any <code>#anchor</code> resolves to an existing <code>id</code> in that target (<a href=\"rules.html#s10-2\">REQ-CI-010</a> の (b)+(c)); (b) <strong>jsonld structural</strong> — parse + required <code>@context</code>/<code>@id</code>/<code>@type</code> + <code>@context</code> == object (<a href=\"rules.html#s10-2\">REQ-CI-016</a>、 <a href=\"../decisions/ADR-0004-jsonld-lint-mechanism.html\">ADR-0004</a> Option B Light)。 exit code は <strong>0 = clean / 1 = violation 検出 / 2 = tool error</strong> (jq 不在等、 fail-closed)、 違反は human-readable report を stdout 出力する。 検査 root の override (test isolation) を提供する <span class=\"ears-shall\">MUST</span>。 external URL check と prose gate (<a class=\"xref\" href=\"./rules.html#req-ci-011\" data-tooltip=\"declarative-form gate が非宣言的構文を検出したら CI は merge を block する MUST (P-4)。\">REQ-CI-011</a>〜015) は 試作 scope 外 (Phase X4+、 <a href=\"../decisions/ADR-0020-validate-scope.html\">ADR-0020 §2.2</a>)。 conformance: clean 集合は <code>scenarios/validate-clean.yaml</code> (cli-golden、 capture:stdout、 exit 0)、 violation 検出 (missing file ref / broken anchor / jsonld 構造違反の 3 種) は実装時に <code>scenarios/validate-violations.yaml</code> + seeded fixtures で 実証する <span class=\"ears-shall\">MUST</span> (exit 1 + report)。 <a href=\"../decisions/ADR-0020-validate-scope.html\">ADR-0020</a> で trace。"
  - id: "REQ-VER-014"
    anchor: "req-ver-014"
    ears_pattern: "event-driven"
    essence: "<code>folio init</code> は canonical Layer 1 consumer layout (構造のみ) を scaffold する — <code>design-intent/{spec,decisions,research}/</code> + 各 <code>README.html</code> + <code>folio.config.yaml</code>。 既存 file は preserve (idempotent)、 本文は seed せず lazy-materialize、 生成 skeleton は <code>folio validate</code> clean。"
    statement: "<span class=\"ears-id\">REQ-VER-014</span>: <span class=\"ears-when\">WHEN the <code>folio init [&lt;dir&gt;]</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> scaffold the canonical Layer 1 consumer layout の<ins class=\"delta\" data-delta-id=\"D-2026-05-27-001\" data-delta-date=\"2026-05-27\">純粋な構造のみ</ins> — <code>design-intent/{spec,decisions,research}/</code>、 各 cluster の <code>README.html</code> (<a href=\"constitution.html#p-6\">P-6</a> entry point<ins class=\"delta\" data-delta-id=\"D-2026-05-27-001\" data-delta-date=\"2026-05-27\">、 index は<strong>実在 file のみ</strong> <code>dc:hasPart</code> 宣言</ins>)、 <del class=\"delta\" data-delta-id=\"D-2026-05-27-002\" data-delta-superseded-by=\"D-2026-05-27-001\"><code>design-intent/spec/{constitution,overview}.html</code> (project starter template、 通常 conforming JSON-LD)、 および </del><code>folio.config.yaml</code> (<a href=\"rules.html#s2-directory\">rules §2</a> schema: folio_version / spec_path / caller_<span class=\"term\" data-term=\"marker\" data-tooltip=\"HTML comment による所有境界の宣言 (folio:chrome-* / folio:nav-curated / folio:landing-hero 等)。 内側が build 所有か人間所有かは機構ごとに定まる。\">marker</span>_env / caller_marker_value / review_model) — そして既存 file は <strong>preserve (idempotent、 上書きしない)</strong>。 <ins class=\"delta\" data-delta-id=\"D-2026-05-27-001\" data-delta-date=\"2026-05-27\"><code>constitution</code> / <code>overview</code> の<strong>本文 (実体) は seed しない</strong> — folio-architect の greenfield onboarding grilling が引き出した中身を Phase E で lazy-materialize する (<a href=\"folio-self-spec.html#s7-1-7phase\">§7.1</a>、 <a href=\"../decisions/ADR-0031-mattpocock-authoring-absorption.html\">ADR-0031</a> が <a href=\"../decisions/ADR-0024-folio-init-scope.html\">ADR-0024</a> の seed 挙動を revise)。 これで空 placeholder が \"done\" に残る hollow-spec を構造的に排除する。</ins> 生成された skeleton は <code>folio validate</code> が <strong>clean (exit 0)</strong> である <span class=\"ears-shall\">MUST</span> (<a class=\"xref\" href=\"./constitution.html#p-6\" data-tooltip=\"Link integrity\">P-6</a> orphan + link-integrity + jsonld structural を満たす seed)。 exit code は <strong>0 = success / 2 = tool error</strong> (fail-closed)。 conformance は <code>scenarios/init-scaffold.yaml</code> (cli-golden) で検証する: init を temp root に実行 → exit 0 + 生成 tree の file 集合 + <code>folio.config.yaml</code> の golden 比較 + <code>folio validate --root &lt;tmp&gt;/design-intent</code> clean。 init は tree (複数 file) を生成するため既存 cli-golden harness (単一 output) の拡張が要る可能性があり、 その HOW は実装時に確定する。 scope 決定は <a href=\"../decisions/ADR-0024-folio-init-scope.html\">ADR-0024</a> <ins class=\"delta\" data-delta-id=\"D-2026-05-27-001\" data-delta-date=\"2026-05-27\">(seed 挙動は <a href=\"../decisions/ADR-0031-mattpocock-authoring-absorption.html\">ADR-0031</a> で revise)</ins> で trace。"
  - id: "REQ-VER-015"
    anchor: "req-ver-015"
    ears_pattern: "event-driven"
    essence: "<code>folio fix</code> は各 forward relation に対応する reverse relation を target に materialize する (idempotent)。 exit は 3 値 — 0 = 真の fixpoint / 1 = shape 非認識で fixpoint を宣言できない (fail-closed) / 2 = tool error (fail-closed) — で、 fix 単独の exit 0 は fixpoint を保証せず、 適用後は validate を再走して clean を確認する。 併せて <code>folio validate</code> は第 3 gate broken-reverse を持ち、 fix 適用後は 3-gate clean になる (detect↔<span class=\"term\" data-term=\"remediate\" data-tooltip=\"validate が検出した違反を解消する操作・tool の総称。 表示層 regen は folio build、 graph materialize は folio fix が分担する (rules §11.2)。\">remediate</span> 対)。"
    statement: "<span class=\"ears-id\">REQ-VER-015</span>: <span class=\"ears-when\">WHEN the <code>folio fix</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> materialize, for each forward relation declared in any spec (<a href=\"relations.html#s5-1-pattern\">relations §5.1 の 6 dual pair</a>), the corresponding reverse relation on the target spec's <code>&lt;head&gt;</code> JSON-LD (<a class=\"xref\" href=\"./relations.html#req-rel-002\" data-tooltip=\"Phase X3+ tooling が active で forward relation が宣言されると、 対応する reverse relation (dc:isReplacedBy 等) を target spec に auto-materialize する。\">REQ-REL-002</a>)、 idempotent に (既存 reverse は重複追加しない)。 outcome は exit code の 3 値で通知する: <strong>exit 0 = 真の fixpoint</strong> (owed reverse が全て実在 — materialize 完了または already-complete で、 かつ shape 非認識の検出なし)、 <strong>exit 1 = fixpoint を宣言できない</strong> (shape 非認識 = scan が認識できない要件 shape の検出 — validate gate shape-blindness と同一機構 — による fail-closed 応答。 「0 changes」は「直すものが無い」ではなく「発見・抽出が 0 件」の帰結でありうるため、 fix 単独の exit 0 を fixpoint の保証と扱わず、 fix 適用後は必ず validate を再走して clean を確認する)、 <strong>exit 2 = tool error</strong> (依存 tool 不在・検査 root 不在・write 失敗などの fail-closed)。 併せて <code>folio validate</code> は<strong>第 3 gate「broken-reverse」</strong>を持ち、 forward に対応する reverse が target に欠ける場合 violation を報告する <span class=\"ears-shall\">MUST</span> (<a href=\"relations.html#s5-3-ears\">REQ-REL-004</a>、 exit 1)。 <code>folio fix</code> 適用後は <code>folio validate</code> (3-gate) が clean になる (detect↔remediate ペア)。 conformance は cli-golden + fixture で検証する: (a) fix が reverse を materialize + exit 0、 (b) fix 後 validate clean、 (c) idempotency (再 fix で no-op)、 (d) broken-reverse を seed した fixture に validate が exit 1、 (e) shape 非認識を seed した fixture に fix が exit 1 = fixpoint を宣言できない、 (f) tool error 経路 (検査 root 不在等) に fix が exit 2 (fail-closed)。 scenario / golden / harness の HOW は実装時に確定 (conformance 被覆は §3.7 RTM が追跡)。 scope 決定は <a href=\"../decisions/ADR-0025-folio-fix-bidirectional.html\">ADR-0025</a> で trace (validate を <a href=\"../decisions/ADR-0020-validate-scope.html\">ADR-0020</a> の 2→3 gate に拡張)。"
  - id: "REQ-VER-016"
    anchor: "req-ver-016"
    ears_pattern: "event-driven"
    essence: "<code>folio-architect</code> SKILL の Phase F は review agent (<code>spec-review-{ears,vocabulary,ssot}</code>) を並列 spawn し structured findings を集約する。 検証は structural (agent <code>.md</code> frontmatter + scoped name resolvable) + e2e (seeded violation の flag 観察) の 2 経路。"
    statement: "<span class=\"ears-id\">REQ-VER-016</span>: <span class=\"ears-when\">WHEN the <a href=\"folio-self-spec.html#s7-1-7phase\"><code>folio-architect</code> SKILL</a> executes Phase F (Quality Review)</span>, it <span class=\"ears-shall\">SHALL</span> spawn the Phase F review agents in parallel (<a href=\"folio-self-spec.html#s7-2-specialists\"><code>spec-review-{ears,vocabulary,ssot}</code></a> = X4-D の 3 軸、 残 3 軸 structure/temporal/stakeholder は X5+) and aggregate their structured findings (severity / location / 違反 rule / 修正提案)。 検証は 2 経路: (a) <strong>structural</strong> — 各 review agent の <code>agents/&lt;name&gt;.md</code> frontmatter (<code>name</code> / <code>description</code> / <code>model</code> / read-only <code>tools</code>) が妥当で、 scoped name <code>folio:&lt;name&gt;</code> が resolvable (frontmatter <code>name</code> 一致 + folio-architect SKILL が当該 scoped name を参照) であること (決定的、 sandbox 可)。 (b) <strong>e2e</strong> — 既知 violation (EARS 欠落 / forbidden synonym / domain 越境) を seed した spec に <code>/folio-architect</code> を invoke し、 3 review agent が該当 violation を flag することを観察する (<a href=\"#s3-6-verification-specific\">REQ-VER-009</a> 型 agent-driven runbook)。 LLM agent は非決定的ゆえ golden 比較でなく <strong>「検出有無」 を一次 assertion</strong> とする。 conformance: (a) は <code>scenarios/agent-structure.yaml</code> (<code>kind: agent-structural</code>、 file 静的検査・決定的・exit 0)、 (b) は <a href=\"../../tests/e2e/runbook.md\">tests/e2e/ runbook S-G</a> (live walk は plugin reload を要すため別 fresh session)。 review agent は read-only (Edit は folio-architect が集約後に適用、 <span class=\"term\" data-term=\"caller-marker\" data-tooltip=\"spec 編集を gate する hook 機構 (.folio/architect-active marker file or env var)。 folio-architect 経由の編集のみ許可する (ADR-0006)。\">caller-marker</span> author 一元性)。 scope 決定は <a href=\"../decisions/ADR-0027-x4-d-architect-skill-review-agents.html\">ADR-0027</a> で trace。"
  - id: "REQ-VER-017"
    anchor: "req-ver-017"
    ears_pattern: "event-driven"
    essence: "<code>folio validate</code> は object <span class=\"term\" data-term=\"xref\" data-tooltip=\"defined-object への in-band な untyped cross-reference (a class=xref + data-tooltip)。 folio fix が穴を materialize し validate が completeness を機械保証する (ADR-0034)。\">xref</span> の 4 gate を追加検査する: resolve-integrity / uniqueness / tooltip-consistency (universal) + completeness (opt-in、 orphan-mention)。 broken-xref / stale-tooltip / orphan-mention は exit 1 + report (<a href=\"rules.html#s9-xref\">rules §9</a> / <a href=\"../decisions/ADR-0034-object-term-xref-system.html\">ADR-0034</a> §2.6)。"
    statement: "<span class=\"ears-id\">REQ-VER-017</span>: <span class=\"ears-when\">WHEN the <code>folio validate</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> additionally check four object cross-reference gates (<a href=\"../decisions/ADR-0034-object-term-xref-system.html\">ADR-0034</a> §2.6): (1) <strong>resolve-integrity</strong> — each <code>&lt;a class=\"xref\" href&gt;</code> resolves to an existing definition site; (2) <strong>uniqueness</strong> — each canonical ID is defined at most once as an id-bearing SSoT element; (3) <strong>tooltip-consistency</strong> — each <code>data-tooltip</code> matches the definition&apos;s current essence (<a href=\"rules.html#s9-2-essence\">§9.2</a> contract); these three are universal. (4) <strong>completeness</strong> — orphan-mention detection, applied only to docs that opt in via <code>&lt;meta name=\"folio-xref-completeness\" content=\"enabled\"&gt;</code> (conditional, <a href=\"rules.html#s9-4-requirements\">REQ-XREF-002</a>)。 conformance は <code>scenarios/xref-validate-clean.yaml</code> (cli-golden、 capture:stdout、 exit 0) + <code>scenarios/xref-validate-violations.yaml</code> (broken-xref / stale-tooltip / orphan-mention の 3 種を seed、 exit 1 + report)。 real corpus は xref <span class=\"term\" data-term=\"dogfood\" data-tooltip=\"folio 自身を folio の規約・機構で構築し検証する self-application。 規約が実用に耐えるかの検証手段。\">dogfood</span> 前 (opt-in 0) ゆえ本 gate 追加後も <code>validate-clean.yaml</code> が clean を維持する (additive、 <span class=\"term\" data-term=\"keystone\" data-tooltip=\"機構の前提 (marker / opt-in signal) を持たない対象を検査せず skip し clean を保つ設計原則。 誤発火より無検査を選び、 採用は対象側の明示 opt-in に委ねる。\">keystone</span>)。"
  - id: "REQ-VER-018"
    anchor: "req-ver-018"
    ears_pattern: "event-driven"
    essence: "<code>folio fix</code> は opt-in doc の prose 内 canonical token 初出を <code>&lt;a class=\"xref\" href data-tooltip&gt;</code> に wrap する (option F materialize、 href + essence は <a href=\"rules.html#s9-1-markup\">§9.1/§9.2</a> contract、 idempotent)。 RED (orphan-mention) → fix → GREEN (completeness clean)。"
    statement: "<span class=\"ears-id\">REQ-VER-018</span>: <span class=\"ears-when\">WHEN the <code>folio fix</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span>, for each doc that opts into xref-completeness, wrap the first prose occurrence of each auto-materializable canonical token (<code>P-N</code> / <code>REQ-*</code> / <code>ADR-NNNN</code>) into <code>&lt;a class=\"xref\" href data-tooltip&gt;</code> with the <code>href</code> and <code>data-tooltip</code> derived from the <a href=\"rules.html#s9-1-markup\">§9.1 registry</a> / <a href=\"rules.html#s9-2-essence\">§9.2 essence contract</a>, idempotently (re-run = no-op、 既存 xref を持つ token は skip)。 非 opt-in doc では no-op (real corpus 不変、 keystone)。 conformance は <code>scenarios/xref-fix.yaml</code> (<code>kind: cli-fix</code>: pre-fix validate が orphan-mention で RED → <code>fix</code> exit 0 → post-fix validate clean → 再 fix idempotent)。 scope 決定は <a href=\"../decisions/ADR-0034-object-term-xref-system.html\">ADR-0034</a> §2.5 (option F) で trace。"
  - id: "REQ-VER-019"
    anchor: "req-ver-019"
    ears_pattern: "event-driven"
    essence: "<code>folio validate</code> は glossary gate を追加検査する: marked term (<code>&lt;span class=\"term\" data-term&gt;</code> に統一) の <code>data-term</code> が <code>vocabulary.yaml</code> に解決し、 <code>data-tooltip</code> が <code>definition</code> と一致すること。 <code>&lt;a class=\"term\"&gt;</code> は anchor-residue として block し (span 統一、 <a href=\"rules.html#s9-5-glossary\">rules §9.5</a>)、 生成 <code>glossary.html</code> の term 集合の vocab 一致は nav-regen-drift の byte 検査が含意する。 <code>folio fix</code> は marked term の tooltip を definition から materialize する (glossary は Class B best-effort・機構詳細は machine 部)。"
    statement: "<span class=\"ears-when\">WHEN the <code>folio validate</code> CLI subcommand runs and a <code>vocabulary.yaml</code> with <code>definition</code> fields exists</span>, <span class=\"ears-id\">REQ-VER-019</span>: it <span class=\"ears-shall\">SHALL</span> check a glossary gate over each marked term (<code>&lt;span class=\"term\" data-term=\"&lt;canonical&gt;\"&gt;</code>, whether explicit or auto-marked — 共に span 形に統一): (1) <strong>resolve</strong> — <code>data-term</code> resolves to a <code>canonical</code> entry in <code>vocabulary.yaml</code>; (2) <strong>tooltip-consistency</strong> — <code>data-tooltip</code> equals that entry&apos;s <code>definition</code>; (3) <strong>anchor-residue</strong> — enforcing the span-only marking convention of <a href=\"rules.html#s9-5-glossary\">rules §9.5</a> (which is the normative SSoT) by blocking any <code>&lt;a class=\"term\"&gt;</code> in living spec/research prose (<code>[glossary-anchor-residue]</code>、 <span class=\"term\" data-term=\"vocabulary\" data-tooltip=\"folio-framework 語の canonical 定義を保持する YAML (vocabulary.yaml)。 folio fix の tooltip populate と Layer 1 consumer の glossary.html derive が読む runtime SSoT (P-5)。 SSoT-first に flip した folio 自身では編集の正本 (edit-SSoT) は glossary contract YAML 側にあり、 本 file はそこからの生成 projection (projection stale gate が byte 一致を保証・ADR-0052)。 flip しない Layer 1 consumer では本 file が edit-SSoT を兼ねる (ADR-0051 §2.3)。\">vocabulary</span>.yaml 解決に依らず); all block (exit 1) on failure。 generated <code>glossary.html</code> term-set parity with <code>vocabulary.yaml</code> is structurally implied by the nav-regen-drift byte check (no independent parity gate; the symmetric difference is surfaced in the regen-drift violation message, conformance <code>scenarios/glossary-parity-drift.yaml</code>)。 <code>folio fix</code> <span class=\"ears-shall\">SHALL</span> materialize each marked term&apos;s <code>data-tooltip</code> from the <code>definition</code>, idempotently。 unmarked term mentions <span class=\"ears-shall\">SHALL NOT</span> be gap-linted (Class B best-effort)。 vocabulary.yaml 不在 / definition 無しは gate skip (additive、 keystone)。 conformance は <code>scenarios/glossary-validate.yaml</code> (unresolved + stale-tooltip を seed した fixture に validate が exit 1 + report、 resolved+consistent な clean 側は real corpus の glossary dogfood が keystone)。 scope 決定は <a href=\"../decisions/ADR-0034-object-term-xref-system.html\">ADR-0034</a> §2.8 で trace。"
  - id: "REQ-VER-020"
    anchor: "req-ver-020"
    ears_pattern: "event-driven"
    essence: "<code>folio validate</code> は dual-audience-structural gate を検査する: <code>data-audience=\"human\"</code> requirement container (verbose <code>section.req</code> + compact <code>details.spec-row</code> の両 form) に machine 対応部存在 (-1) / requirement-id 整合 (-2) / <span class=\"term\" data-term=\"data-audience\" data-tooltip=\"要素が machine 向けか human 向けかを示す属性 taxonomy (machine | human の 2 値)。 dual-audience の構造分離に使う。\">data-audience</span> 値域 (-3) / machine 部 aria-hidden 不在 (-4) / EARS-pattern 整合 (-5) を強制し違反は exit 1。 意味的 fidelity は <span class=\"term\" data-term=\"floor\" data-tooltip=\"deterministic な機械検査層 (folio validate gate)。 二層 enforcement の下限で、 機械化可能な品質を CI で強制する (ADR-0028)。\">floor</span> 対象外 = <span class=\"term\" data-term=\"ceiling\" data-tooltip=\"LLM review 層 (Phase F spec-review agent)。 floor が機械検査できない意味的品質を補完する上限 (ADR-0028)。\">ceiling</span> (<a href=\"folio-self-spec.html#s7-2-specialists\">spec-review-fidelity</a> agent) の領分。"
    statement: "<span class=\"ears-id\">REQ-VER-020</span>: <span class=\"ears-when\">WHEN the <code>folio validate</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> check a dual-audience-structural gate over each <code>data-audience=\"human\"</code> requirement container — both the verbose <code>section.req</code> card and the compact <code>details.spec-row</code> form, keyed by <code>data-audience</code> semantic (container-class 非依存、 <a href=\"../decisions/ADR-0033-dual-audience-hub.html\">ADR-0033</a> §2.5 / <a href=\"rules.html#s7-2-canonical-pattern\">rules §7.2</a> 2-form) — enforcing the five structural safety invariants <a href=\"rules.html#s7-3-floor\">REQ-DA-STRUCT-1..5</a>: (1) the presence of a <code>data-audience=\"machine\"</code> 子孫 (孤立 human の排除); (2) requirement-id 整合 (container <code>id</code> ↔ badge ↔ machine <code>ears-id</code>); (3) <code>data-audience</code> 値域 (<code>machine</code> | <code>human</code> のみ); (4) machine 部に <code>aria-hidden</code> 不在 (AI / accessibility-tree からの可視性保全); (5) EARS-pattern 整合 (human badge ↔ machine <code>data-ears-pattern</code>)。 違反は report + 非ゼロ exit (block gate)。 意味的 fidelity (essence が machine normative を忠実要約か) は本 floor の<strong>対象外</strong>であり、 ceiling = Phase F の <a href=\"folio-self-spec.html#s7-2-specialists\"><code>spec-review-fidelity</code></a> agent が担う (二層 enforcement、 <a href=\"../decisions/ADR-0028-prose-gate-mechanization.html\">ADR-0028</a> / <a href=\"../decisions/ADR-0033-dual-audience-hub.html\">ADR-0033</a> §2.4)。 本 gate は追加 arm として runtime-CDN script 検出 (rules §8 <a class=\"xref\" href=\"./rules.html#req-da-js-2\" data-tooltip=\"JS 無効でも完全に読める MUST (progressive enhancement) ・ library は vendoring (runtime CDN 不可) ・ ES modules + fetch() は不使用 (file:// 破綻)。\">REQ-DA-JS-2</a> の vendoring 違反、 ADR-0039 §2.5 = 単一行 heuristic) も担う — conformance は <code>validate-violations.yaml</code> の <code>cdn-script.html</code> seed。 conformance は <code>scenarios/validate-violations.yaml</code> (<code>da-violations.html</code> が -1〜-5 を <code>section.req</code> + <code>details.spec-row</code> の両 form で 1 card 1 違反 = 計 10 違反 seed、 exit 1 + report) + <code>scenarios/validate-clean.yaml</code> (real corpus の <span class=\"term\" data-term=\"dual-audience\" data-tooltip=\"1 HTML artifact が machine (精密 normative = canonical SSoT) と human (essence + 視覚 view) の双方を同一 DOM に併せ持つ pattern (ADR-0033)。 artifact 自身が canonical WHAT (提示層) で機械層はその内部にある。 SSoT-first に flip した doc は編集の源が正本 (edit-SSoT) = contract YAML に分かれ、 flip しない doc は提示層が edit-SSoT を兼ねる (ADR-0050 / ADR-0051 §2.3)。\">dual-audience</span> dogfood が clean 側 keystone)。 scope 決定は <a href=\"../decisions/ADR-0033-dual-audience-hub.html\">ADR-0033</a> §2.4 で trace (<a href=\"../decisions/ADR-0020-validate-scope.html\">ADR-0020</a> の validate scope を dual-audience floor に拡張)。"
  - id: "REQ-VER-021"
    anchor: "req-ver-021"
    ears_pattern: "event-driven"
    essence: "<code>folio validate</code> は render-safety gate を検査する: <code>&lt;pre class=\"mermaid\"&gt;</code> ブロック内の subgraph 多行タイトル (title bracket <code>[\"…\"]</code> に <code>&lt;br&gt;</code> を含む) を flag する。 mermaid が cluster-label の縦 padding を 1 行分しか確保せず 2 行目が子ノード/枠に overlap する render-後の幾何欠陥を、 DOM を見れない static lint が「既知の overlap パターン」として捕捉する (node label の <code>&lt;br&gt;</code> は対象外)。 違反は exit 1 (block)。 任意 overlap の網羅は browser-render を要する ceiling の領分。"
    statement: "<span class=\"ears-id\">REQ-VER-021</span>: <span class=\"ears-when\">WHEN the <code>folio validate</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> check a render-safety gate over each <code>&lt;pre class=\"mermaid\"&gt;</code> block, flagging any <code>subgraph</code> whose title bracket (<code>[\"…\"]</code>) contains a <code>&lt;br&gt;</code> (multi-line subgraph title) as a <code>[render-safety]</code> violation with non-zero exit, because mermaid reserves only one line of vertical padding for the cluster-label so the second line overlaps child nodes / the box border at render time — a post-render geometric defect the static, browser-less validate cannot observe directly, so the gate pattern-lints the known overlap-prone form (<a href=\"rules.html#s4-5-visual\">rules §4.5</a>)。 node-label <code>&lt;br&gt;</code> は対象外 (node が自動 sizing するため overlap しない); mermaid を持たない spec は vacuously clean。 conformance は <code>scenarios/render-safety.yaml</code> (多行 subgraph タイトル + 通常 node label <code>&lt;br&gt;</code> を併存させた fixture に validate が <code>[FAIL] render-safety</code> + exit 1 + violation 1 件のみ = subgraph タイトルだけ捕捉し node label を誤検出しない)。 本 static pattern-lint は browser を要さず既知パターンを deterministic に捕捉する floor であり、 任意の render overlap (単行でも長すぎる label の溢れ等) の網羅は browser-render を要する視覚 gate (ceiling、 <a href=\"#req-ver-022\">REQ-VER-022</a>) の領分 (二層)。 scope は <a href=\"../decisions/ADR-0020-validate-scope.html\">ADR-0020</a> の validate-scope を render-safety floor に拡張。"
  - id: "REQ-VER-022"
    anchor: "req-ver-022"
    ears_pattern: "event-driven"
    essence: "CI の render-gate job は corpus 全 page を headless chromium で <strong>3 viewport (375/768/1280)</strong> 実 render し、 render <strong>後</strong>の DOM 幾何から mermaid 4 class + chrome 幾何 2 class を検出して merge を block する (render-safety の ceiling 層・floor = <a href=\"#req-ver-021\">REQ-VER-021</a> / <a href=\"#req-ver-023\">REQ-VER-023</a>)。 render 不足は fail-closed、 全 page × viewport の screenshot を CI artifact 保存する (golden 化しない)。 決定性は vendored mermaid + pinned playwright + pinned font の三重 pin で担保する (6 検出 class・selftest 13 case・分類詳細は machine 部)。"
    statement: "<span class=\"ears-id\">REQ-VER-022</span>: <span class=\"ears-when\">WHEN the CI render-gate job runs (push / pull_request)</span>, it <span class=\"ears-shall\">SHALL</span> render every corpus page (repo-root <code>index.html</code> + <code>design-intent/**/*.html</code>) in headless chromium at <strong>three viewports (375×667 / 768×1024 / 1280×900)</strong> and probe the post-render DOM geometry, flagging six defect classes with non-zero exit (merge block): (1) <strong>cluster-label-multiline</strong> — subgraph タイトルの縦 overflow (rendered height を svg の viewBox→rendered 縦比 (scaleY) で intrinsic px に正規化し、 <code>useMaxWidth:true</code> の縮小 render でも閾値が scale に引きずられない — mermaid は uniform scale で render するため縦横比は同値); (2) <strong>label-over-foreign-node</strong> / <strong>cluster-label-over-node</strong> — text label が自分以外の node 矩形と交差 (面積比、 scale 不変); (3) <strong>node-over-node</strong> — layout collision; (4) <strong>content-clipped</strong> — 要素が svg 可視範囲を溢れて clip され読めない (svg overflow は既定 hidden。 判定は rendered px = 視覚上の clip 量で、 (1) の intrinsic 正規化とは意図的に非対称); (5) <strong>horizontal-overflow</strong> (chrome 幾何 arm、 <a href=\"../decisions/ADR-0039-presentation-template-layer.html\">ADR-0039</a> §2.8) — 本文が viewport を溢れ document 全体に意図しない横スクロールが発生 (<code>scrollWidth &gt; clientWidth + 2px</code>。 <code>overflow-x:auto</code> の意図された scroll container 内の wide content は document に寄与しないため発火しない。 culprit は clip/scroll 祖先を持たず viewport 右端を越える最外要素を最大 5 件 + 超過は残余 entry で報告し、 特定不能でも document 溢れ自体を報告する = fail-visible); (6) <strong>nav-over-content</strong> (chrome 幾何 arm) — nav landmark と本文 block の矩形交差 (面積比 &gt; 0.15。 通常 flow の隣接 block は矩形が交差しないため chrome 注入の位置事故・absolute 化の崩れでのみ発火。 closed <code>&lt;details&gt;</code> の中身は Chromium が非 0 の phantom rect を返すため <code>checkVisibility()</code> で非描画要素を除外する)。 render-gate が測る post-render DOM は <strong>post-JS の既定表示</strong> — 既定の人間プレゼン化 (<a href=\"../decisions/ADR-0040-human-layer-presentation-compression.html\">ADR-0040</a> / rules §11.3) 以降、 <code>data-audience</code> を持つ page では chrome script が付与する <code>body.audience-human</code> 状態の幾何を測る (人間が実際に見る view を検査する)。 audience-human が隠す <code>display:none</code> の machine prose も同じ <code>checkVisibility()</code> filter が非描画として除外する (machine 部は幾何検査の対象外 = false positive を生まない)。 mermaid arm (1)〜(4) の検査対象 svg と期待図数は実 <code>&lt;pre class=\"mermaid\"&gt;</code> block 数 (HTML コメント内・prose 内 escaped 言及は数えない — 図は人間層に置き machine 降格しない規律 (rules §11.5) により、 隠れた図の render 不足 false-fail を作らない)、 chrome arm (5)(6) は全 page が対象。 It <span class=\"ears-shall\">SHALL</span> fail-closed: render 不足 (rendered svg 数 &lt; 実 block 数) は見逃しでなく failure に倒す。 It <span class=\"ears-shall\">SHALL</span> save a full-page screenshot of every page × viewport as a CI artifact (人間 review の補助に充てるのみで golden 比較は行わない — pixel golden は brittle ゆえ幾何 detector + 人間の目の二層で代替、 ADR-0039 §2.8)。 <code>constitution.html</code> (自身の <code>@type</code> が <code>FolioConstitution</code>) は advisory (表示のみ・exit 非影響、 編集禁止資産への blocking は <span class=\"term\" data-term=\"frozen\" data-tooltip=\"accepted 後に本文を改訂しない歴史資産 (ADR / constitution)。 実装との乖離は living spec が divergence trace として記録する (P-10)。\">frozen</span> deadlock になるため。 floor の carve-out と同基準)。 coverage の穴は <span class=\"ears-shall\">SHALL</span> emit a warning として可視化し silent pass にしない: 幾何対象 (<code>.node</code>/<code>.cluster</code>) を持たない図型 (sequenceDiagram 等) は <code>vacuous-coverage</code>、 <code>.node</code> は出すが図型 (<code>aria-roledescription</code>) が flowchart/graph でない型 (stateDiagram 等 — 構造だけでは flowchart と区別できない) は <code>uncalibrated-coverage</code> (幾何は測るが threshold は flowchart 較正)。 検出力は selftest (fixture 13 case、 violation kind の<strong>完全一致</strong>判定 (mermaid arm と chrome arm の和集合): detector (1)〜(6) 全 arm の発火 + scale&lt;1 での (1) 正規化発火 (mutation 捕捉を実証済) + clean の誤検出なし + vacuous/uncalibrated 分類。 (2)(3)(4) の単独 arm は mermaid が通常生成しない欠陥ゆえ mermaid と同 class 構造の合成 SVG で、 (5)(6) は合成 page で固定。 同一 fixture を 375/768 で走らせる対が viewport plumbing 自体を、 意図された scroll container (overflow-x:auto) と closed-details phantom rect の clean fixture が chrome arm の誤検出排除を回帰固定する) が mermaid/chromium 版 drift への回帰ガード。 決定性は vendored mermaid + pinned playwright + pinned font (CI が <code>fonts-noto-cjk</code> を install) の三重 pin — deterministic ゆえ blocking 適格 (<a href=\"../decisions/ADR-0037-render-safety-ceiling.html\">ADR-0037</a> §2.3、 <a class=\"xref\" href=\"../decisions/ADR-0028-prose-gate-mechanization.html\" data-tooltip=\"forward (X5-γ、 user 承認済 (AskUq 方向性 γ)、 実装は本 ADR 承認後)\">ADR-0028</a> の LLM-ceiling 非決定性根拠は本 gate に適用されない)。 conformance は <code>tests/render-gate/check.py --selftest</code> + <code>.github/workflows/ci.yml</code> の <code>render-gate</code> job (browser 依存ゆえ sandbox scenario でなく CI-only dogfood — consumer の <code>folio validate</code> には入れない、 配布される floor は <a href=\"#req-ver-021\">REQ-VER-021</a>)。 scope/二層化の決定は <a href=\"../decisions/ADR-0037-render-safety-ceiling.html\">ADR-0037</a>、 3 viewport 化 + chrome 幾何 arm + screenshot artifact の拡張は <a href=\"../decisions/ADR-0039-presentation-template-layer.html\">ADR-0039</a> §2.8 で trace。"
  - id: "REQ-VER-023"
    anchor: "req-ver-023"
    ears_pattern: "event-driven"
    essence: "<code>folio validate</code> は readability-floor gate を検査する (<a class=\"xref\" href=\"./constitution.html#p-14\" data-tooltip=\"Human Readability\">P-14</a> の floor 層): <strong>block 3 系</strong> — viewport meta 欠落 / 孤立 EARS (machine 対応部があるのに essence が空) / 生成 <span class=\"term\" data-term=\"landing\" data-tooltip=\"design-intent/index.html の入口 template (hero 一文 → 単一 CTA → 読者別カード → cluster 一覧、 ADR-0039 §2.2)。 型は build 所有・文言は curated。\">landing</span> hero の空・link ゼロ (dead-end)、 <strong>warn 5 系</strong> — essence 句点数 &gt; 4 / 可視 prose 単一段落 &gt; 2000 codepoints / 人間層可視 prose &gt; 12,000 codepoints (上限 box、 <a class=\"xref\" href=\"../decisions/ADR-0040-human-layer-presentation-compression.html\" data-tooltip=\"人間層を「制限時間付きプレゼン」、 機械層を「無制限の原稿」と再定義する一括決定。 ADR-0039 の presentation template layer (型と導線) では解けなかった「人間向け表示でも本文が長大すぎ図が乏しい」を、 informative prose の audience 降格 (削除しない — AI は CSS 非依存で DOM 全文を読むため情報ゼロ損失) + 章要旨/章図の新設 + 既定表示の人間プレゼン化で解く。 time-box は目標 10 分 (約 6,000 字)/上限 20 分 (約 12,000 字)。 図の語彙は mermaid + 既存 CSS パターン (mermaid source は機械可読 = 図自体が dual-audience)、 inline SVG は ceiling review 必須の opt-in 例外。 道具は migration skill (batch 圧縮 + walk 検収) と folio-architect 恒久 phase の 2 系統で、 圧縮基準は rules に規範化して共有 SSoT とする。 gate は floor 新 arm (人間層可視 prose 上限/章要旨必須/図ゼロ×長文) を warn 始まりで設置し ADR-0039 §2.7 の昇格規律に乗せる。 scope は living spec + 入口群 — decisions/research は「一次資料層」(AI が読む原稿) としてプレゼン圧縮の対象外を明示する。 1.0.0 (criterion-c) は本 epic 完了後の user 再 walk を gate とする。 ADR-0039 §2.4 の既定表示「バランス型」は本 ADR が「人間プレゼン型」へ改訂する (frozen 本文不変、 本 ADR + rules が新規範)。 grill 2026-06-12 (全 6 論点) で確定。\">ADR-0040</a>) / 章要旨 (<code>p.section-essence</code>) 不在 / 図ゼロ×長文 (&gt; 6,000)。 frozen は warn 除外・essence block は living spec/research のみ・圧縮 3 arm は圧縮対象 (living spec + cluster README) のみ (stuck-RED 回避 + 一次資料層 skip)。"
    statement: "<span class=\"ears-id\">REQ-VER-023</span>: <span class=\"ears-when\">WHEN the <code>folio validate</code> CLI subcommand runs</span>, it <span class=\"ears-shall\">SHALL</span> check a readability-floor gate (<a href=\"../decisions/ADR-0039-presentation-template-layer.html\">ADR-0039</a> §2.7、 P-14 floor) with three blocking arms and five warning arms: <strong>block (1) viewport</strong> — every scanned doc carries <code>&lt;meta name=\"viewport\"&gt;</code> inside <code>&lt;head&gt;</code> (head-anchored 走査で body / <code>&lt;pre&gt;</code> の raw/escaped 言及に誤反応しない。 rules §4.6 MUST の機械化。 <a class=\"xref\" href=\"../decisions/ADR-0039-presentation-template-layer.html\" data-tooltip=\"ADR-0038 (P-14 Human Readability) を実装する機構群の一括決定。 folio build が人間向け提示の「型」を所有する presentation template layer を新設する: landing template (hero 一文 → 単一 CTA → 読者別 3 カード → cluster 一覧)、 全ページへの chrome 注入 (skip-link / breadcrumb / ページ内目次 / prev-next、 目次は既存 id からのみ導出し本文へ id を注入しない)、 ページ種別 × 読者層の既定表示規範、 audience toggle (classic JS・永続なし)、 readability 二層 gate (validate 17-gate 化 + render-gate の 3 viewport / chrome detector 拡張 + readability review lens)。 意味 (essence / EARS / 理由) は従来どおり人間が co-author し (ADR-0033 不変)、 機械が所有するのは型と導出 view のみ。 設計は presentation-design-patterns research (6 軸 41 + gap-fill 17 パターン) に根拠付け、 grill G3〜G7 で確定。 ADR-0035 (nav-derive) の生成範囲を index から全ページ chrome へ、 ADR-0020 validate scope を readability floor へ、 ADR-0037 render ceiling を multi-viewport + chrome 幾何へ拡張する (frozen 本文不変、 reverse-link + prose で trace)。\">ADR-0039</a> §2.7 列挙の 3 block への追加 arm = <span class=\"term\" data-term=\"chrome\" data-tooltip=\"folio build が全 page の marker 領域へ注入・維持するナビ枠 (skip-link / breadcrumb / ページ内目次 / prev-next、 ADR-0039 §2.3)。 手編集は再 build が上書きする。\">chrome</span> 注入 slice の独立 ceiling 指摘「生成 page のみ viewport を持つ非対称」の是正、 divergence trace は本 REQ); <strong>block (2) essence 非空</strong> — <code>data-audience=\"human\"</code> requirement container が machine 対応部を持つのに人間向け要旨 (<code>class=\"essence\"</code> / <code>\"req__essence\"</code>) が無い・空 = 孤立 EARS (<a class=\"xref\" href=\"./rules.html#req-da-struct-1\" data-tooltip=\"dual-audience を採用する spec の各 [data-audience=&quot;human&quot;] requirement container は [data-audience=&quot;machine&quot;] 子孫を持つ MUST (孤立 human の排除)。\">REQ-DA-STRUCT-1</a> の対称拡張。 living spec/research のみ — frozen decisions/ は remediate 不可 = stuck-RED ゆえ除外、 glossary gate と同基準。 container 外の machine 要素検出は ceiling の領分); <strong>block (3) landing hero</strong> — 生成 index (<code>folio-generated</code> marker、 hand-authored は keystone skip) の <code>folio:landing-hero</code> <span class=\"term\" data-term=\"curated region\" data-tooltip=\"marker の内側を人間が author し、 folio build が verbatim に往復保全する領域 (nav-curated / landing-hero)。 chrome と所有の向きが逆。\">curated region</span> が非空で <code>&lt;a href&gt;</code> を 1 本以上持つ (空 hero は build の placeholder 再 emit により nav-regen-drift と併発し、 両 violation が同じ remediate = <code>folio build</code> を名指しする); <strong>warn (4) essence 句点数</strong> — essence 内の 「。」 が 4 個超 (日本語は語数の決定的計測が不能のため句点近似、 閾値 4 = corpus 較正 2026-06-11 実測 max 4); <strong>warn (5) 可視 prose 段落長</strong> — prose_only 可視域 (pre / code / aside.machine-readable / chrome 除外、 <code>class=\"ears\"</code> 完全一致の EARS 全文も除外) の単一 <code>&lt;p&gt;</code> 段落が 2000 codepoints 超 (UTF-8 継続 byte 除去による locale 非依存の決定計測。 閾値 2000 = corpus 較正 2026-06-11: blob 実測 9545 / 次点 1429 (gate 同一計測の codepoints) — blob 再発のみ見張る)。 加えて<strong>人間層プレゼン圧縮の warn 3 arm</strong> (<a href=\"../decisions/ADR-0040-human-layer-presentation-compression.html\">ADR-0040</a> §2.5 / rules §11.5、 対象 = 圧縮対象ページ (living spec (subdir=spec、 constitution は scan 対象外) + doc-type=cluster-readme)、 frozen ADR と research の非 README (一次資料層) は skip。 ADR-0040 §2.6 の入口群のうち landing / glossary.html は build 所有の生成物で human-authored 長文 prose を持たないため v1 の機械検査対象外 = cluster README のみ gate し、 残りは ceiling / §11.4 walk に委譲する narrowing): <strong>warn (6) 人間層可視 prose 上限</strong> — 既定表示で人間が読む量が約 12,000 codepoints (読了 20 分 box) 超。 計測は <code>data-audience=\"machine\"</code> subtree (降格部、 同名 tag の depth 追跡) と <code>&lt;table&gt;</code> (線形読書しない = 満重みにしない、 v1 は 0 重み) を行 granular に除去 → prose_only → tag 除去 → codepoint 数 (除去は undercount 方向 = warn が鳴りにくい conservative); <strong>warn (7) 章要旨不在</strong> — h2 章を持つ living spec ページに <code>p.section-essence</code> が 1 つも無い (v1 は page 単位 presence、 章単位への昇格は migration 後較正で判断); <strong>warn (8) 図ゼロ×長文</strong> — 実 mermaid block ゼロかつ人間層可視 prose &gt; 約 6,000 codepoints (目標 box。 block 数は raw grep で HTML コメント内を数えうるが overcount = warn 抑制側で conservative)。 warn 全系は doc-type=adr (frozen) を除外し、 exit code に影響しない (<a class=\"xref\" href=\"./rules.html#req-ci-014\" data-tooltip=\"EARS-coverage gate が well-formed EARS pattern を欠く requirement を検出したら CI は warning を出すが merge は許可する (§6)。\">REQ-CI-014</a> と同じ warn channel)。 block violation は exit 1 + remediate tool/操作の名指し (ADR-0039 §2.9)。 warn 閾値の block 化は ceiling の指摘頻度を見て判断する (ADR-0039 §2.7 — 圧縮 3 arm は migration (folio-bqq) 完了後の corpus 実測で再較正してから昇格判断)。 conformance は <code>scenarios/readability-floor.yaml</code> (block 2 arm + warn 5 arm + hero dead-end + 圧縮 arm の正例 compress-over / 負例 compress-demoted (降格 + table 除去の回帰ガード)、 fix/build 済 fixture で他 gate clean = isolation) + <code>scenarios/readability-floor-hero.yaml</code> (hero 空 + nav-regen-drift 併発の対)。 意味的可読性 (文言の質) は floor の対象外 = ceiling (readability review lens、 ADR-0039 §2.8) の領分 (二層)。"
  - id: "REQ-NAV-001"
    anchor: "req-nav-001"
    ears_pattern: "event-driven"
    essence: "<code>folio validate</code> は <code>folio-generated</code> marker (head-anchored) を持つ生成 <code>index.html</code> を <code>folio build</code> の emit と byte 比較し drift を block する。 marker 無し (hand-authored) index は keystone skip — body の escaped 言及には反応しない。"
    statement: "<span class=\"ears-id\">REQ-NAV-001</span>: <span class=\"ears-when\">WHEN the <code>folio validate</code> CLI subcommand runs and a top-level <code>index.html</code> carrying <code>&lt;meta name=\"folio-generated\" content=\"folio-build\"&gt;</code> in its <code>&lt;head&gt;</code> exists</span>, it <span class=\"ears-shall\">SHALL</span> byte-compare that index against the deterministic <code>folio build</code> emit and report any difference as a <code>[nav-regen-drift]</code> violation (exit 1、 remediate = <code>folio build</code>)。 marker を持たない index は検査対象外 (keystone) であり、 marker 判定は <code>&lt;head&gt;</code> の実 <code>&lt;meta&gt;</code> に anchor し body の escaped/prose 言及に誤反応しない <span class=\"ears-shall\">SHALL</span>。 conformance: <code>scenarios/nav-validate-clean.yaml</code> (clean) / <code>nav-validate-drift.yaml</code> (drift 検出) / <code>nav-validate-keystone.yaml</code> (escaped-mention 誤発火なし)。"
  - id: "REQ-NAV-002"
    anchor: "req-nav-002"
    ears_pattern: "unwanted"
    essence: "生成 index 内の <code>&lt;a href&gt;</code> が実在 file / anchor に解決しない場合、 <code>[nav-dead-link]</code> で block する (curated region の手書き link rot も被覆)。"
    statement: "<span class=\"ears-id\">REQ-NAV-002</span>: IF the generated <code>index.html</code> contains an <code>&lt;a href&gt;</code> whose relative target file does not exist or whose <code>#anchor</code> does not resolve to an <code>id</code> in the target, THEN <code>folio validate</code> <span class=\"ears-shall\">SHALL</span> report a <code>[nav-dead-link]</code> violation (exit 1)。 external scheme / pure-anchor / stylesheet href は対象外。 regen-drift が curated region を往復保全するため、 curated 内の手書き link rot は本 gate だけが捕捉する。 conformance: <code>scenarios/nav-validate-deadlink.yaml</code>。"
  - id: "REQ-NAV-003"
    anchor: "req-nav-003"
    ears_pattern: "unwanted"
    essence: "cluster dir / README の graph scan (生成 index の有無に依存しない) が dead-end README・empty cluster・index-backlink 欠落 (兄弟 cluster へは抜けるが <code>../index.html</code> への戻りが無い = index 孤島) を検出する。 self-root (FolioConstitution 保持) = block / consumer = warn。"
    statement: "<span class=\"ears-id\">REQ-NAV-003</span>: IF an architecture cluster directory exists whose <code>README.html</code> has no outbound cross-cluster <code>&lt;a href&gt;</code> (dead-end), or which contains no scannable doc (empty cluster), or whose <code>README.html</code> has outbound links but none resolving to <code>../index.html</code> (親 dir 自体を指す <code>..</code> / <code>../</code> も index 到達可能形として受理) (index-backlink 欠落 — 兄弟 cluster へは抜けるが index へ戻れない「index 孤島」、 <a href=\"../decisions/ADR-0035-walkable-architecture-nav-derive.html\">ADR-0035</a> §1 が名指した形。 dead-end 検出済みの README には重ねない = 1 README 1 主因で remediate を迷わせない。 remediate は <code>folio build</code> の breadcrumb 再生成 = detect↔remediate parity)、 THEN <code>folio validate</code> <span class=\"ears-shall\">SHALL</span> report it via the <code>[cluster-reachability]</code> gate — as a blocking violation when the root is folio-self (spec/ に <code>@type</code> <code>FolioConstitution</code>)、 as a warning (exit 0) when the root is a consumer corpus。 本 gate は dir/README scan 由来であり生成 index の有無に gate しない (post-init / pre-build window でも検査される)。 conformance: <code>scenarios/nav-validate-reachability.yaml</code> (self-root block、 index-backlink 欠落 arm を含む)。"
  - id: "REQ-NAV-004"
    anchor: "req-nav-004"
    ears_pattern: "state-driven"
    essence: "<code>folio build</code> の curated region 往復保全は first-open / last-close 抽出で行い、 region 内の raw marker 言及 (<code>&lt;pre&gt;</code> 解説等) を内側として保全する — editorial の silent 切り捨てを構造的に防ぐ。"
    statement: "<span class=\"ears-id\">REQ-NAV-004</span>: WHILE a curated region (<code>folio:nav-curated</code> / <code>folio:landing-hero</code>) contains raw marker mentions inside its editorial content, <code>folio build</code> <span class=\"ears-shall\">SHALL</span> extract the region by first-open / last-close boundary (単純 state-machine の最初の close 終端ではなく) and round-trip the full editorial verbatim、 so that regeneration never silently drops content after a raw close-marker mention (#110/#116/#119 系譜の raw-mention 誤動作の回帰 guard)。 conformance: <code>scenarios/nav-validate-curated-roundtrip.yaml</code> (sentinel 保全を regen-drift [OK] で実証)。"
  - id: "REQ-NAV-005"
    anchor: "req-nav-005"
    ears_pattern: "unwanted"
    essence: "consumer corpus (FolioConstitution 無し) の reachability findings は block でなく warn (exit 0) — validate-clean を壊さず authoring を nudge する。 生成 index 不在でも検査される。"
    statement: "<span class=\"ears-id\">REQ-NAV-005</span>: IF the validate root is a consumer corpus (no <code>FolioConstitution</code> in spec/) and the <code>[cluster-reachability]</code> gate finds dead-end / empty-cluster / index-backlink 欠落 / link-rot findings, THEN <code>folio validate</code> <span class=\"ears-shall\">SHALL</span> emit them on the warning channel (exit code 非影響) instead of blocking — consumer の post-init / pre-build window で validate-clean 契約 (REQ-VER-014) を保ちながら気付きを与える。 conformance: <code>scenarios/nav-validate-consumer-deadend.yaml</code> (dead-end + dangling home link の 2 warn、 nav 系 gate は index 不在で [SKIP] のまま)。 index-backlink 欠落の warn 振り分けは gate の共有 dispatch (self block / consumer warn) に従い <a href=\"#req-nav-003\">REQ-NAV-003</a> の self-root scenario と同経路 — 専用の consumer scenario は持たない (finding 種別ごとでなく gate 単位で振り分ける実装のため)。"
  - id: "REQ-NAV-006"
    anchor: "req-nav-006"
    ears_pattern: "unwanted"
    essence: "cluster README body の static cross-nav link が解決しない (link rot) 場合、 <code>[cluster-reachability]</code> の link-rot 検査が捕捉する — link-integrity (JSON-LD のみ) と nav-dead-link (生成 index のみ) の未被覆領域を埋める。"
    statement: "<span class=\"ears-id\">REQ-NAV-006</span>: IF a cluster <code>README.html</code> body contains an <code>&lt;a href&gt;</code> whose realpath-normalized relative target does not exist, THEN <code>folio validate</code> <span class=\"ears-shall\">SHALL</span> report it via the <code>[cluster-reachability]</code> gate の link-rot 検査 (self-root = block / consumer = warn、 REQ-NAV-003/005 の振り分けと同一)。 JSON-LD relation しか見ない link-integrity と生成 index しか見ない nav-dead-link の両方が README body href を未被覆のため、 link rot は本検査だけが捕捉する。 conformance: <code>scenarios/nav-validate-readme-linkrot.yaml</code> (self-root block 側、 consumer warn 側は REQ-NAV-005 scenario が併せて固定)。"
  - id: "REQ-NAV-007"
    anchor: "req-nav-007"
    ears_pattern: "state-driven"
    essence: "chrome marker (<code>folio:chrome-top/toc/bottom</code>) を持つ page の chrome 領域は render 再計算と byte 一致を保つ — drift は <code>[chrome-drift]</code> (nav-regen-drift gate 内包) で block、 marker 無し page は keystone skip。 remediate は <code>folio build</code>。"
    statement: "<span class=\"ears-id\">REQ-NAV-007</span>: WHILE a scanned page carries chrome marker regions (<code>folio:chrome-top</code> / <code>chrome-toc</code> / <code>chrome-bottom</code>、 ADR-0039 §2.3 の build 所有領域), <code>folio validate</code> <span class=\"ears-shall\">SHALL</span> verify that the page byte-equals its deterministic chrome re-render (<code>folio_chrome_render_doc</code> = strip → 再計算 → 挿入の純関数) and report any mismatch as a <code>[chrome-drift]</code> violation on the nav-regen-drift gate (exit 1、 remediate = <code>folio build</code> — §2.9 分業: 表示層 regen は build 所有)。 marker を持たない page は検査対象外 (keystone) <span class=\"ears-shall\">SHALL</span>。 生成規則 (既存 id のみ 2 段 fallback 目次 / prev-next 順序 SSoT / BASE_URL 二段構え breadcrumb) は ADR-0039 §2.3 を SSoT とし、 committed fixture bytes が意味論を pin する。 conformance: <code>scenarios/chrome-validate-clean.yaml</code> (clean + 生成規則 pin) / <code>chrome-validate-drift.yaml</code> (改竄検出)。"
  - id: "REQ-VER-005"
    anchor: "req-ver-005"
    ears_pattern: "ubiquitous"
    essence: "Phase X3 着手時に Step 1 (hook script unit test) を実装する (Step 2/3 は SHOULD/MAY で段階追加)。"
    statement: "<span class=\"ears-id\">REQ-VER-005</span>: Phase X3 着手時点で Step 1 (hook script unit test) を <span class=\"ears-shall\">MUST</span> 実装する。 Step 2 / Step 3 は段階追加 (SHOULD / MAY)。"

  - id: "REQ-VER-031"
    anchor: "req-ver-031"
    ears_pattern: "ubiquitous"
    essence: "flip 済 spec の生成物 fidelity (人間層 rich + 機械層 normative) は、 canonical/artifact/生成物から導出しない凍結 literal census + contract 対 round-trip + extractor-collapse 敵対 test の三本柱で検証する (snapshot oracle は bootstrap 1 回証明へ退役・<a href=\"../decisions/ADR-0053-snapshot-oracle-evolution-policy.html\">ADR-0053</a>)。"
    statement: "<span class=\"ears-id\">REQ-VER-031</span>: The folio verification framework <span class=\"ears-shall\">SHALL</span> verify that the generated output of a flipped spec (canonical generated from its machine SSoT) losslessly carries the canonical assets (human-layer rich, machine-layer normative, and navigable structure) via three pillars: (a) a frozen literal census whose expected values are derived from neither canonical, artifact, nor generated output, checked against the generated HTML as subject; (b) a round-trip reconstructed from the contract machine blocks; (c) adversarial tests that fire on extractor regression (rich-to-plain collapse). The framework <span class=\"ears-shall\">SHALL NOT</span> use relative parity against the snapshot oracle, which is retired to a one-time bootstrap fidelity proof (self-comparison becomes tautological after flip; <a href=\"../decisions/ADR-0053-snapshot-oracle-evolution-policy.html\">ADR-0053</a>)."

