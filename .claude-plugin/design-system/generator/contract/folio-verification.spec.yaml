      - { type: subhead, anchor: "s3-1-scenario-format", heading: "§3.1 scenario format (YAML、 1 REQ = 1 scenario)", essence: "検証 scenario の format と参照 <code>req_id</code> を定める (REQ-VER-001 / 002)。" }
