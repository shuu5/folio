      - { type: subhead, anchor: "s7-2-specialists", heading: "§7.2 Specialist Agents (9 個)", essence: "完成形 vision の <strong>9 agent</strong> (= Phase B explorer 1 + Phase D architect 1 + Phase F review 7 軸) を下表に列挙する。 v1.0 で実装するのは Phase F の <strong>5 review agent</strong> (ears / vocabulary / ssot / temporal / fidelity)。 <code>spec-review-structure</code> は <code>folio validate</code> 被覆ゆえ cut、 explorer / architect / stakeholder は post-1.0 defer (削除でなく将来 opt-in の anchor として table に残す、 <a href=\"../decisions/ADR-0029-phase-f-agent-set.html\">ADR-0029</a>)。" }
      - type: table
        caption: ""
        headers: ["agent", "phase", "focus"]
        rows:
