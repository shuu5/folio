#
# ★命名の断り (folio-cuom ■6 / 裁定 D-1): 本 file 名は ★folio-self-spec.spec.yaml で確定 (再変更禁止)。
#   folio validate の gate (s) spec-contract-pairing は spec basename から contract 名を機械 mapping し
