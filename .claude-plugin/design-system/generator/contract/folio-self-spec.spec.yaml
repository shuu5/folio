      - { type: note, html: "<p>本 §7.6 は試作段階 (Phase X3) における plugin minimal scope を記述する。 <a href=\"#s7-2-specialists\">§7.2 (完成形 9 specialist agents)</a> は未来 anchor として保持し、 現状の試作 scope を本 §7.6 に局所化する。 採用根拠は <a href=\"../decisions/ADR-0003-plugin-architecture.html\">ADR-0003</a>、 実機検証 framework は <a href=\"verification.html\">verification.html</a>。</p>" }
      - { type: prose, html: "Phase X3 minimal viable plugin scope = <strong>1 skill + 4 hook + 6 script + 1 CLI</strong>。 各 component の詳細 enumeration および役割 (WHAT) は <a href=\"../decisions/ADR-0003-plugin-architecture.html#s2-decision\">ADR-0003 §2 Decision</a> を SSoT として参照する MUST (本 §7.6 は <a class=\"xref\" href=\"../decisions/ADR-0003-plugin-architecture.html\" data-tooltip=\"folio v0.4.2-draft\">ADR-0003</a> への entry point + 段階的成長 path 規定のみを担う、 detailed table の重複定義は禁止)。" }
      - { type: prose, html: "段階的成長 path: <strong>1 skill (Phase X3) → 7-Phase SKILL + 3 review agent (Phase X4) → 5 review agent v1.0 (Phase X5-γ + ADR-0033) → 9 agents 完成形 vision (post-1.0)</strong> (X4-D で 3 review agent ears/vocabulary/ssot、 <a href=\"../decisions/ADR-0027-x4-d-architect-skill-review-agents.html\">ADR-0027</a>; X5-γ で temporal 追加・<code>spec-review-structure</code> は <code>folio validate</code> 被覆ゆえ cut・<code>spec-explorer</code>/<code>spec-architect</code>/<code>spec-review-stakeholder</code> は post-1.0 defer、 <a href=\"../decisions/ADR-0029-phase-f-agent-set.html\">ADR-0029</a>; dual-audience <code>spec-review-fidelity</code> ceiling 追加、 <a href=\"../decisions/ADR-0033-dual-audience-hub.html\">ADR-0033</a>)。 試作で発見した修正点 / 必要追加機能を spec に逐次反映する。 具体的 binding (script 内容 / CLI 構文) は <a href=\"#s9-bindings\">§9 Bindings</a> に隔離。" }
      - { type: note, html: "<p><strong>X4-D 現状 (<a class=\"xref\" href=\"../decisions/ADR-0027-x4-d-architect-skill-review-agents.html\" data-tooltip=\"forward (X4-D、 user 承認済 (AskUq)、 実装は本 ADR 承認後)\">ADR-0027</a>)</strong>: <a href=\"#s7-1-7phase\">§7.1</a> の 7-Phase orchestration を <code>folio-architect</code> SKILL に実装し、 Phase F に review agent を <strong>3 個</strong> (<code>spec-review-ears</code> / <code>spec-review-vocabulary</code> / <code>spec-review-ssot</code>) 導入した (<code>agents/&lt;name&gt;.md</code>、 scoped name <code>folio:&lt;name&gt;</code>、 read-only)。 Phase B (<code>spec-explorer</code>) / Phase D (<code>spec-architect</code>) は X4 では folio-architect が inline 実行し、 agent 化は <strong>X5+</strong>。 Phase F 残 3 軸 (<code>spec-review-{structure,temporal,stakeholder}</code>) も当時は <strong>X5+</strong> 据置とした。 <a href=\"#s7-2-specialists\">§7.2 完成形 9 agents</a> は未来 anchor として保持する。 検証 contract は <a href=\"verification.html#s3-6-verification-specific\">verification.html REQ-VER-016</a>。 <strong>X5-γ 更新 (<a href=\"../decisions/ADR-0029-phase-f-agent-set.html\">ADR-0029</a>)</strong>: <code>spec-review-temporal</code> を v1.0 の 4 番目 review agent に昇格、 <code>spec-review-structure</code> は <code>folio validate</code> 被覆ゆえ cut、 <code>spec-explorer</code> / <code>spec-architect</code> / <code>spec-review-stakeholder</code> は post-1.0 defer (<a href=\"#s7-2-specialists\">§7.2 末尾 disposition aside</a>)。</p>" }
      - { type: prose, html: "本 minimal plugin の実機検証は <a href=\"verification.html\">verification.html</a> (<span class=\"term\" data-term=\"sandbox\" data-tooltip=\"tests/ の決定的 verification framework (scenario YAML + runner + fixtures + golden)。 hook / CLI を mock payload・隔離 root で単体検証する (ADR-0013 / 0017)。\">sandbox</span> verification framework) で実施する。 verification scope の段階的対比 (完成形 §7.2 vs 試作段階 §7.6) は <a href=\"verification.html#s4-2-completion-vs-prototype\">verification.html §4.2</a> に集約 (SSoT)。" }
  - id: "s8"
    anchor: "s8-plugin"
    tint: "ok"
    kicker: "§8 / plugin 統合"
    heading: "§8. Plugin Integration (Claude Code plugin としての folio)"
    essence: "folio は <strong>Claude Code plugin</strong> として配布される (P-12)。 公式 plugin spec に準拠した manifest (<code>plugin.json</code>) + component layout を採用し、 consumer は <code>folio.config.yaml</code> で userConfig default (spec_path / caller_marker 等) を override できる。 配布は Git marketplace + semver pinning。 §8.1〜§8.3 で schema・override 機構・distribution を解説する。"
    blocks:
      - { type: subhead, anchor: "", heading: "§8.1 plugin.json schema", essence: "下の <code>plugin.json</code> が manifest schema: <code>name</code> / <code>version</code> / <code>description</code> / <code>homepage</code> + userConfig (<code>spec_path</code>・<code>caller_marker_env</code>・<code>caller_marker_value</code>・<code>review_model</code>) を宣言する。 実 plugin.json は <code>spec_path</code> default を canonical <code>design-intent/spec/</code> とし、 各 userConfig に <code>title</code> field を持つ (claude plugin validate 要件)。" }
      - type: code
        lines:
          - "{"
          - "  \"name\": \"folio\","
          - "  \"version\": \"0.5.0-draft\","
          - "  \"description\": \"folio Layer 0 META FRAMEWORK — universal architecture spec-writing rules + Claude Code plugin harness.\","
          - "  \"homepage\": \"https://github.com/shuu5/folio\","
          - "  \"userConfig\": {"
          - "    \"spec_path\": {"
          - "      \"type\": \"string\","
          - "      \"default\": \"design-intent/spec/\","
          - "      \"description\": \"Relative path (from consumer project root) where folio-managed spec HTML files live.\""
          - "    },"
          - "    \"caller_marker_env\": {"
          - "      \"type\": \"string\","
          - "      \"default\": \"FOLIO_ARCHITECT_CONTEXT\","
          - "      \"description\": \"Environment variable name that AI agent must set before editing files under spec_path.\""
          - "    },"
          - "    \"caller_marker_value\": {"
          - "      \"type\": \"string\","
          - "      \"default\": \"folio-architect\","
          - "      \"description\": \"Expected value of the caller marker env var.\""
          - "    },"
          - "    \"review_model\": {"
          - "      \"type\": \"string\","
          - "      \"default\": \"opus\","
          - "      \"description\": \"LLM model for Phase F specialist review agents.\""
          - "    }"
          - "  }"
          - "}"
      - { type: subhead, anchor: "", heading: "§8.2 userConfig override mechanism", essence: "各 Layer 1 consumer project は <code>folio.config.yaml</code> で <code>plugin.json</code> userConfig の default を override できる (下の例: <code>spec_path</code> / <code>caller_marker_env</code> / <code>caller_marker_value</code> の上書き)。" }
      - type: code
        lines:
          - "folio_version: \"^0.4\""
          - "spec_path: \".folio/spec/\"          # default design-intent/spec/ を上書き"
          - "caller_marker_env: \"MY_PROJECT_CTX\" # default FOLIO_ARCHITECT_CONTEXT を上書き"
          - "caller_marker_value: \"spec-editor\""
      - { type: subhead, anchor: "", heading: "§8.3 distribution", essence: "配布は Git marketplace + semver pinning (<code>shuu5/folio#v0.5.0</code>)。 1.0.0 未満は development phase として MAJOR/MINOR/PATCH boundary を緩和する (constitution §5)。 npm / pip 配布は scope 外 (Claude Code plugin protocol 中心)。" }
      - type: mermaid
        caption: "図 9. Plugin Integration flow。 consumer の <code>folio.config.yaml</code> 宣言から Claude Code が plugin component を load、 hooks が PreToolUse / PostToolUse 時に caller marker enforce + spec validate を実行する。"
