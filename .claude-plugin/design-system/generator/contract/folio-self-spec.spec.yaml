#   (本 block には持たない = 二重 SSoT の回避)。
# ★dc:isReferencedBy (canonical head の 18 entry) は ★意図的に持たない — reverse edge は folio fix の
#   ★導出物 (core も emit しない設計) ゆえ contract に書くと手書き台帳が二重化して drift 源になる (■1(8))。
# ★depends_on は canonical に対応物が無いため ★key ごと省略 (core は length>0 の関係だけを emit する)。
head_graph:
  id: "./folio-self-spec.html"
  type: "schema:TechArticle"
  part_of: ["./README.html"]
  references: ["./rules.html", "./relations.html"]
  extends: ["./constitution.html"]

