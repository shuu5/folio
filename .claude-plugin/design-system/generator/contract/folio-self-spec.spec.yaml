#   無言で消える = inventory / relations graph / switchover-harness の head_graph hard-fail が同時に無検査化する。
#   flip 側 (mkwc) の switchover-harness.sh は in-scan flip target が head_graph を欠くと hard-fail する
#   (sh_assert_head_graph_hardfail / gate-head-graph) ため、 bootstrap 側で ★必ず載せる のが本 cell の職掌。
# ★値は canonical folio-self-spec.html の head JSON-LD (:15-56) から ★逐語 で写した:
#     @id                = "./folio-self-spec.html"
#     @type              = "schema:TechArticle"   (core の既定と同値だが ★明示する = 既定依存で暗黙化しない)
