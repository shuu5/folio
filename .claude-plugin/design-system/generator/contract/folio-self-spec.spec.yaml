          - ["<code>spec-architect</code>", "D (2-3 並列、 optional)", "minimal / clean / pragmatic 3 案設計 (structural change 時)"]
          - ["<code>spec-review-vocabulary</code>", "F 軸 1", "<a class=\"xref\" href=\"./constitution.html#p-5\" data-tooltip=\"1 entity = 1 canonical name\">P-5</a> <span class=\"term\" data-term=\"canonical name\" data-tooltip=\"1 entity に対する唯一の正準名 (P-5)。 表記ゆれ・同義語を禁じ、 用語の一貫性を保つ。\">canonical name</span> 違反、 forbidden synonym detection"]
