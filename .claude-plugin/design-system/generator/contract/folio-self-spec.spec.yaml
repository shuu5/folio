    blocks:
      - { type: subhead, anchor: "s3-1-core", heading: "§3.1 dual-audience core (data-audience + fold + essence)", essence: "core 構成は <code>data-audience</code> taxonomy (machine|human) + <code>&lt;details&gt;</code> 視覚 fold + human essence。 machine 部は DOM 常在 (<code>aria-hidden</code> 不使用) で、 畳まれていても AI / accessibility-tree / find-in-page から可読。 <code>folio prime</code> の Tier 1 digest はこの machine SSoT を抽出源とする。" }
      - { type: subhead, anchor: "s3-2-enforcement", heading: "§3.2 consistency = 二層 enforcement (機械的導出の代役)", essence: "1-DOM co-author は機械的導出 (view を生成・維持しない) を持たない novelty ゆえ、 human↔machine の consistency を <a href=\"../decisions/ADR-0028-prose-gate-mechanization.html\">ADR-0028</a> 二層 enforcement で担保する: deterministic な <strong>floor</strong> (<code>folio validate</code> の REQ-DA-STRUCT 構造検査) と LLM <strong>ceiling</strong> (Phase F <code>spec-review-fidelity</code> の意味検査)。 ceiling は装飾でなく構造の要 (load-bearing)。 下表が両層の機構・判定・捕捉・起動の対比。" }
      - type: table
        caption: ""
        headers: ["", "<span class=\"term\" data-term=\"floor\" data-tooltip=\"deterministic な機械検査層 (folio validate gate)。 二層 enforcement の下限で、 機械化可能な品質を CI で強制する (ADR-0028)。\">floor</span> (deterministic)", "ceiling (LLM)"]
        rows:
          - ["機構", "<code>folio validate</code> dual-audience <span class=\"term\" data-term=\"gate\" data-tooltip=\"folio validate / CI が spec 集合へ課す機械検査の単位。 block (violation = exit 1) と warn (exit code 非影響) の 2 channel を持つ (rules §10.2 / REQ-VER-023)。\">gate</span>", "Phase F <code>spec-review-fidelity</code> agent"]
          - ["判定", "構造的対応 + 機械可読 key 一致 (<a class=\"xref\" href=\"./rules.html#req-da-struct-1\" data-tooltip=\"dual-audience を採用する spec の各 [data-audience=&quot;human&quot;] requirement container は [data-audience=&quot;machine&quot;] 子孫を持つ MUST (孤立 human の排除)。\">REQ-DA-STRUCT-1</a>〜5)", "意味的 fidelity (essence が normative を忠実要約か + pattern semantic)"]
          - ["捕捉", "孤立 human / id 不一致 / 値域 / aria-hidden / EARS-pattern declared 不一致", "要約の脱落・誇張・矛盾・pattern 取り違え"]
          - ["起動", "<code>folio validate</code> (CI block)・普遍", "spec 編集時 (folio-architect Phase F)"]
      - type: mermaid
        caption: "図 3. dual-audience co-author の二層 enforcement。 machine SSoT と human 派生 view を 1 DOM に co-author し、 floor (<code>folio validate</code> 構造検査) + ceiling (<code>spec-review-fidelity</code> 意味検査) が機械的導出の代役として consistency を担保する。"
        source_lines:
          - "%%{init: {'theme': 'base', 'themeVariables': {'primaryColor': '#2a4d6e', 'primaryTextColor': '#ffffff'}}}%%"
          - "flowchart TB"
          - "  accTitle: dual-audience co-author の二層 enforcement"
          - "  accDescr: 1 DOM に machine SSoT と human 派生 view を co-author し、 floor (folio validate の REQ-DA-STRUCT 構造検査) と ceiling (spec-review-fidelity agent の意味検査) の 2 層で consistency を担保する"
          - "  SRC[\"dual-audience spec"
          - "(1 HTML artifact)\"]"
          - "  M[\"machine normative"
          - "(canonical SSoT)\"]"
          - "  H[\"human essence + graphical"
          - "(派生 view)\"]"
          - "  SRC --> M"
          - "  SRC --> H"
          - "  FL[\"floor: folio validate"
          - "REQ-DA-STRUCT-1..5"
          - "(構造・key 一致)\"]"
          - "  CE[\"ceiling: spec-review-fidelity"
          - "(意味的 fidelity)\"]"
          - "  M -. \"検査\" .-> FL"
          - "  H -. \"検査\" .-> FL"
          - "  M -. \"検査\" .-> CE"
          - "  H -. \"検査\" .-> CE"
          - "  FL --> OK[\"consistency 担保"
          - "(導出の代役)\"]"
          - "  CE --> OK"
          - "  style SRC fill:#2a4d6e,color:#ffffff"
          - "  style M fill:#5ac8b8,color:#08131a"
          - "  style H fill:#fefbea,color:#08131a"
          - "  style OK fill:#5ac8b8,color:#08131a"
          - "  style FL fill:#e6f6f2,color:#08131a"
          - "  style CE fill:#fdf3f3,color:#08131a"
      - { type: subhead, anchor: "s3-3-js", heading: "§3.3 JavaScript governance", essence: "folio spec の JS は <strong>read-only view enhancement のみ</strong> (content SSoT は static HTML) とする (<a href=\"rules.html#s8-js-governance\">rules.html §8</a>)。 vendored mermaid render は ALLOW、 ES modules + <code>fetch()</code> は file:// 破綻ゆえ PROHIBIT。 現 wave の CSS-only 骨格は本規約と無矛盾。" }
      - { type: subhead, anchor: "s3-4-xref", heading: "§3.4 Object cross-reference (self-application)", essence: "folio 自身の design-intent 空間は <a href=\"rules.html#s9-xref\">rules.html §9</a> の object cross-reference system を self-apply する (<a href=\"../decisions/ADR-0034-object-term-xref-system.html\">ADR-0034</a>): defined-object (P-N / REQ-* / ADR-NNNN / §) の canonical 定義は各 object の in-band 要素が SSoT で、 そこから完全性 lint + AI-graph を生成する。 human は xref を hover して定義 essence を即見、 AI は <code>href</code> と <code>objectGraph</code> projection を辿る。 維持は <code>folio fix</code> の auto-materialize、 完全性は <code>folio validate</code> の 4 gate が担う (completeness は opt-in で、 folio の全 living spec が dogfood 済 — 詳細は機械層)。" }
    machine_blocks:
      - { type: prose, html: "folio 自身の spec は <a href=\"rules.html#s7-dual-audience\">rules.html §7</a> の <span class=\"term\" data-term=\"dual-audience\" data-tooltip=\"1 HTML artifact が machine (精密 normative = canonical SSoT) と human (essence + 視覚 view) の双方を同一 DOM に併せ持つ pattern (ADR-0033)。 artifact 自身が canonical WHAT (提示層) で機械層はその内部にある。 SSoT-first に flip した doc は編集の源が正本 (edit-SSoT) = contract YAML に分かれ、 flip しない doc は提示層が edit-SSoT を兼ねる (ADR-0050 / ADR-0051 §2.3)。\">dual-audience</span> pattern を self-apply し、 <strong>human↔AI hub</strong> として機能する: <strong>machine 精密 normative = canonical <span class=\"term\" data-term=\"SSoT\" data-tooltip=\"Single Source of Truth。 ある object / term の唯一の正準定義 site で、 他所はそこへ参照する。 SSoT-first 転換後は層を明示する修飾付き full 形で用いる: canonical SSoT = 提示層 (生成 HTML) 内の機械層 (精密 normative) / edit-SSoT = 正本 = 提示層を produce する編集起点 (contract YAML、 ADR-0051 §2.3)。\">SSoT</span></strong> を <code>[data-audience=\"machine\"]</code> に、 <strong>human <span class=\"term\" data-term=\"essence\" data-tooltip=\"defined-object の定義 site の既存内容を再利用した plain-text 要約。 xref tooltip の生成元 (rules §9.2、 新規に書き起こさない = P-7)。\">essence</span> + graphical = 派生 view (非規範)</strong> を <code>[data-audience=\"human\"]</code> に 1 DOM で co-author する。 human は cognition-friendly な要約を読み、 AI は machine normative だけを構造的に読む。 規範 (taxonomy / safety <span class=\"term\" data-term=\"invariant\" data-tooltip=\"spec が常に満たすべき構造的・意味的な不変条件。 EARS 要件と folio validate gate が機械的に保証する。\">invariant</span> / JS governance) の SSoT は <a href=\"rules.html#s7-dual-audience\">rules.html §7</a>・<a href=\"rules.html#s8-js-governance\">§8</a> にあり (<a href=\"constitution.html#p-7\">P-7</a> 重複禁止)、 本 §3 は folio 自身の self-application 設計を informative に解説する (<a href=\"../decisions/ADR-0033-dual-audience-hub.html\">ADR-0033</a>)。" }
      - { type: prose, html: "core 構成は <strong><span class=\"term\" data-term=\"data-audience\" data-tooltip=\"要素が machine 向けか human 向けかを示す属性 taxonomy (machine | human の 2 値)。 dual-audience の構造分離に使う。\">data-audience</span> taxonomy (2 値: machine|human) + <code>&lt;details&gt;</code> 視覚 <span class=\"term\" data-term=\"fold\" data-tooltip=\"details/summary による折り畳み表示。 machine 精密部や長大列を既定で畳み、 人間向け要旨を常時可視に保つ (dual-audience の human view 側)。\">fold</span> + human essence</strong> (<a href=\"rules.html#s7-1-taxonomy\">rules §7.1</a> / <a href=\"rules.html#s7-2-canonical-pattern\">§7.2</a>)。 machine 部は DOM 常在 (<code>aria-hidden</code> 不使用) で、 視覚的に畳まれていても AI / accessibility-tree / find-in-page から可読。 <code>folio prime</code> の Tier 1 digest (on-demand 開示。 boot 注入は Tier 0 pointer digest = <a href=\"../decisions/ADR-0055-boot-tier-context-injection.html\">ADR-0055</a>) はこの machine SSoT を抽出源とする (<a href=\"#s7-6-phase-x3-minimal\">§7.6</a> growth path、 <a href=\"../decisions/ADR-0007-context-injection.html\">ADR-0007</a>)。 reference 実装 = <a href=\"verification.html#s3-1-scenario-format\">verification.html §3</a> の dual-audience card (<a class=\"xref\" href=\"./verification.html#req-ver-001\" data-tooltip=\"検証 scenario は tests/scenarios/ 配下の YAML ファイル (構造は §3.2 で定義)。\">REQ-VER-001</a>/002/003/007/009)。 全 living spec への core propagation は後続 wave で行う。" }
      - { type: prose, html: "1-DOM co-author は DITA / literate programming のような<strong>機械的導出 (view は生成・維持しない)</strong> を持たない novelty ゆえ、 human↔machine の consistency を構造でなく <a href=\"../decisions/ADR-0028-prose-gate-mechanization.html\">ADR-0028</a> 二層 enforcement で担保する (<a href=\"../decisions/ADR-0033-dual-audience-hub.html\">ADR-0033</a> §2.4)。 LLM <span class=\"term\" data-term=\"ceiling\" data-tooltip=\"LLM review 層 (Phase F spec-review agent)。 floor が機械検査できない意味的品質を補完する上限 (ADR-0028)。\">ceiling</span> は装飾でなく<strong>構造の要 (load-bearing)</strong>。" }
      - { type: prose, html: "folio spec の JS は <strong>read-only view enhancement のみ</strong> (content SSoT は static HTML) とする規約に従う (<a href=\"rules.html#s8-js-governance\">rules.html §8</a>: ALLOW / PROHIBIT / REQUIRE)。 vendored mermaid render は ALLOW、 ES modules + <code>fetch()</code> は file:// 破綻ゆえ PROHIBIT。 現 wave の CSS-only 骨格は本規約と無矛盾。" }
      - { type: prose, html: "folio 自身の design-intent 空間は <a href=\"rules.html#s9-xref\">rules.html §9</a> の <strong>object cross-reference system</strong> を self-apply する (<a href=\"../decisions/ADR-0034-object-term-xref-system.html\">ADR-0034</a>、 §3 dual-audience hub の object 参照網への拡張)。 <span class=\"term\" data-term=\"defined-object\" data-tooltip=\"一意 canonical ID を持つ参照可能 object (principle P-N / requirement REQ-* / decision ADR-NNNN / rule §)。 Class A xref の対象。\">defined-object</span> (principle <code>P-N</code> / requirement <code>REQ-*</code> / decision <code>ADR-NNNN</code> / rule §) の canonical 定義は各 object の in-band 要素 (その <code>id</code>) が SSoT で、 そこから read-only な projection (完全性 lint + AI-graph) を<strong>生成</strong>する hybrid (DB-as-SSoT 却下)。 <strong>human↔AI hub</strong>: human は <span class=\"term\" data-term=\"xref\" data-tooltip=\"defined-object への in-band な untyped cross-reference (a class=xref + data-tooltip)。 folio fix が穴を materialize し validate が completeness を機械保証する (ADR-0034)。\">xref</span> を hover して定義 essence を即見 (no-JS tooltip)、 AI は <code>href</code> と <code>inventory.json</code> の <code>objectGraph</code> projection を構造的に辿る。 維持は <code>folio fix</code> の auto-materialize (裸 token → xref wrap)、 完全性は <code>folio validate</code> の 4 gate (resolve / uniqueness / tooltip-consistency / completeness) が担う (<a href=\"verification.html#s3-ears\">REQ-VER-017/018</a>)。" }
      - { type: prose, html: "completeness は <strong>opt-in/conditional-normative</strong> (<a href=\"rules.html#s9-4-requirements\">REQ-XREF-002</a>) — <code>folio-xref-completeness=enabled</code> を宣言した doc のみ orphan-mention を block する。 <strong>folio 自身の全 living spec (verification / rules / relations / folio-self-spec / README) が completeness opt-in を宣言し、 prose 内の裸 canonical token は <code>folio fix</code> で xref へ materialize 済 — folio が xref system を self-host (<span class=\"term\" data-term=\"dogfood\" data-tooltip=\"folio 自身を folio の規約・機構で構築し検証する self-application。 規約が実用に耐えるかの検証手段。\">dogfood</span>) する</strong>。 real corpus の <code>folio validate</code> は completeness gate を含め clean。 opt-in 対象は body 改訂可能な living spec に限り、 <code>constitution.html</code> (<a class=\"xref\" href=\"./constitution.html#p-10\" data-tooltip=\"Constitution 自身への変更前 user 確認\">P-10</a> 不可触) と <span class=\"term\" data-term=\"frozen\" data-tooltip=\"accepted 後に本文を改訂しない歴史資産 (ADR / constitution)。 実装との乖離は living spec が divergence trace として記録する (P-10)。\">frozen</span> <span class=\"term\" data-term=\"ADR\" data-tooltip=\"Architecture Decision Record。 設計の WHY (決定・根拠・trade-off) を 1 決定 = 1 文書で記録する frozen な歴史資産 (ADR-worthiness は rules §10.3)。\">ADR</span> は定義 site として read-only に essence を供出するのみ (言及側 living spec の prose だけが wrap される)。 dual-audience の core propagation (§3.1) と同じく、 機構と規範を landable な土台として確立した上で living spec への適用を完了した。" }
  - id: "s7"
    anchor: "s7-harness"
    tint: "warn"
    kicker: "§7 / harness 部品"
    heading: "§7. Harness Layer Components"
    essence: "本 §7 は folio Layer 0 の plugin harness を構成する 5 component を informative に解説する: 7-phase PR cycle (§7.1)・specialist agents (§7.2)・caller marker (§7.3)・5-Layer Defense (§7.4)・CI Gate (§7.5)。 各 component が連携して folio rules を enforce する。 規範 MUST 要件 (caller marker set/unset・CI gate enforcement) の SSoT は <a href=\"rules.html#s10-mandatory\" class=\"normative-ref\">rules.html §10 Mandatory Actions</a> にあり、 本 §7 は設計と enforcement flow を解説する。"
    blocks:
      - { type: subhead, anchor: "s7-1-7phase", heading: "§7.1 7-Phase PR Cycle (folio-architect SKILL)", essence: "folio-architect は spec edit の唯一 author で、 7 phase (A Discovery → B Exploration → C Clarifying → D Design → E Implementation → F Quality Review → G Summary) を順次実行する。 Phase C (grilling) と F (review) は MUST NOT SKIP、 B/D は specialist 並列、 F は review agent 並列 (下表・図 4 の「F 7 並列固定」は完成形 vision で、 v1.0 実装は 5 agent — <a href=\"#s7-2-specialists\">§7.2</a>)。 v1.0 scope は <a href=\"../decisions/ADR-0029-phase-f-agent-set.html\">ADR-0029</a> で確定し、 Phase A/B/C の adoption-aware 化は <a href=\"../decisions/ADR-0031-mattpocock-authoring-absorption.html\">ADR-0031</a> による (下表・図・aside で詳説)。" }
      - type: table
        caption: ""
        headers: ["Phase", "name", "agent", "並列", "必須"]
        rows:
          - ["A", "Discovery", "(なし、 folio-architect 直接)", "—", "MUST (todo list + folio.config.yaml load + adoption-state 検出 → greenfield onboarding / maintenance 分岐)"]
          - ["B", "Spec Exploration", "<code>spec-explorer</code>", "2-3 並列", "MUST"]
          - ["C", "Clarifying / Grilling", "(なし、 user dialog)", "—", "MUST NOT SKIP (gap-driven grilling)"]
          - ["D", "Spec Design", "<code>spec-architect</code>", "2-3 並列", "optional (structural change 時のみ)"]
          - ["E", "Implementation", "(folio-architect 直接)", "—", "MUST (caller marker + Edit + 機械検証 + unset)"]
          - ["F", "Quality Review", "<code>spec-review-{vocabulary,structure,ssot,temporal,ears,stakeholder,fidelity}</code>", "7 並列固定", "MUST NOT SKIP"]
          - ["G", "Summary", "(folio-architect 直接)", "—", "MUST (delta marker check + changelog 更新)"]
      - type: mermaid
        caption: "図 4. 7-phase PR cycle (A 〜 G)。 Phase C/F は MUST NOT SKIP。 Phase B/D は並列 specialist spawn、 Phase F は 7 並列固定 (完成形 vision、 v1.0 は 5 agent)。"
        source_lines:
          - "%%{init: {'theme': 'base', 'themeVariables': {'primaryColor': '#2a4d6e', 'primaryTextColor': '#ffffff'}}}%%"
          - "flowchart TB"
          - "  accTitle: 7-Phase PR Cycle"
          - "  accDescr: Discovery A から Summary G まで 7 phase を順次実行。 Phase B と D は 2-3 specialist 並列、 Phase F は 7 specialist 並列固定"
