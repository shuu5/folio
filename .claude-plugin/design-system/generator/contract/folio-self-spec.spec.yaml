      - { type: subhead, anchor: "s7-5-ci-gate", heading: "§7.5 CI Gate Specification", essence: "CI workflow が強制する 7 gate (link-integrity / declarative-form / what-only / vocabulary / EARS coverage / delta-marker / json-ld-validation) の MUST 要件は <a href=\"rules.html#s10-2\" class=\"normative-ref\">rules.html §10.2</a> にある。 <a href=\"../decisions/ADR-0028-prose-gate-mechanization.html\">ADR-0028</a> 二層 enforcement で、 機械化可能部は deterministic floor (<code>folio validate</code>)、 意味的残余は LLM ceiling (Phase F agent) に分担する。 EARS coverage のみ warn 扱い (下図・aside で詳説)。" }
