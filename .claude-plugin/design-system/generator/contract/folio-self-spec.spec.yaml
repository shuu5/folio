# ★手起こし 1/2 (folio-cuom ■1(8) / 手起こし 2 点のうち contract data 側)  —  head_graph
# ============================================================================
# ★extractor は head_graph を起こさない (JSON-LD は逆抽出対象外の head 資産)。 ゆえ本 block は ★手起こし であり、
