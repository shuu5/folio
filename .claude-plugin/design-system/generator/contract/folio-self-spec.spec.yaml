      - { type: subhead, anchor: "s7-6-phase-x3-minimal", heading: "§7.6 Phase X3 Minimal Implementation", essence: "試作段階 (Phase X3) の plugin minimal scope = <strong>1 skill + 4 hook + 6 script + 1 CLI</strong> (WHAT enumeration の SSoT は <a href=\"../decisions/ADR-0003-plugin-architecture.html#s2-decision\">ADR-0003 §2</a>)。 段階的成長 path: 1 skill (X3) → 3 review agent (X4) → 5 review agent v1.0 (X5-γ + ADR-0033) → 9 agents 完成形 vision (post-1.0)。 §7.2 完成形は未来 anchor として保持し、 実機検証は <a href=\"verification.html\">verification.html</a> sandbox で行う。" }
    machine_blocks:
      - { type: prose, html: "本 §7 は folio Layer 0 の plugin harness を構成する 5 component を規定する。 7-phase PR cycle (§7.1) の各 phase で specialist agents (§7.2)、 caller marker (§7.3)、 5-Layer Defense (§7.4)、 CI Gate (§7.5) が連携し、 folio rules を enforce する。" }
      - { type: prose, html: "<strong>規範要件と informative design の分離</strong>: §7 全体は informative design intent を記述する。 規範 MUST 要件 (caller marker set/unset MUST、 CI gate enforcement MUST) は <a href=\"rules.html#s10-mandatory\" class=\"normative-ref\">rules.html §10 Mandatory Actions</a> に集約する。 本 §7 では各 component の設計と enforcement flow を informative に解説する。" }
      - { type: prose, html: "folio-architect は spec edit の唯一 author。 7 phase (A〜G) を順次実行する。" }
      - { type: note, html: "<p>本 table は完成形の 7-Phase 宣言 (declarative)。 <strong>X5-γ で v1.0 scope 確定 (<a class=\"xref\" href=\"../decisions/ADR-0029-phase-f-agent-set.html\" data-tooltip=\"forward (X5-γ、 user 承認済 (AskUq 方向性 γ)、 実 amend は WS2)\">ADR-0029</a>、 <a href=\"#s7-6-phase-x3-minimal\">§7.6 growth path</a>)</strong>: Phase <strong>B / D</strong> は folio-architect が <strong>inline</strong> 実行する (<code>spec-explorer</code> / <code>spec-architect</code> の agent 化は post-1.0 defer)。 Phase <strong>F</strong> は v1.0 で <strong>5 agent</strong> (<code>spec-review-ears</code> / <code>spec-review-vocabulary</code> / <code>spec-review-ssot</code> / <code>spec-review-temporal</code> / <code>spec-review-fidelity</code>) を並列 spawn する (<code>spec-review-fidelity</code> は <a href=\"../decisions/ADR-0033-dual-audience-hub.html\">ADR-0033</a> の dual-audience ceiling)。 <code>spec-review-structure</code> は <code>folio validate</code> (link-integrity + readme-index) が機械被覆ゆえ <strong>cut</strong>、 <code>spec-review-stakeholder</code> は <strong>post-1.0 defer</strong> (table / 図の 7 並列は完成形 vision として保持)。 disposition の詳細は <a href=\"#s7-2-specialists\">§7.2</a> 末尾 aside を参照。</p>" }
      - { type: note, html: "<p><strong>adoption-aware Discovery + code-cross-reference Exploration + grilling 流 Clarifying (<a href=\"../decisions/ADR-0031-mattpocock-authoring-absorption.html\">ADR-0031</a>)</strong>: Phase A / B / C は consumer の adoption-state と実装現実に適応し、 「実装前に対話で要件を詰める」 普遍的上流活動を folio に内在化する。</p> <ul> <li><strong>Phase A — adoption-state 検出と分岐</strong>: folio-architect は design-intent spec の<em>実体の有無</em>で adoption-state を判定する。 <strong>greenfield</strong> (実体ある spec が未だ無い — constitution 不在 / skeleton README のみ) なら <strong>onboarding grilling</strong> 分岐へ、 <strong>established</strong> (実体 spec あり) なら <strong>maintenance</strong> 分岐へ routing する。 <code>folio.config.yaml</code> の存在は構造 scaffold 済を示すが established を意味しない (<code>folio init</code> は実体に先立ち config を生成する)。 これにより、 greenfield 経路の不在ゆえ人間が init 判断を迫られ空 constitution が \"done\" に残る failure を構造的に解消する。</li> <li><strong>構造は決定論 / 実体は lazy</strong>: <code>folio init</code> CLI は純粋な構造 (dir / <code>folio.config.yaml</code> / <span class=\"term\" data-term=\"cluster\" data-tooltip=\"design-intent/ 内の content domain 別ディレクトリ (spec / decisions / research)。 各 cluster は README.html を index に持つ (P-7 3-domain、 具体 dir 名は folio-self-spec §2)。\">cluster</span> README skeleton) だけを決定論的に生成し、 README index は<strong>実在 file のみ</strong> <code>dc:hasPart</code> 宣言する (各段階で <code>folio validate</code> clean を維持)。 constitution / overview の<strong>本文 (実体) は onboarding grilling が引き出した中身がある時のみ Phase E で materialize</strong> する (<a href=\"../decisions/ADR-0024-folio-init-scope.html\">ADR-0024</a> の seed 挙動を <a href=\"../decisions/ADR-0031-mattpocock-authoring-absorption.html\">ADR-0031</a> が revise)。 空 placeholder を残さない — <a href=\"constitution.html#p-3\">P-3</a> (WHAT-only) の構造 vs 実体の境界を lazy 境界に重ねる。</li> <li><strong>Phase B — code-cross-reference (authoring evidence)</strong>: Phase B (Exploration) は関連 spec / ADR に加え、 established project では <strong>consumer code も読んで</strong> spec の問いを grounding する。 spec の主張と実装現実の<strong>食い違いを Phase C grilling で surface</strong> し spec を研ぐ。 code は spec を<em>研ぐ証拠</em>であって test する gate ではない (出力は良い spec であり pass する test ではない) — <a href=\"../decisions/ADR-0026-test-placement-model.html\">ADR-0026</a> の実装適合性境界を守り、 gate / 新 review agent は作らない (<a href=\"../decisions/ADR-0031-mattpocock-authoring-absorption.html\">ADR-0031</a> §2.6)。</li> <li><strong>Phase C — gap-driven grilling + persist-as-you-go</strong>: Phase C は単発確認でなく、 folio 自前の <strong>grilling protocol</strong> (MIT-attribution、 <code>folio-architect</code> SKILL に同梱、 spec-aware = <span class=\"term\" data-term=\"EARS\" data-tooltip=\"Easy Approach to Requirements Syntax。 要件を ubiquitous / event / state / optional / unwanted の 5 pattern で記述する記法。\">EARS</span> / constitution 原則 / <span class=\"term\" data-term=\"vocabulary\" data-tooltip=\"folio-framework 語の canonical 定義を保持する YAML (vocabulary.yaml)。 folio fix の tooltip populate と Layer 1 consumer の glossary.html derive が読む runtime SSoT (P-5)。 SSoT-first に flip した folio 自身では編集の正本 (edit-SSoT) は glossary contract YAML 側にあり、 本 file はそこからの生成 projection (projection stale gate が byte 一致を保証・ADR-0052)。 flip しない Layer 1 consumer では本 file が edit-SSoT を兼ねる (ADR-0051 §2.3)。\">vocabulary</span> に質問を紐づける) に沿う 1 問ずつの対話である。 <strong>gap-driven</strong>: 既存 spec / vocabulary / ADR / 会話 context から settled を認識し<strong>未解決論点だけ</strong>を尋ねる (解決済みの再尋問はしない)。 <strong>persist-as-you-go</strong>: grilling 中に決まった軽い anchor (vocabulary.yaml の用語 / ADR — <span class=\"term\" data-term=\"caller-marker\" data-tooltip=\"spec 編集を gate する hook 機構 (.folio/architect-active marker file or env var)。 folio-architect 経由の編集のみ許可する (ADR-0006)。\">caller-marker</span> 非 gate) を inline 永続化し、 重い spec (design-intent/spec/ HTML) は Phase E で materialize する。 settled を artifact に宿すことで folio-architect は何度でも安全に再起動でき (<code>grill-me</code> 先行・複数回反復が非冗長)、 この repeatability は read-persist ループからの<strong>創発</strong>である (明示的 re-run モードを持たない)。</li> </ul>" }
      - { type: note, html: "<p><strong>X5-γ v1.0 disposition (<a href=\"../decisions/ADR-0029-phase-f-agent-set.html\">ADR-0029</a> + <a href=\"../decisions/ADR-0033-dual-audience-hub.html\">ADR-0033</a>)</strong>: 本 §7.2 の 9-agent table は完成形 vision として保持する。 v1.0 で実装するのは Phase F の <strong>5 review agent</strong> (<code>spec-review-ears</code> / <code>spec-review-vocabulary</code> / <code>spec-review-ssot</code> / <code>spec-review-temporal</code> / <code>spec-review-fidelity</code>、 fidelity は ADR-0033 の dual-audience 二層 enforcement ceiling)。</p> <ul> <li><code>spec-review-structure</code> = <strong>cut</strong>: directory / naming / cross-ref / heading は <code>folio validate</code> の link-integrity (<a class=\"xref\" href=\"./rules.html#req-ci-010\" data-tooltip=\"link-integrity gate が broken reference を検出したら CI は merge を block する MUST (P-6)。\">REQ-CI-010</a>) + readme-index hook + naming convention が機械被覆するため、 LLM agent を重ねない (<a href=\"../decisions/ADR-0028-prose-gate-mechanization.html\">ADR-0028</a> 二層 enforcement の deterministic floor 側)。</li> <li><code>spec-explorer</code> (Phase B) / <code>spec-architect</code> (Phase D) / <code>spec-review-stakeholder</code> (F軸6) = <strong>post-1.0 defer</strong>: explorer / architect は folio-architect が inline で機能し、 agent 化は実 large-consumer 需要が顕在化した時点。 stakeholder (ISO 42010) は niche。</li> <li>deferred 3 agent は削除でなく将来 opt-in の anchor として §7.2 table に残す。 <code>spec-review-temporal</code> は <a href=\"../decisions/ADR-0028-prose-gate-mechanization.html\">ADR-0028</a> §2.3 の <a class=\"xref\" href=\"./rules.html#req-ci-011\" data-tooltip=\"declarative-form gate が非宣言的構文を検出したら CI は merge を block する MUST (P-4)。\">REQ-CI-011</a> declarative-form を担う LLM ceiling。</li> </ul>" }
      - { type: prose, html: "spec edit を行う AI agent が caller marker を set / unset すべき MUST 要件は <a href=\"rules.html#s10-1\" class=\"normative-ref\">rules.html §10.1</a> (<a class=\"xref\" href=\"./rules.html#req-cm-001\" data-tooltip=\"AI agent が spec_path 配下の file に write を試みる時、 system は caller marker env var が宣言値に set されているか検証する MUST。\">REQ-CM-001</a>〜003) に規定する。 本 §7.3 は PreToolUse hook による enforcement flow chart (下図) を <em>informative</em> に解説する。" }
      - { type: prose, html: "caller marker は AI agent が現在 spec edit 中であることを宣言する。 <code>.claude-plugin/hooks/</code> の PreToolUse hook が env var を check し、 未 set または異なる値の場合は spec 配下 file の編集を block する。" }
      - { type: prose, html: "AI agent は以下の 3 つの context boundary を混同し得る。 本 §7.4 はこれを構造的に防ぐ 5 層の boundary mechanism を informative に解説する:" }
      - type: list
        items:
          - "(a) folio (Layer 0) vs 旧 twill plugin (reference のみ)"
          - "(b) folio (Layer 0、 本 repo) vs consumer projects (Layer 1、 別 repo)"
          - "(c) Layer 1 spec edit (<code>design-intent/spec/</code>) vs Layer 1 実装 edit (<code>src/</code>、 <code>skills/</code> 等)"
      - { type: prose, html: "CI workflow が強制すべき 7 gate の MUST 要件は <a href=\"rules.html#s10-2\" class=\"normative-ref\">rules.html §10.2</a> (<a class=\"xref\" href=\"./rules.html#req-ci-001\" data-tooltip=\"Layer 1 consumer CI workflow は merge を許可する前に下記 7 gate すべてを enforce する MUST。\">REQ-CI-001</a> + REQ-CI-010〜016) に規定する。 本 §7.5 は各 gate の script 実装参照 (<code>.claude-plugin/scripts/</code>) を <em>informative</em> に解説する。 具体的 script 実装は <a href=\"#s9-bindings\">§9 Bindings</a> に集約。" }
      - { type: note, html: "<p><strong>gate enforcement 実体 (X5-γ、 <a href=\"../decisions/ADR-0028-prose-gate-mechanization.html\">ADR-0028</a> 二層 enforcement)</strong>: 7 gate は性質に応じ deterministic floor (<code>folio validate</code>) と LLM ceiling (Phase F review agent) の 2 経路で enforce する。 <strong>gate ごとの floor/ceiling 割当と block/warn disposition の正本は <a href=\"./rules.html#s10-2\">rules §10.2</a> の enforcement aside に一元化</strong>し、 本 spec では再掲しない (<a class=\"xref\" href=\"./rules.html#req-ci-012\" data-tooltip=\"what-only gate が WHAT spec への WHY / HOW content 混入を検出したら CI は merge を block する MUST (P-3 / P-11)。\">REQ-CI-012</a> what-only の二相化 〔構文部分集合 = deterministic floor block、 <a class=\"xref\" href=\"../decisions/ADR-0047-how-outside-floor2-hard-gate.html\" data-tooltip=\"design-intent 本文への明示 HOW primitive 混入を検出する floor-2 (P-11 4-enum 構文検出) を soft-warn から CI hard-block (violation・exit 1・merge block) へ昇格する — staged rollout の完了段 (実測 = 生涯 真陽性 1 件・偽陽性 0)。\">ADR-0047</a>〕 を含む現行割当はそちらを参照 — 並行再掲は正本分岐の drift 源になるため cross-ref に委譲)。 設計原理のみここに記す: 同一原則を二つの重い機構で守らず、 機械化可能部分を floor、 意味的残余を ceiling に分担する。 図 8 の「EARS coverage は実装段階で fail 化検討」は X5-γ で <strong>warn 維持</strong>に確定 (<a class=\"xref\" href=\"./rules.html#req-ci-014\" data-tooltip=\"EARS-coverage gate が well-formed EARS pattern を欠く requirement を検出したら CI は warning を出すが merge は許可する (§6)。\">REQ-CI-014</a> warn 設計)。</p>" }
      # ★★errata folio-642 の ★意図的 1 site delta (下記 html の「完成形 9 specialist agents」)。
      #   before (canonical design-intent/spec/folio-self-spec.html:580 / :578 の aside.informative[data-audience="machine"] 内):
      #     「<a href="#s7-2-specialists">§7.2 (完成形 8 specialist agents)</a>」
      #   after (本契約):
      #     「<a href="#s7-2-specialists">§7.2 (完成形 9 specialist agents)</a>」
      #   ★根拠 (worker 実測・canonical 側 4 site が 9 で一致): :86 TOC「§7.2 Specialist Agents (9 個)」/
      #     :376 見出し「§7.2 Specialist Agents (9 個)」/ :377 essence「完成形 vision の 9 agent」/
      #     :588 別 aside「§7.2 完成形 9 agents」(+ :585「9 agents 完成形 vision」)。 「8」は :580 の ★1 site のみ。
      #   ★批准 = folio-qojv 申送り (iii) + folio-cuom 契約 fence ■5 (裁定 D-2 = 案 A contract-only delta)。
      #   ★状態 = 既知・意図的・受け皿つき (未実証ではない)。 canonical 側は N1 により本 cell では ★触らない —
      #     解消は mkwc の flip (canonical 物理置換) 時であり、 それまで contract と canonical に 1 byte 差が残る。
      #   ★mkwc への申送り: origin snapshot は ★errata 適用前 (「8」のまま) の canonical を byte 忠実に取ること (E5)。
      #     生成物 vs canonical の差分表では本件を「承認済み delta 1 件」として計上する。
      #   ★fidelity ceiling への告知: 本差分は ★捏造ではない (canonical 内部の自己矛盾の是正) — 上記 before/after と
