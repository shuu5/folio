          - ["<code>spec-review-ssot</code>", "F 軸 3", "<a class=\"xref\" href=\"./constitution.html#p-7\" data-tooltip=\"Content domain exclusivity\">P-7</a> content domain exclusivity、 ADR / changes / research 境界"]
          - ["<code>spec-review-temporal</code>", "F 軸 4", "<a class=\"xref\" href=\"./constitution.html#p-4\" data-tooltip=\"Declarative form\">P-4</a> declarative form、 wave-specific narrative 検出"]
          - ["<code>spec-review-ears</code>", "F 軸 5", "EARS 5 pattern 網羅、 REQ-ID uniqueness、 traceability"]
          - ["<code>spec-review-stakeholder</code>", "F 軸 6", "ISO 42010 Stakeholder Perspectives coverage、 AI Agent first-class"]
          - ["<code>spec-review-fidelity</code>", "F 軸 7", "dual-audience human essence ↔ machine normative 意味的 fidelity + EARS pattern semantic (<a class=\"xref\" href=\"../decisions/ADR-0033-dual-audience-hub.html\" data-tooltip=\"dual-audience HTML hub — machine SSoT + human 派生 view を data-audience + fold で 1 DOM co-author (Option B)、 consistency は ADR-0028 二層 enforcement で担保。\">ADR-0033</a> ceiling)"]
      - type: mermaid
        caption: "図 5. specialist agents 並列 spawn pattern。 Phase B (探索) / Phase D (設計、 optional) / Phase F (品質検証、 7 軸並列固定 vision)。"
        source_lines:
