# 用語集 (core 共用 glossary-term-table)。 term = 表示語 / en = canonical (data-term) / def = data-tooltip 由来定義。
glossary:
  - { term: "spec", en: "spec", def: "WHAT (設計意図) を declarative に記述する design-intent 文書。 実装 HOW・決定 WHY と content domain を分離する (P-3 / P-7)。" }
  - { term: "inventory", en: "inventory", def: "design-intent 空間の全 spec を <head> JSON-LD から走査して生成する機械可読 index (inventory.json)。 prime digest と object-graph の projection 元 (REQ-VER-010)。" }
  - { term: "ADR", en: "ADR", def: "Architecture Decision Record。 設計の WHY (決定・根拠・trade-off) を 1 決定 = 1 文書で記録する frozen な歴史資産 (ADR-worthiness は rules §10.3)。" }
  - { term: "cluster", en: "cluster", def: "design-intent/ 内の content domain 別ディレクトリ (spec / decisions / research)。 各 cluster は README.html を index に持つ (P-7 3-domain、 具体 dir 名は folio-self-spec §2)。" }
  - { term: "constitution", en: "constitution", def: "folio の不変原則 (P-1〜P-14) を定める最上位 spec。 Amendment は user 承認必須・spec graph scan 対象外の特別枠 (P-10)。" }
  - { term: "vocabulary", en: "vocabulary", def: "folio-framework 語の canonical 定義を保持する YAML (vocabulary.yaml)。 folio fix の tooltip populate と Layer 1 consumer の glossary.html derive が読む runtime SSoT (P-5)。 SSoT-first に flip した folio 自身では編集の正本 (edit-SSoT) は glossary contract YAML 側にあり、 本 file はそこからの生成 projection (projection stale gate が byte 一致を保証・ADR-0052)。 flip しない Layer 1 consumer では本 file が edit-SSoT を兼ねる (ADR-0051 §2.3)。" }
  - { term: "landing", en: "landing", def: "design-intent/index.html の入口 template (hero 一文 → 単一 CTA → 読者別カード → cluster 一覧、 ADR-0039 §2.2)。 型は build 所有・文言は curated。" }
  - { term: "SSoT", en: "SSoT", def: "Single Source of Truth。 ある object / term の唯一の正準定義 site で、 他所はそこへ参照する。 SSoT-first 転換後は層を明示する修飾付き full 形で用いる: canonical SSoT = 提示層 (生成 HTML) 内の機械層 (精密 normative) / edit-SSoT = 正本 = 提示層を produce する編集起点 (contract YAML、 ADR-0051 §2.3)。" }
  - { term: "gate", en: "gate", def: "folio validate / CI が spec 集合へ課す機械検査の単位。 block (violation = exit 1) と warn (exit code 非影響) の 2 channel を持つ (rules §10.2 / REQ-VER-023)。" }
  - { term: "golden", en: "golden", def: "期待出力を file として commit し byte 比較で回帰を検出する基準 (tests/baselines)。 更新は --accept + diff review の明示手続きを経る (REQ-VER-004)。" }
  - { term: "EARS", en: "EARS", def: "Easy Approach to Requirements Syntax。 要件を ubiquitous / event / state / optional / unwanted の 5 pattern で記述する記法。" }
  # ▼ 文書の主題語 (relations pack 固有・SSoT 外のページ固有語。 folio-49x gate I major の解消)。
  #   本文で頻出する外部標準語彙 (W3C 系) と関係性の方向概念を非エンジニアが引けるようにする。
  #   実出現から導出 (SKOS / RDF / dependsOn 等は本文非出現ゆえ非収録)。parity は intersect (registry) で許容。
  - { term: "JSON-LD", en: "JSON-LD", def: "文書どうしの「つながり」を機械が読める形で書くためのデータ形式 (JSON をもとに W3C が定めた記法)。 folio では各 spec の <head> に埋め込み、 関係性を機械可読にする。" }
  - { term: "W3C", en: "W3C", def: "World Wide Web Consortium。 Web の技術標準を定める国際団体。 folio は関係性を表す語彙を、 まず W3C の標準 (dcterms / schema.org / PROV-O) から採用する。" }
  - { term: "dcterms", en: "dcterms", def: "Dublin Core Terms (DCMI)。 文書間の関係 (置換・参照・部分・要求・来歴) を表す世界共通の標準語彙。 folio は関係を表す言葉をまずここから採る。" }
  - { term: "schema.org", en: "schema.org", def: "Web ページの種類やメタ情報を表す世界共通の標準語彙。 dcterms で表せない型を補い、 folio spec の基底の型として使う。" }
  - { term: "PROV-O", en: "PROV-O", def: "情報の来歴 (どこから派生し・何が生成したか) を表す W3C の標準語彙。 folio は派生元や生成の過程を記録するときに使う。" }
  - { term: "@id", en: "@id", def: "JSON-LD で各文書に付ける、 世界で一つだけの安定した名札 (URI = Web 上の住所)。 その文書を一意に指し示す識別子。" }
  - { term: "@context", en: "@context", def: "JSON-LD の冒頭で「使う言葉 (語彙) の辞書」を宣言する枠。 dc / schema / folio などの名前空間 (prefix) をここで定義する。" }
  - { term: "forward relation", en: "forward relation", def: "ある spec から他の spec へ向かう「こちらから向こう」方向の関係 (例: A が B を参照する)。 spec 本体で明示的に宣言する。" }
  - { term: "reverse relation", en: "reverse relation", def: "他の spec からこちらへ向かう「向こうからこちら」方向の関係 (例: B が A から参照される)。 forward relation から機械的に導出する。" }
