  eyebrow_left: "関係性 spec (Relations)"
  eyebrow_right: "folio — spec 間の関係性表現規約"
  subtitle: "v1.2.0 · status: active · spec 間の関係性表現規約 (JSON-LD + W3C 語彙 + inventory)"
  version: "1.2.0"
  date: "2026-06-24"
  status: "active"
  reader: "Developer, AI Agent, External Reviewer — folio spec を編集する開発者・AI Agent・外部レビュアー"
  # ★folio-6vox Leg A 調停 (2026-07-21): canonical head の folio:stakeholders を逐語転記 (uncovered-loss ゼロ・lwhz 裁定の型・verification contract 同配置)。
  stakeholders: ["Developer", "AI Agent", "External Reviewer"]

# 承認記録 (core 共用 approval-block)。 relations.html は署名欄を持たないため doc lifecycle を忠実に再提示する (synthesized chrome)。
approval:
  - { role: "文書種別", who: "spec (relation management spec)", when: "v1.2.0", stamp: "active" }
  - { role: "生成 (engine tr0 spec-pack fork)", who: "folio design system", when: "2026-06-24 生成", stamp: "生成" }

# ★非終端 照会の graph 接続: relations → constitution (FOLIO-CONSTITUTION 終端) の前方 edge (role=implementation)。
#   verify-graph.sh の rolemap edge がこの 1 本を pin し、 reachability で relations が principle 終端へ到達することを実証する (rolemap 登録は admin/graph 領分)。
graph:
  principle_edge: { target_doc_id: FOLIO-CONSTITUTION, role: implementation }

# ★head JSON-LD の前方 (forward) 関係宣言 (core_emit_graph_head が emit・top-level MUST)。
#   canonical design-intent/spec/relations.html head の self node (@id ./relations.html) から逐語転記した
#   (rules/verification の値を写したものではない)。 reverse (dc:isReferencedBy 14 + folio:depended-by 1) は
#   folio fix が corpus から毎回導出するため手書きしない (SSoT 二重化 = drift 源)。
#   ★extends は書かない: canonical relations head に folio:extends は不在で rules/verification と非対称。
#     書くと folio:extends → ./constitution.html を実 emit し @id census が 21→22 へドリフトする。
#     憲法参照は references の ./constitution.html#s2-principles として既存 (extends とは別物)。
#   references の 2 本は anchor 付き (#s4-format / #s2-principles)。 file 単位へ丸めない。
head_graph:
  id: ./relations.html
  part_of:    [./README.html]
  references: [./rules.html#s4-format, ./constitution.html#s2-principles, ../research/spec-graph-management-research.html]
  depends_on: [./rules.html]

# ★手起こし追記 第 2 弾 (folio-6vox flip ceiling errata 2026-07-21・逐語 port): flip fidelity ceiling が検出した
#   contract 捕捉漏れ 18 block (preamble/persona aside 4 + 標準語彙 MUST prose 群 + 例示 label + traceability) を
#   旧 canonical (git show 4c6a3a5b) から逐語復元した。0qz9 手起こし (上記) と同じく再抽出禁止 fence の対象。
machine_preamble:
  - { type: note, html: "<p>本文書は folio framework の <strong>関係性管理 <span class=\"term\" data-term=\"spec\" data-tooltip=\"WHAT (設計意図) を declarative に記述する design-intent 文書。 実装 HOW・決定 WHY と content domain を分離する (P-3 / P-7)。\">spec</span> (relation management spec)</strong>。 各 spec file 同士の関係 (置き換え / 参照 / 依存 / 拡張 等) を <strong>machine-readable</strong> に表現する規約を定める。</p> <p><strong>背景</strong>: HTML 仕様書群が増えると AI agent が全文を読まずに「どの spec がどう繋がっているか」 を把握する仕組みが必要。 本仕様は <a href=\"../research/spec-graph-management-research.html\">spec-graph-management-research.html</a> (5 並列 researcher × 117 ソースの調査) の結論から、 Phase 1 採用と判断された 3 要素 (W3C 標準語彙 + JSON-LD + <span class=\"term\" data-term=\"inventory\" data-tooltip=\"design-intent 空間の全 spec を &lt;head&gt; JSON-LD から走査して生成する機械可読 index (inventory.json)。 prime digest と object-graph の projection 元 (REQ-VER-010)。\">inventory</span> schema) を規範化する。</p>" }
  - { type: note, html: "<p>本文書は IETF <a href=\"https://datatracker.ietf.org/doc/html/rfc2119\"><strong>RFC 2119</strong></a> および <a href=\"https://datatracker.ietf.org/doc/html/rfc8174\"><strong>RFC 8174</strong></a> / <a href=\"https://datatracker.ietf.org/doc/html/bcp14\"><strong>BCP 14</strong></a> に定義される MUST / SHOULD / MAY のキーワード解釈規約に従う。</p>" }

sections:
  - id: "s0"
    anchor: "s0-reader-guide"
    class: "informative"
    tint: "info"
    kicker: "§0 / 読み方"
    heading: "§0. Reader's Guide"
    essence: "本 spec は Layer 1 consumer と folio Layer 0 自身の双方に適用し、 各 spec が head JSON-LD で宣言した関係性を build 時に inventory へ集約する前提を共有する。 読む順序は §1 標準語彙 → §2 独自語彙 → §3 markup → §4 inventory → §5 双方向。"
    blocks:
      - type: mermaid
        caption: ""
        source_lines:
          - "%%{init: {'theme': 'base', 'themeVariables': {'primaryColor': '#2a4d6e', 'primaryTextColor': '#ffffff'}}}%%"
          - "flowchart TB"
          - "  accTitle: in-band relation から AI 消費までの data pipeline"
          - "  accDescr: 各 spec の head JSON-LD に in-band 宣言された relation を folio inventory が scan して inventory.json に集約し、 folio prime が Tier 1 digest に縮約し、 SessionStart hook が AI agent の初期 context へ注入する。 §3 markup から §4 inventory を経て consumer に届く流れ (上から下へ)。"
          - "  HEAD[\"各 spec の head JSON-LD\\nin-band relation (§3)\"]"
          - "  HEAD -->|\"folio inventory\\nが design-intent/ を scan\"| INV[\"inventory.json\\n3-tier index (§4)\"]"
          - "  INV -->|\"folio prime\"| DIG[\"Tier 1 digest\\n(per-spec entry、§4.2)\"]"
          - "  DIG -->|\"SessionStart hook 注入\"| AI([\"AI agent の初期 context\"])"
    machine_blocks:
      - { type: note, html: "<p>本 spec は <strong>Layer 1 consumer project</strong> および <strong>folio Layer 0 自身</strong> の双方に適用する。 各 spec file が <code>&lt;head&gt;</code> JSON-LD で関係性を宣言し、 build 時に inventory が auto-generate される設計を前提とする。</p> <p>読む順序: §1 (W3C 標準語彙) → §2 (folio 独自語彙) → §3 (JSON-LD markup) → §4 (inventory) → §5 (Bidirectional)。 規範要件 (MUST) は §1〜§4、 §5 は SHOULD レベルの informative ガイダンス。</p>" }
      - { type: note, html: "<p>AI agent (spec edit を行う Claude Code 等) は、 spec 編集前に本 spec § 1〜§ 3 を必読する。 編集対象 spec の <code>&lt;head&gt;</code> JSON-LD を更新する際は §1〜§2 の語彙のみを使い、 独自命名を導入しない (MUST)。 不足する関係性は §5 経由で folio amendment <span class=\"term\" data-term=\"ADR\" data-tooltip=\"Architecture Decision Record。 設計の WHY (決定・根拠・trade-off) を 1 決定 = 1 文書で記録する frozen な歴史資産 (ADR-worthiness は rules §10.3)。\">ADR</span> として提案する。</p>" }
  - id: "s1"
    anchor: "s1-w3c-vocab"
    class: "normative"
    tint: "brand"
    kicker: "§1 / W3C 標準語彙"
    heading: "§1. W3C Standard Vocabulary"
    essence: "関係性は W3C 既存標準語彙 (dcterms / schema.org / PROV-O) を最優先で採用し、 表現できない関係のみ §2 で folio 独自語彙を定義する。"
    blocks:
      - { type: subhead, anchor: "s1-1-dcterms", heading: "§1.1 Dublin Core Terms (DCMI)", essence: "文書間関係 (置換 / 参照 / 部分 / 要求 / 来歴) は dcterms 語彙を採用 MUST、 JSON-LD context に dc prefix を宣言する。" }
      - type: table
        caption: "採用する dcterms 語彙"
        headers: ["folio で表したい関係", "採用語彙", "逆語彙", "備考"]
        rows:
          - ["supersedes (置き換える)", "dc:replaces", "dc:isReplacedBy", "ADR supersedes 関係、 §5 で双方向 materialize 対象"]
          - ["cross-reference (参照)", "dc:references", "dc:isReferencedBy", "spec 同士の引用、 双方向 dual"]
          - ["subsection (一部である)", "dc:hasPart", "dc:isPartOf", "cluster (例: decisions/) ↔ 個別 ADR"]
          - ["requirement (要求事項)", "dc:requires", "dc:isRequiredBy", "強い依存、 folio:depends-on の代替を検討"]
          - ["provenance (来歴)", "dc:provenance", "(なし)", "監査用、 audit trail に使用"]
      - { type: subhead, anchor: "s1-2-schema-org", heading: "§1.2 schema.org (補完)", essence: "dcterms で表せない型・記事メタデータは schema.org で補完し、 spec の base 型は schema:TechArticle とする。" }
      - type: table
        caption: "採用する schema.org 型・プロパティ"
        headers: ["用途", "採用", "備考"]
        rows:
          - ["spec file の base 型", "schema:TechArticle", "schema:Article の specialization、 技術文書向け"]
          - ["creative work 一般", "schema:CreativeWork", "ADR / research note 等の汎用型"]
          - ["citation (出典)", "schema:citation", "research/ から外部 URL を参照する際に使用"]
          - ["基底文書 (派生元)", "schema:isBasedOn", "research → spec の派生関係に使用可能"]
      - { type: subhead, anchor: "s1-3-prov-o", heading: "§1.3 PROV-O (履歴・派生)", essence: "派生・生成の来歴は PROV-O (wasDerivedFrom / wasGeneratedBy) を、 使用時のみ採用する。" }
      - type: table
        caption: "採用する PROV-O 語彙"
        headers: ["folio で表したい関係", "採用語彙", "備考"]
        rows:
          - ["derived-from (派生元)", "prov:wasDerivedFrom", "spec → 派生元 research の関係、 ADR → 元の dialog/issue"]
          - ["generated-by (生成プロセス)", "prov:wasGeneratedBy", "auto-generated artifact (将来の inventory.json 等)"]
    machine_blocks:
      - { type: note, html: "<p>folio relation は <strong>W3C 既存標準語彙を最優先</strong>とする (interoperability + 学習コスト削減)。 独自命名 (folio:* prefix) は §1 で表現できない関係に限り §2 で個別定義する。</p>" }
      - { type: prose, html: "<a href=\"https://www.dublincore.org/specifications/dublin-core/dcmi-terms/\">DCMI Metadata Terms</a> は文書間関係を表現する W3C 推奨語彙集である。 folio 規範では以下の語彙を採用する MUST。" }
      - { type: prose, html: "<strong>@context prefix</strong>: <code>\"dc\": \"http://purl.org/dc/terms/\"</code> を JSON-LD context で MUST 宣言する。" }
      - { type: prose, html: "dcterms で表現できない型情報・記事メタデータは <a href=\"https://schema.org/\">schema.org</a> で補完する。" }
      - { type: prose, html: "<strong>@context prefix</strong>: <code>\"schema\": \"https://schema.org/\"</code> を JSON-LD context で MUST 宣言する。" }
      - { type: prose, html: "<a href=\"https://www.w3.org/TR/prov-o/\">PROV-O</a> (W3C Provenance Ontology) は出所・派生・寄与関係を表現する。 folio では derived-from 系の関係に採用する。" }
      - { type: prose, html: "<strong>@context prefix</strong>: <code>\"prov\": \"http://www.w3.org/ns/prov#\"</code> を JSON-LD context で MUST 宣言する (使用時のみ)。" }
  - id: "s2"
    anchor: "s2-folio-vocab"
    class: "normative"
    tint: "violet"
    kicker: "§2 / folio 独自語彙"
    heading: "§2. folio Custom Vocabulary"
    essence: "標準語彙で表せない folio 固有の関係のみ folio: prefix で独自定義し、 追加は user 承認の ADR を経る MUST。"
    blocks:
      - { type: subhead, anchor: "s2-1-vocab-table", heading: "§2.1 folio 独自語彙 (規範定義)", essence: "folio:depends-on / extends / implements の 3 語を独自定義する (URI 実体は v1.0.0 で解決可能化予定の placeholder)。" }
      - type: table
        caption: "folio:* prefix で定義する独自語彙"
        headers: ["語彙", "意味", "逆語彙", "W3C 代替検討"]
        rows:
          - ["folio:depends-on", "技術的依存 (この spec が成立するために必要な前提 spec)", "folio:depended-by", "dc:requires の方が強すぎる、 折衷で独自定義"]
          - ["folio:extends", "継承・拡張 (rules.html § 等を Layer 1 consumer が拡張する場合)", "folio:extended-by", "schema:additionalType は近いが意味が弱い"]
          - ["folio:implements", "constitution 原則 (P-1〜P-13) の実装関係", "folio:implemented-by", "標準で対応する概念なし (constitution と spec の関係は folio 固有)"]
      - { type: subhead, anchor: "s2-2-naming-rules", heading: "§2.2 命名規則 (standard 優先原則)", essence: "新規関係は標準語彙 → 既存独自語彙 → 新規 folio: 語彙の順で採用判断し、 独自語彙の ADR には却下理由・逆語彙・使用例を含める MUST。" }
    machine_blocks:
      - { type: note, html: "<p>§1 標準語彙で表現できない folio 固有の関係性のみ、 <code>folio:</code> prefix で独自定義する。 独自語彙の追加は ADR を起票し <span class=\"term\" data-term=\"constitution\" data-tooltip=\"folio の不変原則 (P-1〜P-14) を定める最上位 spec。 Amendment は user 承認必須・spec graph scan 対象外の特別枠 (P-10)。\">constitution</span> <a class=\"xref\" href=\"./constitution.html#p-10\" data-tooltip=\"Constitution 自身への変更前 user 確認\">P-10</a> に準じた user 承認を経る MUST。</p>" }
      - { type: prose, html: "<strong>@context prefix</strong>: <code>\"folio\": \"https://folio.dev/spec/v1/\"</code> を JSON-LD context で MUST 宣言する (使用時のみ)。 URI 実体は v1.0.0 リリース時に解決可能化予定 (現在 placeholder)。" }
      - type: prose
        html: 新規関係を spec で導入する際は、 以下の順で採用語彙を決定する MUST。
      - type: list
        items:
        - §1 標準語彙 (dcterms / schema.org / PROV-O) で表現可能か検討する
        - 表現可能なら標準語彙を使用する MUST (独自命名禁止)
        - 表現不可能 (意味が弱い / 強い / 不適合) と判断した場合、 §2.1 既存独自語彙で代替可能か検討する
        - 既存独自語彙で表現不可能な場合のみ、 新規 <code>folio:*</code> 語彙を ADR で提案する
      - type: prose
        html: '独自語彙導入時の ADR には以下を MUST 含める:'
      - type: list
        items:
        - 標準語彙で表現できない理由 (どの語彙を検討したか、 なぜ却下したか)
        - 逆語彙の有無 (双方向 dual を採用するか、 単方向で済むか)
        - 使用 spec 例 (どの spec で本語彙を使う予定か)
  - id: "s3"
    anchor: "s3-jsonld"
    class: "normative"
    tint: "info"
    kicker: "§3 / JSON-LD"
    heading: "§3. JSON-LD Schema in <head>"
    essence: "各 spec は head に JSON-LD ブロックを 1 個 MUST 持ち、 その関係性表現 schema を本章が規定する。"
    blocks:
      - { type: subhead, anchor: "s3-1-minimal", heading: "§3.1 Minimal Example (関係性なし)", essence: "関係性を持たない最小 spec の JSON-LD 例。 @type は schema:TechArticle を採用し、 独自型は使わない。" }
      - type: code
        lines:
          - "<script type=\"application/ld+json\">"
          - "{"
          - "  \"@context\": {"
          - "    \"schema\": \"https://schema.org/\","
          - "    \"folio\": \"https://folio.dev/spec/v1/\""
          - "  },"
          - "  \"@id\": \"./constitution.html\","
          - "  \"@type\": \"schema:TechArticle\","
          - "  \"folio:version\": \"0.4.2-draft\","
          - "  \"folio:stakeholders\": [\"Developer\", \"AI Agent\"]"
          - "}"
          - "</script>"
      - { type: subhead, anchor: "s3-2-full", heading: "§3.2 Full Example (関係性込み)", essence: "複数の関係性 (references / depends-on 等) を宣言する spec の JSON-LD 例。" }
      - type: code
        lines:
          - "<script type=\"application/ld+json\">"
          - "{"
          - "  \"@context\": {"
          - "    \"dc\": \"http://purl.org/dc/terms/\","
          - "    \"schema\": \"https://schema.org/\","
          - "    \"folio\": \"https://folio.dev/spec/v1/\""
          - "  },"
          - "  \"@id\": \"./relations.html\","
          - "  \"@type\": \"schema:TechArticle\","
          - "  \"dc:title\": \"folio relations spec\","
          - "  \"folio:version\": \"0.1.0-draft\","
          - "  \"folio:stakeholders\": [\"Developer\", \"AI Agent\", \"External Reviewer\"],"
          - "  \"dc:references\": ["
          - "    { \"@id\": \"./rules.html#s4-format\" },"
          - "    { \"@id\": \"./constitution.html#s2-principles\" },"
          - "    { \"@id\": \"../research/spec-graph-management-research.html\" }"
          - "  ],"
          - "  \"folio:depends-on\": ["
          - "    { \"@id\": \"./rules.html\" }"
          - "  ]"
          - "}"
          - "</script>"
      - { type: subhead, anchor: "s3-3-id-resolution", heading: "§3.3 @id Resolution Rules", essence: "@id と参照値の記述規則 (自己 / 同一 dir / 上位 dir / section anchor の相対 path、 design-intent/ 配下は絶対 URL 禁止)。" }
      - { type: subhead, anchor: "s3-4-conformance", heading: "§3.4 Conformance Level (Phase 1)", essence: "試作段階の遵守レベル: JSON-LD ブロックと標準語彙優先は MUST、 @id 自己参照と関係性宣言は次 Phase で MUST へ昇格する。" }
      - type: table
        caption: ""
        headers: ["項目", "Phase X2 (現在)", "Phase X3 以降"]
        rows:
          - ["JSON-LD ブロック存在", "MUST", "MUST"]
          - ["@id 自己参照", "SHOULD", "MUST"]
          - ["関係性宣言 (dc:*, folio:*)", "SHOULD", "MUST (リンクを HTML <a href> で書くなら JSON-LD でも書く)"]
          - ["標準語彙優先 (§2.2)", "MUST", "MUST"]
    machine_blocks:
      - { type: note, html: "<p>各 spec file は <code>&lt;head&gt;</code> 内に <code>&lt;script type=\"application/ld+json\"&gt;</code> ブロックを 1 個 MUST 含む (<a href=\"rules.html#s4-format\">rules.html §4.1</a>)。 ブロック内容の関係性表現 schema を本 §3 で規定する。</p>" }
      - { type: prose, html: "関係性を持たない最小 spec の例 (constitution.html 等)。 <code>@type</code> は §1.2 推奨の <code>schema:TechArticle</code> を MUST 採用 (独自 <code>FolioSpec</code> 型は §2.2 命名規則に反するため使用しない)。 <code>dc:title</code> 等の dcterms 語彙を後から追加する場合は <code>@context</code> に <code>\"dc\": \"http://purl.org/dc/terms/\"</code> prefix の追加が MUST (§3.2 Full Example を参照):" }
      - { type: prose, html: "複数の関係性を持つ spec の例 (本 relations.html を含む):" }
      - type: prose
        html: '<code>@id</code> および参照値 (<code>{ "@id": "..." }</code>) は以下の規則で記述する MUST。'
      - type: list
        items:
        - '<strong>自己参照 (self)</strong>: <code>"@id": "./&lt;self-filename&gt;"</code> 形式で、 file 名のみ記述。 例: <code>"./relations.html"</code>。'
        - '<strong>同一 dir 内 spec</strong>: <code>"@id": "./&lt;filename&gt;"</code>。 例: <code>"./rules.html"</code>。'
        - '<strong>上位 dir spec</strong>: <code>"@id": "../&lt;path&gt;"</code>。 例: <code>"./constitution.html"</code>。'
        - '<strong>section anchor</strong>: <code>"@id": "&lt;path&gt;#&lt;section-id&gt;"</code>。 例: <code>"./rules.html#s4-format"</code>。'
        - '<strong>絶対 URL 禁止</strong>: <code>design-intent/</code> 配下では http(s):// で始まる絶対 URL を <code>@id</code> として記述しない (相対 path で表現する)。 例外: <code>@context</code> の <span class="term" data-term="vocabulary" data-tooltip="folio-framework 語の canonical 定義を保持する YAML (vocabulary.yaml)。 folio fix の tooltip populate と Layer 1 consumer の glossary.html derive が読む runtime SSoT (P-5)。 SSoT-first に flip した folio 自身では編集の正本 (edit-SSoT) は glossary contract YAML 側にあり、 本 file はそこからの生成 projection (projection stale gate が byte 一致を保証・ADR-0052)。 flip しない Layer 1 consumer では本 file が edit-SSoT を兼ねる (ADR-0051 §2.3)。">vocabulary</span> URI (<code>http://purl.org/dc/terms/</code> 等) は絶対 URL MUST。'
      - { type: prose, html: "本 §3 の遵守レベルは試作段階 (Phase X2) では以下とする:" }
  - id: "s4"
    anchor: "s4-inventory"
    class: "normative"
    tint: "warn"
    kicker: "§4 / inventory"
    heading: "§4. Inventory Schema"
    essence: "全 spec を集約する inventory.json を auto-generate する設計の schema を規定する (実体 file は CLI 生成で手動作成禁止)。"
    blocks:
