      - type: code
        lines:
          - "{"
          - "  \"$schema\": \"https://folio.dev/inventory/v1.json\","
          - "  \"generatedAt\": \"ISO-8601 timestamp\","
          - "  \"folioVersion\": \"0.x.y-draft\","
          - "  \"specs\": ["
          - "    {"
          - "      \"@id\": \"specs/relations.html\","
          - "      \"title\": \"folio relations spec\","
          - "      \"summary\": \"spec 間の関係性表現規約 (JSON-LD + W3C 語彙 + inventory)\","
          - "      \"doc-type\": \"spec\","
          - "      \"status\": \"draft\","
          - "      \"version\": \"0.1.0-draft\","
          - "      \"stakeholders\": [\"Developer\", \"AI Agent\"],"
          - "      \"relations\": {"
          - "        \"dc:references\": [\"specs/rules.html#s4-format\"],"
          - "        \"folio:depends-on\": [\"specs/rules.html\"]"
          - "      }"
          - "    }"
          - "  ]"
          - "}"
      - type: table
        caption: "inventory.json field 定義"
        headers: ["field", "type", "必須", "source"]
        rows:
          - ["$schema", "URL", "MUST", "固定値 (folio CLI が埋込)"]
          - ["generatedAt", "ISO 8601", "MUST", "CLI 実行時刻"]
          - ["folioVersion", "SemVer string", "MUST", "plugin.json から読込"]
          - ["specs[].@id", "relative path", "MUST", "spec の <head> JSON-LD から"]
          - ["specs[].title", "string", "MUST", "spec <title> または JSON-LD dc:title"]
          - ["specs[].summary", "string (1-2 文)", "SHOULD", "spec <header> .meta または最初の <aside class=\"informative\"> 第 1 段落"]
          - ["specs[].doc-type", "enum", "MUST", "<meta name=\"folio-doc-type\">"]
          - ["specs[].status", "enum", "MUST", "<meta name=\"folio-status\">"]
          - ["specs[].version", "SemVer string", "MUST", "<meta name=\"folio-version\">"]
          - ["specs[].stakeholders", "array", "SHOULD", "<meta name=\"folio-stakeholders\"> または JSON-LD folio:stakeholders"]
          - ["specs[].relations", "object", "SHOULD", "JSON-LD dc:* / folio:* プロパティ集約"]
      - { type: subhead, anchor: "s4-2-tier", heading: "§4.2 Three-Tier Progressive Disclosure Model", essence: "Anthropic Agent Skills の 3-tier loading に倣い、 Tier 1 (inventory) → Tier 2 (head + 要約) → Tier 3 (本文) で AI の context を効率化する。" }
      - type: table
        caption: "3-tier model と folio file の対応"
        headers: ["Tier", "Anthropic Skills", "folio 対応", "tokens 目安"]
        rows:
          - ["Tier 1", "YAML name + description", "inventory.json (本 §4 schema)", "30-50 per spec"]
          - ["Tier 2", "SKILL.md 本体", "各 spec の <head> JSON-LD + 本文サマリ第 1 段落", "500-2000 per spec"]
          - ["Tier 3", "reference files", "各 spec 本文全体 + ../research/*.html", "unbounded"]
      - type: table
        caption: "design-intent/spec/ + constitution.html の Tier 別表現 (Phase X3 の inventory auto-generate 想定)"
        headers: ["file", "Tier 1 (inventory.json entry summary)", "Tier 2 (head + 冒頭 aside)", "Tier 3 (本文)"]
        rows:
          - ["constitution.html", "「folio の 14 不変原則 (P-1〜P-14、 3-tier)」", "JSON-LD + §1 Purpose 第 1 段落", "§1〜§7 全本文 + 不変原則本体"]
          - ["rules.html", "「Layer 1 consumer 向け universal rules + Mandatory Actions」", "JSON-LD + §0 Reader's Guide", "§0、 §2〜§6、 §10 全本文"]
          - ["folio-self-spec.html", "「folio Layer 0 framework 自身の architecture spec」", "JSON-LD + §0 Reader's Guide", "§0〜§9 全本文 + 8 mermaid 図"]
          - ["relations.html (本書)", "「spec 間関係性表現規約 (JSON-LD + W3C 語彙 + inventory)」", "JSON-LD + §0 Reader's Guide", "§0〜§6 全本文"]
      - { type: subhead, anchor: "s4-3-generation", heading: "§4.3 Auto-Generation Timing", essence: "inventory.json の生成・stale 検出のタイミングと Phase を定める (現 X2 は非生成、 X3 で auto-update + CI 検出)。" }
      - type: table
        caption: ""
        headers: ["事象", "generation 動作", "Phase"]
        rows:
          - ["spec file 追加・編集・削除", "inventory.json が auto-updated される MUST (具体的 enforcement mechanism は folio-self-spec.html §7 系に集約予定、 試作 plugin 完成時)", "X3 (試作 plugin 完成後)"]
          - ["CI build 開始時", "inventory.json の stale 状態を 検出し CI failure とする MUST (検出 mechanism は folio-self-spec.html §7.5 系に集約予定)", "X3"]
          - ["scratch 段階 (現在 X2)", "inventory.json は 生成しない。 必要なら手動の specs/README.html 内 file inventory 表が代替", "X2 (現在)"]
      - { type: subhead, anchor: "s4-4-input-output", heading: "§4.4 Input / Output Behavior", essence: "folio inventory CLI の WHAT (走査対象 dir・出力先・失敗モード) を規定し、 実装 HOW は folio-self-spec §9 に隔離する。" }
      - { type: subsubhead, anchor: "s4-4-1-scan", heading: "§4.4.1 Scan target directories" }
      - { type: subsubhead, anchor: "s4-4-2-output", heading: "§4.4.2 Output path" }
      - { type: subsubhead, anchor: "s4-4-3-failure", heading: "§4.4.3 Failure mode" }
      - type: table
        caption: ""
        headers: ["失敗種別", "動作"]
        rows:
          - ["JSON-LD parse error", "該当 file を skip + stderr に warn、 inventory 全体生成は継続"]
          - ["stale 検出 (CI build 時)", "CI failure (rules.html §10.2 REQ-CI-016 json-ld-validation gate と integration)"]
          - ["file system access error", "fatal exit、 stderr に error"]
    machine_blocks:
      - { type: note, html: "<p>folio は全 spec の集約 index (<code>inventory.json</code>) を <strong>auto-generate</strong> する設計を採用する (将来の試作 plugin で実装予定)。 AI agent は inventory.json のみで全体構造を把握でき、 必要な spec だけ Read することで context window を効率的に使う。</p> <p>本 §4 では schema を規定する。 inventory.json の <strong>実体 file は作成しない</strong> (試作 plugin の <code>folio inventory</code> CLI で auto-generate される、 manual 作成は禁止)。</p>" }
      - { type: note, html: "<p>本モデルは <a href=\"https://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills\">Anthropic Agent Skills</a> の 3-tier loading パターンに基づく (調査レポート §3.3)。 AI agent が必要分のみ読み込み、 context window を効率化する。</p>" }
      - { type: prose, html: "AI agent は spec edit 開始時、 Tier 1 (inventory.json) のみ取得して全体構造を把握 MUST。 関連する spec のみ Tier 2 (各 spec head + 第 1 段落) を読み、 編集対象 spec のみ Tier 3 (本文) を読み込む。 全 Tier 3 一括読込は context 圧迫の原因のため SHOULD NOT。" }
      - { type: prose, html: "<strong>例: folio specs の 3-tier mapping</strong>" }
      - { type: note, html: "<p>本 §4.4 は <code>folio inventory</code> CLI (<a href=\"folio-self-spec.html#s7-6-phase-x3-minimal\">folio-self-spec.html §7.6</a> の minimal scope) の WHAT を規定する。 具体的実装 (CLI 引数 / 言語 / 内部 algorithm) は <a href=\"folio-self-spec.html#s9-bindings\">folio-self-spec.html §9 Bindings</a> に隔離 (<a class=\"xref\" href=\"./constitution.html#p-11\" data-tooltip=\"design-intent 文書に HOW を書かない\">P-11</a>)。</p>" }
      - type: prose
        html: <strong>§4.4.1 Scan target directories</strong>
      - type: list
        items:
        - <code>design-intent/spec/</code> + <code>design-intent/decisions/</code> + <code>design-intent/research/</code> を MUST scan (X4-C で <code>scratch/</code> から canonical layout へ物理移植済、 changes/ は <a class="xref" href="../decisions/ADR-0021-constitution-x4-amendment.html" data-tooltip="forward (constitution X4 amendment、 user 承認済、 編集は Phase 1 PARENT)">ADR-0021</a> で廃止)
        - 'scan 対象 file: <code>*.html</code> のうち <code>&lt;head&gt;</code> JSON-LD ブロックを持つもの'
        - '<strong>除外</strong>: <code>@type=FolioConstitution</code> の doc (folio 自身の不変 constitution) は scan 対象外 (<code>FolioConstitution</code> schema = spec の @context-object + @id 規約と別形のため spec graph に含めない、 <a class="xref" href="../decisions/ADR-0023-x4-c-scratch-to-architecture-migration.html" data-tooltip="forward (X4-C、 user 承認済 (AskUq)、 実行は SPAWN + feature-dev)">ADR-0023</a>)。 除外は <code>@type</code> による schema-based 判定で<strong>ファイル名 (<code>constitution.html</code>) に依存しない</strong>ため、 consumer の conforming constitution (<code>@type=schema:TechArticle</code>) は通常 spec として scan + link-integrity 検査される (<a href="../decisions/ADR-0024-folio-init-scope.html">ADR-0024 §2.2</a>、 2026-05-26 に ADR-0023 の name-based 除外を refine)'
        - '<strong>生成 view は scan 外</strong>: <code>folio build</code> が graph から導出する表示層 (<code>design-intent/index.html</code> <span class="term" data-term="landing" data-tooltip="design-intent/index.html の入口 template (hero 一文 → 単一 CTA → 読者別カード → cluster 一覧、 ADR-0039 §2.2)。 型は build 所有・文言は curated。">landing</span> / <code>glossary.html</code>) は design-intent/ 直下 (3 dir の外) に置かれ scan 対象に入らない — graph (<span class="term" data-term="SSoT" data-tooltip="Single Source of Truth。 ある object / term の唯一の正準定義 site で、 他所はそこへ参照する。 SSoT-first 転換後は層を明示する修飾付き full 形で用いる: canonical SSoT = 提示層 (生成 HTML) 内の機械層 (精密 normative) / edit-SSoT = 正本 = 提示層を produce する編集起点 (contract YAML、 ADR-0051 §2.3)。">SSoT</span>) → view (派生) の一方向を保つ (<a class="xref" href="../decisions/ADR-0035-walkable-architecture-nav-derive.html" data-tooltip="architecture/ を「歩ける website」に: top-level index + cluster 横断 nav を">ADR-0035</a> / <a class="xref" href="../decisions/ADR-0036-folio-vocabulary-glossary-derive.html" data-tooltip="folio が folio-framework 語の canonical 定義を上流で author→ship、 consumer は derive (自動 mark)、 描画は hover tooltip のみ (glossary.html は nav/index から到達する独立辞書、 用語 mark から直接 deep-link しない)。 closed (folio 所有・自動 derive) / open (consumer-domain・#110 手動 best-effort) の分割を明文化。 completeness は">ADR-0036</a> / <a href="../decisions/ADR-0039-presentation-template-layer.html">ADR-0039</a>。 view の鮮度は validate の nav-regen-drift / chrome-drift が検査)'
      - type: prose
        html: <strong>§4.4.2 Output path</strong>
      - type: list
        items:
        - repo-root <code>inventory.json</code> (走査 base = <code>design-intent/</code> と出力先 = repo-root を decouple、 x4-plan §5 SSoT / ADR-0023)。 試作 plugin の <code>folio inventory</code> CLI で auto-generate、 manual 作成は禁止、 <code>.gitignore</code> 対象
      - { type: prose, html: "本 §4.4 の規範を実機検証する scenario は、 試作段階では <a href=\"verification.html#s3-6-verification-specific\">verification.html §3.6 REQ-VER-010 / REQ-VER-011</a> の <code>tests/scenarios/inventory-gen.yaml</code> (kind: cli-golden、 <code>folio inventory</code> の生成出力を <span class=\"term\" data-term=\"golden\" data-tooltip=\"期待出力を file として commit し byte 比較で回帰を検出する基準 (tests/baselines)。 更新は --accept + diff review の明示手続きを経る (REQ-VER-004)。\">golden</span> と byte-diff) に集約される。 完成形の auto-regen / stale 検出 (<a href=\"../research/plugin-sandbox-verification-research.html#s7-5-usecases\">research §7.5</a> use case 7 <code>inventory-regen.yaml</code> / REQ-REL-004) は Phase X4+。" }
