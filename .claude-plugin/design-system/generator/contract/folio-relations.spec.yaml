# folio engine tr0 (folio-hd0) — spec-pack contract (relations dual-audience self-host・spec-pack fork)
# ★機械抽出 DRAFT (scripts/extract-relations-spec.sh が design-intent/spec/relations.html から起こした)。 人間レビュー前提。
# doc_type = spec (spec 間の関係性表現規約)。 EARS 章立て規範文 + 非終端 照会 (前方 references)。
# ★抽出範囲 = relations.html の人間層 (section essence + subhead + 表 + 図(mermaid source) + EARS 要件 + 用語 + 照会) + 機械層自由文 (w1f cell-1)。
#   機械層 = data-audience="machine" の <p>/<aside>/<ul> を machine_preamble (文書前文) + sections[].machine_blocks (section 内) に *逐語* capture。
#   ★ただし machine_blocks は「機械層 capture」専用ではない: 人間層 rich list の raw 保持先を兼ねる (下記 手起こし追記 を参照)。
# ★手起こし追記 (folio-0qz9・抽出物ではない): canonical relations.html の人間層 body list 6 本 (25 項 = §2.2 決定順序 ol 4 / §2.2 ADR 要件 ul 3 / §3.3 @id Resolution ol 5 / §4.4.1 Scan target ul 4 / §4.4.2 Output path ul 1 / §6 References ul 8)
#   + 同伴 MUST prose 3 本 + §4.4.1/§4.4.2 ラベル prose を sections[].machine_blocks の type:list / type:prose として逐語 port した。
#   配置層が machine_blocks である理由: 人間層経路の emit_list は esc() で item 内の inline HTML (<code>/<a>/<span class=term>) を壊すため使えない (確定裁定)。
#   ★extract-relations-spec.sh は本経路を再現しない (同 script L88 が人間層 ul/ol を capture しない) — full 再抽出を走らせると本追記 25 項が *silent に消える*。
#   再抽出は禁止 (fence bwif: 下方の 用語 band 12 行を byte 不変に保つこと。 anchor 文字列は本 header に転記しない — 転記すると fence 抽出の始端が header 側に誤 match する)。
#   許容差 (user 批准 2026-07-21): ol→ul の形式 degrade / §6 References の機械 fold 退避。
#   ★JSON-LD: head の <script type=application/ld+json> は doc 自身のメタデータ (assemble が head 生成・machine_blocks でない)。 §3 の <pre><code>&lt;script…&gt;</code></pre> は人間層エスケープ code 例 (通常の code block として往復・特別機構なし)。

