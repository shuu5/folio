# folio engine post-B6 (folio-ehar / c5r Tier C) — interface-pack 入力 contract インスタンス (instance#2 hybrid / code 固有 doc-type 初例)
#
# ドメイン: クリニックの診療予約システム (SRS-CLINIC-APPT / DM-CLINIC-APPT / ARCH-CLINIC-APPT と同一ドメイン・suite 一貫)。
# doc-type = interface (境界の約束 = 何を頼めて・何が返り・どう断られるか)。 hybrid 型 = indexed (操作/エラー catalog) +
#   descriptive (外部連携 + 横断散文)。 agnostic (案A = domain operation catalog・プロトコル中立・HTTP/JSON を書かない)。
#
# ★この pack の核 = cross-doc 前方照会 (案A = 別文書への cross-document link・再掲ゼロ):
#   operations[].refs.srs[]   (claim) → SRS-CLINIC-APPT の要件 (FR/NFR/CON/AC) を *充足照会*
#   errors[].refs.srs[]       (claim) → 同上 (unwanted 型 EARS = FR3/FR4 が「断り方」へ 1:1 接地する初例)
#   external[].refs.srs[]     (claim) → 同上 (外部連携が守る要件・制約)
#   cross_cutting[].refs.srs[] (claim) → 同上 (横断の決まりが担保する要件)
#   principle (terminal)                → 照会 graph の終端 (これ以上遡らない・自前 inline 原則 PRIN-HONEST-BOUNDARY)
#   verify-interface.sh が照会先 SRS contract に当該 ID が実在することを fail-closed で確かめる。
#   ★deep-link: FR/NFR は href fragment == 表示 REQ-ID / CON/AC は文書単位 href + title 注記 (SRS 側 CON/AC アンカー未整備・
#     x8mn 昇格まで暫定・verify の deep-link pin は FR/NFR のみ fragment 必須で開始)。
#
# ★datamodel entity 参照 = uses.entities[] は presentational (graph edge にしない・ID 実在 fail-closed)。
#   ent-chip は datamodel_html#entity-<id> へ deep-link し、 表示名は datamodel contract の entity 名から決定的に解決。
#
# 構造 (6 章 / 操作 / エラー / 外部連携 / 横断 / 原則終端 / 用語) は contract から決定的組立 (捏造不可)。
# prose スロット (cover-summary / chapter-lead-01..06 / plain-<operation-id>×5) のみ opus が後充填。
# core (lib/ + inject-prose.sh) は無改変流用 (rule-of-three: core byte-identity が最重 gate)。
#
# ★binding 予約席 = 将来 C (機械層 protocol binding) への拡張点。 本 version は null 固定 (非 null なら生成前 abort する
#   fail-closed 予約・案A 批准)。 通信方式 (プロトコル) の取り決めは扱わない。
#
# 読者 = クリニックの事業責任者 (医療や IT の専門知識は不要・専門語はやさしい言葉を併記)。

doc_type: interface

meta:
  doc_id: IF-CLINIC-APPT
  title: クリニック診療予約システム — インターフェース仕様
  eyebrow_left: folio design-system / interface
  eyebrow_right: operation catalog + error contract
  subtitle: 予約の窓口に「何を頼めて、 何が返り、 どう断られるか」を 5 つの操作・4 通りの断り方・2 つの外部連携で定める
  version: "1.0"
  date: "2026-07-07"
  reader: クリニックの事業責任者 — 医療や IT の専門知識は不要 (専門語はやさしい言葉を併記)

# 承認記録 (SRS / DM と同じ approval-block・clinic suite 一貫)。
approval:
  - role: 承認 (院長)
    who: 山田 理恵
    when: 2026-07-07 承認
    stamp: 承認済
  - role: レビュー (窓口設計)
    who: 佐藤 健
    when: 2026-07-06 レビュー
    stamp: レビュー済
  - role: 作成 (インターフェース)
    who: 設計チーム
    when: 2026-07-05 起票
    stamp: 作成

# ★cross-doc 照会の解決先 (案A・2 系統)。 verify-interface.sh が SRS contract を読み照会 ID 実在 + doc_id 一致を確かめ、
#   datamodel contract を読み uses.entities の ID 実在 + entity 名解決を行う。 rendered link 先は assembler が deep-link で emit。
cross_doc:
  srs_contract: clinic-appointment.srs.yaml
  srs_doc_id: SRS-CLINIC-APPT
  srs_html: clinic-appointment.srs.html
  datamodel_contract: clinic-appointment.datamodel.yaml
  datamodel_doc_id: DM-CLINIC-APPT
  datamodel_html: clinic-appointment.datamodel.html

# ★band 見出しのうち instance 固有の 3 章 (folio-bhe・datamodel chapters と同型)。 operations_band / errors_band /
#   external_band は件数入り (「N つの操作」== |operations| /「N 通りの断り方」== |errors| /「N つの外部連携」== |external| の
#   ASCII 半角数詞を assemble/verify 両段で強制・全角/漢数字は照合回避ゆえ拒否)。 他 3 章の band 見出しは pack 不変文言。
#   件数を code に焼くと 2nd instance が偽件数を表示する (fabrication 面ゆえ fail-closed 必須)。
chapters:
  operations_band: 5 つの操作で受け付ける
  errors_band: 4 通りの断り方を約束する
  external_band: 2 つの外部連携で外とつながる

# §1 課題と範囲 (context)。 problem = なぜ窓口の約束を先に決めるか / scope_note = この文書が決めること・委ねること (binding 不扱い宣言含む)。
context:
  problem: 窓口の約束が曖昧だと、「頼んだのに受かっていない」「断られた理由が分からない」「いつの間にか外へ連絡が飛ぶ」が起こる。 何を頼めて、 何が返り、 できないときにどう断られるかを先に文書で固定することで、 画面や中の仕組みが変わっても窓口 (インターフェース) の振る舞いは変わらない、 という約束を作る。
  scope_note: この文書は「窓口の約束 (何を渡すと何が起き、 どう断られるか)」だけを決める。 情報の持ち方はデータモデル (DM-CLINIC-APPT) が、 中の仕組みの組み立てはアーキテクチャ記述 (ARCH-CLINIC-APPT) が、 してよいこと・いけないことの要件は要件定義書 (SRS-CLINIC-APPT) が受け持つ。 通信方式 (プロトコル) の取り決めはこの文書では扱わない (binding 予約席・将来拡張)。

# §2 操作 (operations = 5 個)。 各操作 = name / actor / request (渡すもの) / response (返るもの) / uses.entities (使う情報のかたまり・
#   presentational 参照) / errors (起こりうる断り・§3 の error id 集合) / refs.srs (充足照会 edge)。 opc-num は位置 (1-index) から決定的。
operations:
  - id: check-availability
    name: 空きを尋ねる
    actor: 患者・受付スタッフ
    request: 希望する日時の範囲
    response: その範囲で空いている診療枠の一覧 (空きが無ければ「空の一覧」を正直に返す)
    uses: { entities: [appointment-slot] }
    errors: []
    refs: { srs: [FR1] }
  - id: request-appointment
    name: 予約を申し込む
    actor: 患者
    request: 誰が (患者) + どの枠に (診療枠)
    response: 確定した予約 (その枠は確保され、 他の人は入れなくなる)
    uses: { entities: [patient, appointment-slot, appointment] }
    errors: [E-FULL, E-OUT, E-CONSENT]
    refs: { srs: [FR2] }
  - id: change-appointment
    name: 予約を変更する
    actor: 患者
    request: いまの予約 + 新しい枠
    response: 変更後の予約 (元の枠は空きに戻る)
    uses: { entities: [appointment, appointment-slot] }
    errors: [E-FULL, E-OUT]
    refs: { srs: [FR5] }
  - id: cancel-appointment
    name: 予約を取り消す
    actor: 患者
    request: いまの予約
    response: 取り消しの確認 (枠は空きに戻る)
    uses: { entities: [appointment, appointment-slot] }
    errors: []
    refs: { srs: [FR5] }
  - id: check-in
    name: 当日受付する
    actor: 受付スタッフ
    request: 予約 + 本人確認のための情報 (氏名と生年月日)
    response: 受付の完了 (予約は「来院済」になる)
    uses: { entities: [appointment, patient] }
    errors: [E-MISMATCH]
    refs: { srs: [FR7] }

# §3 エラーカタログ (errors = 4 通り)。 各 error = name / when (どんなとき) / promise (どう断り何を案内するか) / refs.srs (充足照会 edge)。
#   FR3/FR4 = unwanted 型 EARS の要件が「断り方」へ 1:1 接地する見せ場 (novelty)。 op-error-chip が #error-<id> へ内部アンカーリンク。
errors:
  - id: E-FULL
    name: 満枠
    when: すでに埋まった枠に申し込もうとした
    promise: 予約を確定させず「満枠」としてその場で断り、 近い空き枠を案内する
    refs: { srs: [FR3, FR1] }
  - id: E-OUT
    name: 枠の外
    when: 診療時間外・休診日の枠に申し込もうとした
    promise: 受け付けず、 受診できる日時を案内する
    refs: { srs: [FR4] }
  - id: E-MISMATCH
    name: 本人不一致
    when: 本人確認の情報が予約の患者と一致しない
    promise: 別人の予約として処理せず、 受付で確認し直すよう案内する
    refs: { srs: [FR7] }
  - id: E-CONSENT
    name: 同意なし
    when: 患者情報の利用に同意していない状態で予約を申し込もうとした
    promise: 患者情報を保存せず、 同意の手続きを先に案内する
    refs: { srs: [CON1] }

# §4 外部連携 (external = 2 つ)。 各 external = name / direction ∈ {out=送る, in=受け取る} / partner (相手) /
#   promise (何を約束して外とやり取りするか) / uses.entities (presentational 参照) / refs.srs (充足照会 edge)。
external:
  - id: send-reminder
    name: リマインドを送る
    direction: out
    partner: 通知サービス
    promise: 予約日の前日に、 患者が事前に同意した連絡先にだけ送るよう依頼する。 送った結果 (済 / 失敗) を記録に残す。
    uses: { entities: [reminder-notification, appointment] }
    refs: { srs: [FR6, CON3] }
  - id: fetch-calendar
    name: 枠と休診日を受け取る
    direction: in
    partner: 診療カレンダー
    promise: 診療枠と休診日は必ず診療カレンダーから受け取り、 この仕組みの中で勝手に作らない (出どころは一つ)。
    uses: { entities: [clinic-calendar, appointment-slot] }
    refs: { srs: [CON4] }

# §5 横断の決まり (cross_cutting = CC-1..2)。 rule = どの操作にも共通してかかる決まり / refs.srs = 充足照会 edge。
cross_cutting:
  - id: CC-1
    rule: どの操作でも本人確認を行い、 別人の予約として処理しない。
    refs: { srs: [FR7] }
  - id: CC-2
    rule: 患者情報は同意を得たあとにだけ受け取り、 目的の外に使わない。
    refs: { srs: [CON1] }

# §5 末尾 原則終端 (principle = 照会 graph の終端・自前 inline 正直な境界の原則。 rolemap terminal.id_expr が graph 終端 edge を張る)。
principle:
  id: PRIN-HONEST-BOUNDARY
  text: 境界は正直に断る — できない求めは曖昧に受けず、 その場で理由と代替を返す。 迷ったら隠さず断る側に倒す。

# ★binding 予約席 (プロトコル束縛・本 version 未対応)。 値 (non-null) が入っていたら生成前 abort する fail-closed 予約 (案A 批准)。
binding: null

# §6 用語集 (glossary = 用語の SSoT。 def = §6 表の定義 / plain_short = 本文の専門語に併記するやさしい言い換え /
#   en = 対訳 (SRS/DM glossary と同形))。 glossary 語どうしは部分文字列禁止 (assemble が拒否)。 これらは clinic union SSoT 外の
#   interface メタ語ゆえ parity intersect で local (SSoT 未収録・en は SSoT と突合されない = en 突合想定 0 は不変)。 en を付けるのは
#   core (verify_core_chrome の glossary 突合) が空 en を IFS=$'\t' read で畳む折 (folio-4wz) を踏まないため = core 無改変の要請。
glossary:
  - { term: 操作, en: operation, plain_short: 窓口に頼める 1 つのお願いの単位, def: 窓口に頼める 1 つのお願いの単位。 何を渡すと何が返るかを 1 つずつ約束する。 }
  - { term: 境界 (インターフェース), en: interface, plain_short: 仕組みの内と外が出会う窓口, def: 仕組みの内と外が出会う窓口。 何を渡すと何が返るかの約束の集まり。 }
  - { term: エラーカタログ, en: error catalog, plain_short: 断り方の一覧表, def: 断り方の一覧表 — どんなときに、 どう断るかの約束を並べたもの。 }
  - { term: 外部連携, en: external integration, plain_short: 外の仕組みとやり取りする約束, def: この仕組みが外の仕組みとやり取りする約束。 送る側と受け取る側がある。 }
  - { term: 横断の決まり, en: cross-cutting rule, plain_short: どの操作にも共通してかかる決まり, def: どの操作にも共通してかかる決まり。 個々の操作でなく全体にかかる。 }

# footer の生成メタ (tag 列は assembler 固定)。
footer:
  gen_meta: folio design-system generator — interface-pack (folio-ehar / instance#2)
