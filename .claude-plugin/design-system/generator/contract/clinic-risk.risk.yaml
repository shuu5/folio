# folio engine post-B6 (folio-wdv0 / c5r capability-census) — risk-register-pack 入力 contract インスタンス
#
# ドメイン: クリニックの診療予約システム (SRS-CLINIC-APPT と同一ドメイン)。
# doc-type = risk-register (リスク登録簿・indexed 型)。testcases-pack と同型の機構
# (決定的 assembler + opus prose + floor/ceiling 2-gate) を risk-register-pack schema
# (risks[] / likelihood・impact / trace / glossary) へ適用する。
#
# ★この pack の核 = 深刻度 (severity) の *決定的導出* + 三段 trace の cross-doc 前方照会:
#   - severity は contract に *持たせない*。 assembler が likelihood(L/M/H)×impact(L/M/H) から
#     決定的に導出する (L=1・M=2・H=3 の積 p: p<=2→低 / p<=4→中 / p>=6→高)。 ゆえ「深刻度の捏造」は
#     原理的に不可能 (元データに severity フィールドが無いため作れない)。 verify-risk.sh が同一導出で
#     card バッジ・matrix セル・tally を再突合する (fabrication-free の核)。
#   - 各 risk が「どの要件 (FR) / 非機能要件 (NFR) を脅かすか」を SRS-CLINIC-APPT へ *前方照会* し、
#     verify-risk.sh が参照先 SRS contract に当該 FR/NFR ID が実在することを fail-closed で確かめる
#     (照会先 requirements/nfr = claim・risk = verification〔assurance 活動〕。testcases 同型・c5r.11 則)。
#   - reachability: risk→SRS は direction: forward (toward-terminal 順) = RISK→SRS→ADR→principle で終端完備
#     (testcases が clinic-appointment.srs へ張るのと同一終端経路を継承)。
#
# 読者 = クリニックの事業責任者 (医療コーディング・IT・リスク管理の専門知識なし。専門語は必ずやさしい言葉を併記)。
# 人間層 = 「何が起こりうるか / どれくらい深刻か / どう備えるか」を平易に。
# 機械層 = likelihood/impact/status/trace + JSON-LD。
#
# fabrication-free: 全 visible token は本 contract 由来 (severity は contract 値でなく決定的導出値)。
# plain 要約のみ prose スロットで後注入。core (lib/ + inject-prose.sh) は無改変流用 (rule-of-three)。

doc_type: risk-register

meta:
  doc_id: RISK-CLINIC-APPT
  doc_type: risk-register
  title: 診療予約の仕組みで「起こると困ること」を洗い出し、 起こりやすさと影響から深刻度を見積もって備える
  eyebrow_left: リスク登録簿 (Risk Register)
  eyebrow_right: クリニック — 診療予約
  subtitle: 何が・どれくらいの確からしさで・どれだけの痛手になりうるかを一覧にし、 対策と担当を結びつける
  version: "1.0"
  date: "2026-06-26"
  reader: クリニックの事業責任者 — 医療コーディングや IT・リスク管理の専門知識は不要 (専門語は必ずやさしい言葉を併記)

# 承認記録 (SRS / testcases と同じ approval-block)
approval:
  - role: 承認 (院長)
    who: 山田 理恵
    when: 2026-06-26 承認
    stamp: 承認済
  - role: レビュー (事務長)
    who: 鈴木 大輔
    when: 2026-06-25 レビュー
    stamp: レビュー済
  - role: 作成 (安全管理担当)
    who: 安全管理チーム
