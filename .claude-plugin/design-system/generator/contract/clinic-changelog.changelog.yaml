# folio engine post-B6 (folio-8ptq / c5r capability-census) — changelog-pack 入力 contract インスタンス
#
# ドメイン: クリニックの診療予約システム (SRS-CLINIC-APPT / ADR-CLINIC-0001 と同一ドメイン)。
# doc-type = changelog (変更履歴)。 version-keyed の indexed 型 = 安価な census pack。
# testcases / ADR generator と *同型* の機構 (決定的 assembler + opus prose + 2-gate) を changelog-pack schema
# (unreleased? / entries[] (version-keyed) / categories (Keep a Changelog) / 各項目 refs) へ適用する。
#
# ★この pack の核 = version-keyed の変更記録 + cross-doc 後方照会 (inter-doc cross-ref):
#   各変更項目が「なぜその変更をしたか (ADR = rationale 照会)」/「どの要件のための変更か (SRS FR = claim 照会)」を
#   *別文書へ照会* し、 verify-changelog.sh が参照先 contract に当該 ADR doc_id / FR ID が実在することを fail-closed で確かめる。
#   ★toward-terminal 経路宣言 (c5r.11 則): changelog → ADR → principle 終端 に到達する経路を rolemap に宣言する
#   (changelog は自前 principle を持たない = graph 充足のための捏造終端は B3 不採択・testcases と同型)。
#
# ★順序 = semver 降順を assembler が決定的に sort (contract の記載順に依存しない = 捏造/乱れ原理不可)。 unreleased 節は opt-in。
# ★章構成 = cover → 最新版ハイライト → version 別 entry 群 → 変更→参照の trace 表。 最近接 shape = testcases/ADR の indexed pattern。
#
# 読者 = クリニックの事業責任者 (医療コーディング・IT・バージョン管理の専門知識なし。 専門語は必ずやさしい言葉を併記)。
# 人間層 = 「いつ・何が変わったか / なぜ変えたか」を平易に。 機械層 = version-keyed の詳細 + cross-doc 照会 + JSON-LD。
#
# fabrication-free: 全 visible token は本 contract 由来。 plain 要約のみ prose スロットで後注入。
# core (lib/ + inject-prose.sh) は無改変流用 (rule-of-three・純粋 pack 挿入)。
# head_graph は demo contract に入れない (folio-8ptq 契約・不変条件)。

doc_type: changelog

meta:
  doc_id: CHANGELOG-CLINIC-APPT
  doc_type: changelog
  title: 診療予約システムの変更履歴 — いつ・何を追加/変更/修正したかを、 その理由や要件と結びつけて版ごとに記録する
  eyebrow_left: 変更履歴 (Changelog)
  eyebrow_right: クリニック — 診療予約
  subtitle: どの版で何が変わったかを、 なぜ変えたか (設計判断) や どの要件のためか (要件定義) までたどれるようにする
  version: "1.0"
  date: "2026-06-24"
  reader: クリニックの事業責任者 — バージョン管理や IT の専門知識は不要 (専門語は必ずやさしい言葉を併記)

# 承認記録 (SRS / ADR / testcases と同じ approval-block)
approval:
  - role: 承認 (院長)
    who: 山田 理恵
    when: 2026-06-24 承認
    stamp: 承認済
  - role: レビュー (開発リード)
    who: 佐藤 健
    when: 2026-06-23 レビュー
    stamp: レビュー済
  - role: 作成 (リリース担当)
    who: リリースチーム
    when: 2026-06-22 起票
    stamp: 作成

# ★cross-doc 後方照会の解決先 (verify-changelog.sh が参照先 SRS / ADR contract を読み込み、 各変更項目の refs に
#   現れる FR ID / ADR doc_id 実在を確かめる)。 *_contract は contract/ dir 起点の相対パス。
cross_doc:
  srs_contract: clinic-appointment.srs.yaml
  srs_doc_id: SRS-CLINIC-APPT
  srs_html: clinic-appointment.srs.html   # ★cross-doc deep-link 先 (root 平置き = path prefix なし)。anchor = SRS の裸 id (#FR2)
  adr_contract: clinic-double-booking.adr.yaml
  adr_doc_id: ADR-CLINIC-0001
  adr_html: clinic-double-booking.adr.html # ★ADR deep-link 先 (anchor = #decision・ADR は doc 粒度照会)

# 01 未リリースの変更 (unreleased = opt-in 節)。 まだ版が付いていない、 次のリリースに入る予定の変更。
#   構造は entries[].categories と同一 (version/date を持たないだけ)。 存在すれば entry 群の先頭に別枠で描画する。
unreleased:
  categories:
    added:
      - id: C1
        text: 予約変更・キャンセルをまとめて行える一括操作の画面を追加する (次リリース予定)。
        refs: { srs: [FR5] }

# 02 リリース済みの版 (entries = version-keyed の本体)。 version は semver (X.Y.Z)・一意。 assembler が semver 降順に
#   決定的 sort する (記載順に依存しない)。 categories は Keep a Changelog 準拠
#   (added/changed/deprecated/removed/fixed/security)・空 category は省略。 各項目 (id 一意・全 doc 横断) は
#   refs で ADR (rationale 照会・なぜ) か SRS FR (claim 照会・どの要件) の少なくとも一方を持つ。
entries:
  - version: "1.2.0"
    date: "2026-06-20"
    categories:
      added:
        - id: C2
          text: 予約日の前日にリマインド通知を自動送付する機能を追加した。
          refs: { srs: [FR6] }
      fixed:
        - id: C3
          text: 満枠の枠にほぼ同時申込があったとき、 まれに 2 件とも確定してしまう競合を修正した。
          refs: { adr: [ADR-CLINIC-0001], srs: [FR3] }
      security:
        - id: C4
          text: 本人確認のやり取りを含む通信を暗号化し、 別人の予約として処理されないよう保護を強化した。
          refs: { srs: [FR7] }
  - version: "1.1.0"
    date: "2026-06-05"
    categories:
      added:
        - id: C5
          text: 診療枠の空き人数をその場で確認できる、 空き枠確認の機能を追加した。
          refs: { srs: [FR1] }
      changed:
        - id: C6
          text: 予約受付を、 確定時に残数を条件付きで 1 減らす「取り合いに強い確定方式」へ切り替えた。
          refs: { adr: [ADR-CLINIC-0001], srs: [FR2] }
      deprecated:
        - id: C7
          text: 申込直前に空きを確認してから確定する旧・二段確認方式を非推奨にした (次版で削除予定)。
          refs: { adr: [ADR-CLINIC-0001] }
  - version: "1.0.0"
    date: "2026-05-15"
    categories:
      added:
        - id: C8
          text: 予約受付の初版を公開した。 患者が空き状況から枠を選ぶと、 予約は重複なく 1 件のみ確保・確定される。
          refs: { srs: [FR2] }
        - id: C9
          text: 診療時間外や休診日にあたる枠は予約対象から外し、 患者には受診可能な日時を代わりに提示するようにした。
          refs: { srs: [FR4] }
      removed:
        - id: C10
          text: 開発中に使っていた、 診療時間の判定を素通りさせる試験用バイパスを削除した。
          refs: { srs: [FR4] }

# 03 用語集 (glossary = 用語の SSoT。 plain_short = 本文の専門語に併記するやさしい言い換え)。
#   changelog メタ語彙 (版・変更履歴の種別) 主体ゆえ、 glossary-parity は intersect 登録 (clinic SSoT 収録語のみ en 逐語一致)。
#   glossary 語どうしは部分文字列禁止 (core_validate_glossary_substring が拒否)。
glossary:
  - { term: 変更履歴,       en: changelog,        plain_short: 変更の記録,        def: いつ・どの版で・何を追加/変更/修正したかを、 新しい版から順に書きとめた記録。 }
  - { term: リリース,       en: release,          plain_short: 公開,              def: 作った版を実際に使える形で世に出すこと。 版番号を付けて区切る。 }
  - { term: 版,             en: version,          plain_short: バージョン,        def: どの時点の中身かを区別するための番号。 数が大きいほど新しい。 }
  - { term: セマンティックバージョニング, en: semantic versioning, plain_short: 意味を持つ版番号, def: 「大きく変わった.機能追加.修正」の 3 つの数字で版を付け、 番号だけで変化の大きさが分かるようにする決め方。 }
  - { term: 非推奨,         en: deprecated,       plain_short: これから使わない印,  def: まだ使えるが、 これからは使わないでほしいと印を付けること。 いずれ削除される。 }
  - { term: 競合,           en: race condition,   plain_short: 同時操作のぶつかり,  def: ほぼ同時の操作どうしがぶつかって、 想定しない結果になりうる状態。 二重予約の原因になる。 }
  - { term: 診療枠,         en: appointment slot, plain_short: 予約できる時間帯,   def: 「何時に何人診られるか」を区切った予約の単位。 1 枠に入れる人数を超えると満枠になる。 }
  - { term: 満枠,           en: fully booked,     plain_short: 空きなし,          def: その枠の受け入れ人数が埋まり、 もう予約を受けられない状態。 }
  - { term: リマインド通知, en: reminder notification, plain_short: 思い出し通知,   def: 予約日の前に「予約があります」と知らせる通知。 来院忘れを減らす。 }
  - { term: 本人確認,       en: identity verification, plain_short: 本人かの確かめ,  def: 予約や受付の相手が予約した本人かを確かめること。 取り違えや情報漏えいを防ぐ。 }

footer:
  gen_meta: folio design-system generator — changelog-pack (version-keyed indexed + cross-doc 後方照会)
