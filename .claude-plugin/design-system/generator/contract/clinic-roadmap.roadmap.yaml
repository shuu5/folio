# folio engine post-B6 (folio-8cha / c5r capability-census) — roadmap-pack 入力 contract インスタンス
#
# ドメイン: クリニックの診療予約システム (SRS-CLINIC-APPT / VISION-CLINIC-APPT と同一ドメイン・suite 一貫)。
# doc-type = roadmap (ロードマップ)。 「何を・どの順で・いつ頃目指すか」を宣言する *記述型* (決めない/探索しない)。
# 記述型ゆえ最近接は vision (なぜ作るか) / 時系列・indexed 面は changelog (version-keyed) を踏襲する:
#   - vision と同じく「宣言する」文書 (採否比較 = ADR / 探索 = research には踏み込まない)。
#   - changelog と同じ indexed 機構 (stage-keyed = version-keyed の類型) + 固定 canonical 区分 (priority = MoSCoW) +
#     決定的順序 (assembler が seq 昇順に sort・contract 記載順に依存しない = 順序の乱れ/捏造は原理不可)。
#
# ★この pack の核 = stage-keyed の未来宣言 + cross-doc 前方照会 (inter-doc cross-ref):
#   各目標項目 (item) が「どの機能の方向へ向かうか (VISION feature = claim 照会)」/「どの要件を満たすか (SRS FR = claim 照会)」を
#   *別文書へ照会* し、 verify-roadmap.sh が参照先 contract に当該 F / FR ID が実在することを fail-closed で確かめる。
#   各 item は vision / srs の少なくとも一方を 1 件以上持つ (照会なしの宙に浮いた目標を禁止)。 片方欠如 = 「〜なし」の
#   負の主張として per-item 束縛で pin する (ehar 則・正の主張チップと負の主張ラベルを両方束縛)。
#   ★toward-terminal 経路宣言 (c5r.11 則): roadmap → VISION → principle 終端 / roadmap → SRS → (VISION 経由で) principle。
#   roadmap は自前 principle 終端を持たない (graph 充足のための捏造終端は B3 不採択・changelog / testcases と同型)。
#
# ★順序 = seq 昇順を assembler が決定的に sort (未来へ向かう順 = 近い段階が先頭)。 changelog の semver 降順 sort と
#   同型の「記載順に依存しない決定的導出」だが方向は逆 (roadmap は近い将来が先頭)。
# ★区分 = priority (MoSCoW: must/should/could) の固定 canonical 順。 空 priority は省略 (「この段階に該当なし」の負の主張を
#   空配列で偽装させない)。 各段階のハイライトで priority 別件数 (0 含む = 負の主張「この優先度の項目なし」) を決定的 emit。
#
# 読者 = クリニックの事業責任者 (医療や IT・工程管理の専門知識なし。 専門語は必ずやさしい言葉を併記)。
# 人間層 = 「何を・どの順で・いつ頃目指すか / なぜ (機能方向・要件)」を平易に。 機械層 = stage-keyed の詳細 + cross-doc 照会 + JSON-LD。
#
# fabrication-free: 全 visible token は本 contract 由来。 plain 要約のみ prose スロットで後注入。
# core (lib/ + inject-prose.sh) は無改変流用 (rule-of-three・純粋 pack 挿入)。

doc_type: roadmap

meta:
  doc_id: ROADMAP-CLINIC-APPT
  doc_type: roadmap
  title: 診療予約システムのロードマップ — 何を・どの順で・いつ頃目指すかを、 機能の方向や要件と結びつけて段階ごとに宣言する
  eyebrow_left: ロードマップ (Roadmap)
  eyebrow_right: クリニック — 診療予約
  subtitle: どの段階で何を目指すかを、 その方向 (なぜ = 機能方向) や 満たす要件 (要件定義) までたどれるようにする
  version: "0.1"
  date: "2026-06-18"
  reader: クリニックの事業責任者 — 工程管理や IT の専門知識は不要 (専門語は必ずやさしい言葉を併記)

# 承認記録 (SRS / vision / changelog と同じ approval-block)
