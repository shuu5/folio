        html: '<p>folio は architecture specification を書くための framework である。 大規模 project でユーザーもしくは AI が当初の設計要件を見失い、 場当たり的修正が積み重なって設計破綻に至るのを防ぐ。 spec は「常に参照され続ける自然言語の design intent reference」 として機能する。</p>'
      - type: raw
        html: '<p>folio は <strong>Layer 0 META FRAMEWORK</strong> であり、 各 consumer project は <strong>Layer 1</strong> として別 git repo に展開される (P-12)。 Layer 0 は rules (constitution + rules.html) と plugin harness (<code>.claude-plugin/</code>) を一体配布し、 Layer 1 は <code>folio.config.yaml</code> 1 file の宣言で全体を consume する。</p>'
