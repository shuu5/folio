      - type: raw
        html: '<ul><li>spec は <em>実装の現状を反映する mirror ではなく、 設計の到達目標</em> を declarative に記述する。</li><li>spec → code 方向の drift (実装が追いついていない) は想定内である。</li><li>code → spec 方向の drift (実装制約が想定を変える) は user-AI dialog で spec を更新する。</li><li>spec 不在の場当たり的逸脱を防ぐことが folio の存在意義である。</li></ul>'
