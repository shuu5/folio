#   - h3 anchor 3 個 (s2-1-always / s2-2-askfirst / s2-3-never) は ★構造レベルが違う ゆえ単一フラット配列へ
#     潰さず sections[].subsections[] という別 key で持つ (principles[].anchor も別 key = 3 レベルを混ぜない)。
