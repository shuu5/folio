#
# ★class は closed allowlist {normative, informative} (先例 folio-5dad / assemble-spec.sh の CLASS_OK)。
#   canonical 実値 = s0/s1/s3/s4/s7 informative・s2/s5/s6 normative。
#
# ★block type allowlist (assemble-principle.sh の SECTION_BLOCK_TYPE_ALLOW と二重保守 = detect↔remediate parity):
#   raw        = 逐語 inner-HTML blob (人間層 pack-local RAW emit)。 rich tokenizer の肯定 allowlist に通る形のみ:
#                tag = a|aside|code|em|li|p|strong|ul / 属性名 = class|data-persona|href /
#                href = fragment・相対 .html/.md・https:// のみ。 script / style / on* 属性は無条件 abort。
