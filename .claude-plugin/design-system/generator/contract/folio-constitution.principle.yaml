#   principles = 14 原則 (tier 3 subsection) を当該位置へ差し込む pack-native block。
#   versioning = §5 の版方針 table を差し込む pack-native block。
#   amendment  = §6 の手順 list を差し込む pack-native block。
#
# ★意図的不搬送 (先例あり): canonical の <figure data-diagram-type="..."> 属性は搬送しない。 既 flip 3 本
#   (rules / verification / relations) とも 0 件で機械消費者 全 stack 0 hit の precedented delta (folio-lq12 mandate)。

