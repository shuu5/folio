    chapter_heading: この憲法を誰が読むのか — 読み手ごとの使い方
    class: informative
    heading: '§0. Reader''s Guide — Stakeholder Perspectives (ISO/IEC/IEEE 42010:2022)'
    blocks:
      - type: raw
        html: '<p>folio は 3 種類の reader を第一級 stakeholder として明示する。 各 spec file の <code>&lt;meta name="folio-stakeholders"&gt;</code> 属性で対象 persona を宣言する。</p>'
