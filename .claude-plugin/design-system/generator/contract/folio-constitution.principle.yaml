# folio engine B4 (folio-igv) — principle-pack 入力 contract インスタンス (instance#4 / rule-of-three 追試)
#
# doc-type = constitution (不変原則 = 照会の終端ロール 'principle' を実 doc-type 化)。
# SRS/ADR/research generator と同型の機構 (決定的 assembler + opus prose + 2-gate) を principle-pack schema
# (principles / versioning / amendment / inbound) へ適用する。
#
# ★この principle の核 = 照会終端 (terminal node) + silent change の機械的排除:
#   - principle は前方照会を *持たない* (照会 graph の終端。 leads_to/justifies 等を宣言したら verify が FAIL)。
#   - inbound (他 doc → principle id) のみを受ける。 verify_cross_doc_refs を target=self で再利用し
#     inbound.ref が principles[].id に実在することを fail-closed で確かめる (phantom principle 照会を捕捉)。
#   - baseline-diff gate: principles の committed golden と diff し、 宣言文/tier/増減の変化には
#     必ず (新規 amended_by → 実在 ADR の照会) + (版 bump) を強制する = silent change を機械的に不可能化
#     (constitution = optional-but-special・B0 決定③ guarantee=CI / 決定④ P-10 一般化=改訂は ADR 経由で照会記録)。
#
# ★忠実抽出: 14 原則 (id/heading/statement/tier/amended_by) は frozen design-intent/spec/constitution.html
#   (§2.1 Always / §2.2 Ask-first / §2.3 Never) から *read-only で* 抽出した。 frozen constitution.html は
#   絶対に編集しない (P-10)。 本 pack の生成物は別ファイルで、 「engine が folio 原則を再現できる」を読み比べで実証する。
#
# 読者 = folio を使い始める開発者・外部レビュアー・AI Agent (専門語はやさしい言葉を併記)。

meta:
  doc_id: FOLIO-CONSTITUTION
  doc_type: constitution           # ★baseline-diff gate + inbound gate を起動するフラグ (verify ④)
  title: folio constitution — 14 の不変原則
  eyebrow_left: 不変原則 (Constitution)
  eyebrow_right: folio — Layer 0 META FRAMEWORK の憲法
  subtitle: folio が拠って立つ 14 の不変原則を、 いつも守る・確認してから変える・絶対にやらない の 3 段で示す
  version: "0.6.0-draft"
  date: "2026-06-11"
  reader: folio を使い始める開発者・外部レビュアー・AI Agent — 14 の不変原則を初めて読む人にも分かる形で (専門語はやさしい言葉を併記)
  # ★doc-header の担い手 pin (folio-lq12・無主地帯 (e)): canonical constitution.html:36-39 の <header class="doc-header">
  #   (h1 「folio constitution」 + div.meta 「v0.6.0-draft · status: draft · 14 immutable principles, 3-tier boundary
  #   declarations」) は、 本 pack では ★cover (core_emit_cover_head の h1 + emit_cover の cover-meta) が担う。
  #   ゆえ sections 側で doc-header 相当を ★二重に運ばない (同じ情報の 2 SSoT 化を禁止)。 canonical の値と生成物の
  #   整合は meta.version / meta.status の ★逐語一致 を verify-principle.sh の frozen census arm が束縛する
  #   (census の VERSION / STATUS 行 = canonical 由来の凍結 literal)。
  # ★head meta 5 本の SSoT (folio-lffq)。 CORE (lib/common.sh core_emit_graph_head) が doc-type / status / version の
  #   3 本を、 pack-local emit_pack_head_meta が layer / stakeholders の 2 本を出す (canonical constitution.html:6-10 と
  #   同じ 5 本・値も逐語一致)。 canonical に無い folio-glossary-automark / folio-xref-completeness は *置かない* (捏造禁止)。
  status: draft                    # canonical constitution.html:9 と一致 (CORE は値が無いと tag ごと無言省略ゆえ必須)
  layer: core                      # canonical constitution.html:7 と一致 (pack-local emit)
  # ★stakeholders は YAML sequence 必須 (scalar は CORE の JSON-LD folio:stakeholders を array→string へ型退行させ
  #   jsonld-lint / inventory / fedges のいずれも捕捉しない fail-open になる = assemble 段で型 guard が abort する)。
  #   meta tag の content は join(", ") で canonical 逐語 1 行 "Developer, AI Agent, External Reviewer" を復元する。
  stakeholders:
    - Developer
    - AI Agent
    - External Reviewer

# ===== spec graph head (folio-lffq / ADR-0004 JSON-LD) =====
# ★@type: FolioConstitution = 不変 framework anchor schema。 bin/folio の 5 site が本 @type を評価し、 うち 4 site
#   (inventory folio_build_entry / folio_is_scan_target / fix Pass1 / validate 主 loop) が scan 除外、 1 site
#   (folio_nav_is_self_root) が self-root の *正の検出* に使う。 doc_type: constitution との対 (assemble 段で束縛)。
# ★前方関係 (part_of / references / depends_on / extends) は 1 本も宣言しない: principle は照会終端 node であり、
#   宣言すれば reverse 材化も検証もされない捏造 edge になる (assemble 段の終端不変条件が abort する)。
head_graph:
  id: ./constitution.html
  type: FolioConstitution

# 承認記録 (SRS / ADR / research と同じ approval-block。core 共用)。constitution への変更は P-10 で user 承認 MUST。
approval:
  - role: 承認 (folio steward)
    who: user (shuu5)
    when: 2026-06-11 承認
    stamp: 承認済
  - role: 改訂反映 (P-14 追加)
    who: ADR-0038
    when: 2026-06-11 反映
    stamp: 反映済
  - role: 生成 (engine B4 principle-pack)
    who: folio design system
    when: 2026-06-20 生成
    stamp: 生成

# ★amended_by の照会先 ADR 実在確認に使う decisions dir (contract dir 起点の相対パス)。
#   baseline-diff gate が「新規 amended_by → 実在 ADR」を確かめる際に decisions_dir/ADR-xxxx-*.html を glob する。
decisions_dir: ../../../../design-intent/decisions

