        html: '<aside class="reader-persona" data-persona="Developer"><p><strong>Developer</strong>: §2 不変原則を実装前に確認する。 §5 SemVer Policy に従って改訂を提案する。 ADR を起票する。</p></aside>'
      - type: raw
        html: '<aside class="reader-persona" data-persona="AI Agent"><p><strong>AI Agent</strong>: spec edit 前に本 constitution + <a href="rules.html">rules</a> + <a href="folio-self-spec.html">folio-self-spec</a> を必読する。 caller context を <a href="rules.html#s10-1">rules.html §10.1</a> (MUST 規範) + <a href="folio-self-spec.html#s7-3-caller-marker">folio-self-spec.html §7.3</a> (hook flow) の定める方法で宣言する。 cwd が folio repo (Layer 0) 配下か consumer project (Layer 1) 配下かを最初に確認する。</p></aside>'
