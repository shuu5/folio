# folio engine post-B6 (folio-8ptq) — changelog-pack prose manifest (③「読みやすさの足場」)
#
# opus 著作物。 決定的 assembler が空で出力した data-prose-slot に inject-prose.sh が
# HTML escape して注入する。 slot-id ↔ 散文の 1:1 対応 (集合一致を inject が fail-closed 検査)。
#
# 各値は機械 SSoT (contract/clinic-changelog.changelog.yaml) 接地。 捏造/歪曲/脱落は fidelity ceiling
# (fidelity-changelog + persona-walk-changelog) の検査対象。 値は単一行 (tab/改行禁止)。
#   - plain-Cx = ★fidelity ceiling の主対象。 当該変更項目の text にだけ接地し、 SSoT に無い変更・理由を新造しない。
#   - latest-highlight = 最新版 (semver 降順の先頭) で何が変わったかの要旨。 categories 件数/項目に接地する。
#   - 版順 (semver 降順)・cross-doc 照会先の事実は entries/cross_doc の構造から接地する。

slots:
  # ---- 表紙: この変更履歴が約束すること (cover-summary) ----
  cover-summary: "診療予約システムの版ごとの変更を、 新しい版から順に「いつ・何を追加/変更/修正したか」で記録し、 それぞれの変更が どの設計判断 (ADR-CLINIC-0001) に基づくか / どの要件 (SRS-CLINIC-APPT) のためかまでたどれるようにした変更履歴です。"

  # ---- 章リード (各章の導入・章構成接地) ----
  chapter-lead-01: "まず、 いちばん新しい版で何が変わったかをひとめで示します。 追加・変更・非推奨・削除・修正・セキュリティの 6 つの区分ごとに、 その版での件数を並べます (0 件の区分は「変更なし」を意味します)。"
  chapter-lead-02: "次に、 新しい版から順に、 各版で何が変わったかを区分ごとに並べます。 未リリースの変更 (次の版に入る予定) があれば先頭に別枠で示し、 リリース済みの版は版番号の新しい順に並びます。"
  chapter-lead-03: "どの変更が、 なぜ (どの設計判断) / どの要件のために行われたかを 1 枚の表で見渡します。 各変更から、 理由を記した ADR や、 満たすべき要件を定めた SRS へたどれることを示します。"
  chapter-lead-04: "本文に出てくる専門語を、 やさしい言葉で説明します。 読んでいて分からない言葉が出てきたら、 ここに戻れます。"

  # ---- 最新版ハイライト (categories 件数/項目に接地) ----
  latest-highlight: "最新の v1.2.0 では、 前日のリマインド通知を追加し、 満枠の枠にほぼ同時申込があったときにまれに二重確定してしまう競合を修正し、 本人確認を含む通信の保護を強化しました。"

  # ---- 各変更項目のやさしい一言 (当該 text に接地) ----
  plain-C1: "予約の変更やキャンセルを 1 件ずつでなくまとめて行える画面を、 次のリリースで足す予定です。"
  plain-C2: "予約の前日になると「予約があります」という通知が自動で届くようになりました。"
  plain-C3: "満枠の枠にほぼ同時に申し込みが来たとき、 まれに 2 件とも通ってしまう不具合を直し、 確定は 1 件だけになるようにしました。"
  plain-C4: "本人確認のやり取りを含む通信を暗号化し、 別の人の予約として処理されないよう守りを固めました。"
  plain-C5: "その枠にあと何人ぶん空きがあるかを、 その場で確認できるようになりました。"
  plain-C6: "予約の確定を、 申込が重なっても取り違えにくい「取り合いに強い方式」に切り替えました。"
  plain-C7: "申込の直前に空きを確かめてから確定する古いやり方は、 これからは使わない扱いにしました (次の版で削除予定)。"
  plain-C8: "空いている枠を選んで申し込むと、 その枠を 1 件だけ押さえて予約が確定する仕組みの最初の版を公開しました。"
  plain-C9: "診療時間外や休診日の枠に申し込んでも受け付けず、 代わりに受診できる日時を案内するようにしました。"
  plain-C10: "開発中だけ使っていた、 診療時間のチェックを飛ばす試験用の抜け道を取り除きました。"
