# folio engine post-B6 (folio-1q8o / c5r Tier C) — data-model-pack prose manifest (③「読みやすさの足場」)
#
# opus 著作物。 決定的 assembler が空で出力した data-prose-slot に inject-prose.sh が HTML escape して注入する。
# slot-id ↔ 散文の 1:1 対応 (集合一致を inject が fail-closed 検査)。 値は単一行 (tab/改行禁止・markup 不可 = escape される)。
#
# 各値は機械 SSoT (contract/clinic-appointment.datamodel.yaml) 接地。 捏造/歪曲/脱落は禁止 (特に「6 つ」「5 本」「最大 1 件」)。
#   - cover-summary  = このデータモデルが約束すること (件数・不変条件の要旨)。
#   - chapter-lead-NN = 各章の導入 (章構成に接地)。
#   - plain-<entity> = 各かたまりのやさしい一言 (当該 entity の description/fields と §参照だけに接地)。
# ★内容は user walk PASS 済 mockup (datamodel-demo/) の手書きスロットを manifest 化 (readability 確定形)。
#   例外 = chapter-lead-06 のみ digest ⑥ (型列語の前方参照) 由来の一文を mockup へ追記した確定形 (ceiling round-1 承認)。

slots:
  # ---- 表紙: このデータモデルが約束すること (cover-summary) ----
  cover-summary: "予約にまつわる情報を 6 つのかたまりに分け、 5 本のつながりでつなぎます。 「1 つの枠に確定予約は最大 1 件」「枠はカレンダーの範囲内でしか作れない」をデータの決まりとして埋め込み、 二重予約や取り違えを画面の注意でなく情報の形として封じます。 要件 (SRS-CLINIC-APPT) への照会つきです。"

  # ---- 章リード (各章の導入・章構成接地) ----
  chapter-lead-01: "予約の事故は、 画面や手順だけでなく「情報の持ち方」の問題でもあります。 まず何を・どんなかたまりで・どうつないで持つかを決め、 事故が起こらない形を土台に埋め込みます。 この文書が決めるのは「何を持つか・どうつながるか」だけです。"
  chapter-lead-02: "細かい説明の前に、 6 つの情報のかたまりと 5 本のつながりを 1 枚の ER 図で見渡します。 線の端の記号が「いくつ対いくつ」を表し、 診療枠と予約の「最大 1 件」が二重予約防止の要です。"
  chapter-lead-03: "予約にまつわる情報を 6 つのかたまりに分けます。 台帳 (master) が 4 つ、 できごとの記録 (event) が 2 つ。 中心は「予約」です。 患者だけは特に慎重に扱う情報を持ちます。"
  chapter-lead-04: "6 つのかたまりを結ぶ 5 本のつながりと、 そこに埋め込んだ決まりを見ます。 とくに「診療枠 対 予約 = 最大 1 件」と「枠はカレンダーの範囲内でしか作れない」が、 事故をデータの形として封じます。 緑の枠が「どんなときも破れない決まり」です。"
  chapter-lead-05: "何を持たないか・何のために使うか・いつ消すかを 3 つの決まりで定めます。 「持たなければ漏れない」を基本に、 患者情報を最小限に絞ります。 最後に、 これらを貫く一つの原則で締めます。"
  chapter-lead-06: "本文に出てくる専門語を、 やさしい言葉で説明します。 読んでいて分からない言葉が出てきたら、 ここに戻れます。 型を表す言葉 (識別子・参照・区分) もここで引けます。"

  # ---- 各かたまりのやさしい一言 (plain-<entity-id>・当該 entity の description/fields + §参照 接地) ----
  plain-patient: "予約する人そのもの。 名前・連絡先・生年月日など、 本人確認に要る最小限だけを持ち、 それ以上 (症状や診断) は持たない (§5 DP-1)。"
  plain-practitioner: "診療枠を受け持つ医師。 誰の枠かをはっきりさせるための最小限の情報だけを持つ。"
  plain-appointment-slot: "「何時から何時まで・どの医師」という予約の入れ物。 1 つの枠に確定予約は最大 1 件しか入らない (§4 REL-2 が二重予約を封じる要)。"
  plain-appointment: "この文書の主役。 「どの患者が・どの枠で受診するか」の約束そのもの。 取消や来院済みは、 記録を消さずに状態の付け替えで表す。"
  plain-reminder-notification: "前日に送るお知らせの記録。 送れたか失敗したかが後から分かるので、 来院忘れ対策の抜けを追える。"
  plain-clinic-calendar: "診療する日・しない日と診療時間を定める台帳。 枠はこの範囲の中でしか作れない (§4 REL-5)。"
