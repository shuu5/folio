# folio engine post-B6 (folio-wdv0) — risk-register-pack prose manifest (③「読みやすさの足場」)
#
# opus 著作物。決定的 assembler が空で出力した data-prose-slot に inject-prose.sh が
# HTML escape して注入する。slot-id ↔ 散文の 1:1 対応 (集合一致を inject が fail-closed 検査)。
#
# 各値は機械 SSoT (contract/clinic-risk.risk.yaml) 接地。捏造/歪曲/脱落は fidelity ceiling
# (fidelity-risk = 機械 SSoT 突合 + persona-walk) の検査対象。値は単一行 (tab/改行禁止)。
#   - plain-RSKx = ★fidelity ceiling の主対象。 当該 risk の title/statement/mitigation だけに接地し、
#     SSoT に無い事実・対策を新造しない。 深刻度 (severity) は likelihood×impact の決定的導出値であり、
#     plain 文で言及するときは導出どおりに述べる (捏造しない)。

slots:
  # ---- 表紙: このリスク登録簿が約束すること (cover-summary) ----
  cover-summary: "診療予約の仕組みで「起こると困ること」を洗い出し、 それぞれの起こりやすさと影響の大きさから深刻度を見積もって、 対策と担当を結びつけたリスク登録簿です。 各リスクが SRS-CLINIC-APPT のどの要件・非機能要件を脅かすかをたどれるようにしています。"

  # ---- 章リード (各章の導入・章構成接地) ----
  chapter-lead-01: "まず、 洗い出したリスクを「起こりやすさ」と「影響の大きさ」で並べた見取り図で、 どこが深刻かを一目でつかみます。 深刻度は起こりやすさと影響から機械的に見積もっており、 恣意的に決めていません。"
  chapter-lead-02: "リスクを深刻度の高い順に 1 件ずつ並べます。 各カードは「何が起こりうるか (中身)・起こりやすさと影響・どう備えるか (対策)・担当」を示し、 そのリスクが脅かす要件を結びつけます。"
  chapter-lead-03: "どのリスクがどの要件・非機能要件を脅かしているかを 1 枚の表で見渡します。 深刻度と対応状況もあわせて、 抜けや取り違えなく追えることを示します。"
  chapter-lead-04: "本文に出てくる専門語を、 やさしい言葉で説明します。 読んでいて分からない言葉が出てきたら、 ここに戻れます。"

  # ---- 各リスクのやさしい一言 (title/statement/mitigation 接地) ----
  plain-RSK-001: "同じ診療枠に 2 人が同時に申し込んだとき、 うっかり両方を確定させると二重予約になり患者を待たせます。 起こりやすさは中・影響は大きく、 深刻度は高。 1 枠 1 件の確定にして片方だけ通す対策を進めています。"
  plain-RSK-002: "サーバ障害などで予約の受付が丸ごと止まると診療の入り口が塞がります。 めったに起きませんが起きたときの痛手は大きく、 深刻度は中。 電話受付への切り替え手順を備え、 このリスクは受け入れて監視します。"
  plain-RSK-003: "本人確認が甘いと予約した人と別人を取り違え、 診療や個人情報の取り違えにつながります。 起こりやすさは低いものの影響は大きく、 深刻度は中。 確認できないものは差し戻す対策を進めています。"
  plain-RSK-004: "リマインド通知が届かないと来院忘れによる無断キャンセルが増え、 空いた枠が無駄になります。 起こりやすさも影響も中で、 深刻度は中。 送付率を計測して不達を見つける対策を進めています。"
  plain-RSK-005: "予約開始直後に申し込みが集中すると応答が遅くなり、 患者が二重に押しやすくなります。 起こりやすさは高いが 1 件の影響は小さく、 深刻度は中。 まだ着手前で、 負荷試験で応答を調整する予定です。"
  plain-RSK-006: "診療カレンダーとの突き合わせが漏れると、 診療時間外や休診日の枠に予約が通ってしまいます。 起こりやすさは低く影響も中程度で、 深刻度は低。 受診可能な日時かを必ず判定する対策を済ませています。"
  plain-RSK-007: "キャンセル後に枠開放が漏れると、 空いている枠が予約可能として表に出ず受診機会を逃します。 起こりやすさも影響も小さく、 深刻度は低。 残る危なさは受け入れつつ、 開放処理を確認します。"
  plain-RSK-008: "通信の暗号化や閲覧権限が不十分だと、 受診歴などの特に守るべき情報が漏れて患者に大きな不利益を与えます。 起こりやすさは中・影響は大きく、 深刻度は高。 暗号化と権限管理・定期監査の対策を進めています。"
