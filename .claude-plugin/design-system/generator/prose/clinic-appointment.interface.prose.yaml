# folio engine post-B6 (folio-ehar / c5r Tier C) — interface-pack prose manifest (③「読みやすさの足場」)
#
# opus 著作物。 決定的 assembler が空で出力した data-prose-slot に inject-prose.sh が HTML escape して注入する。
# slot-id ↔ 散文の 1:1 対応 (集合一致を inject が fail-closed 検査)。 値は単一行 (tab/改行禁止・markup 不可 = escape される)。
#
# 各値は機械 SSoT (contract/clinic-appointment.interface.yaml) 接地。 捏造/歪曲/脱落は禁止 (特に「5 つ」「4 通り」「2 つ」)。
#   - cover-summary  = このインターフェース仕様が約束すること (件数・断り方の要旨)。
#   - chapter-lead-NN = 各章の導入 (章構成に接地)。
#   - plain-<operation> = 各操作のやさしい一言 (当該 operation の request/response/errors と §参照だけに接地)。
# ★内容は user walk PASS 済 mockup (interface-demo/) の手書きスロットを manifest 化 (readability 確定形)。
#   markup (<b> 等) は inject が escape するため除去した plain text 形。

slots:
  # ---- 表紙: このインターフェース仕様が約束すること (cover-summary) ----
  cover-summary: "この文書は、 予約の窓口でできることを 5 つの操作として定めます。 それぞれに「何を渡すと何が返るか」を約束し、 受けられないときの断り方を 4 通りのエラーとしてあらかじめ約束します。 さらに 2 つの外部連携で外の仕組みとつながります。 画面や中の作りが変わっても、 窓口の振る舞いは変わりません。 要件 (SRS-CLINIC-APPT) への照会つきです。"

  # ---- 章リード (各章の導入・章構成接地) ----
  chapter-lead-01: "予約の窓口の「取扱説明」にあたる文書です。 この章でなぜ約束を先に決めるのかを押さえたら、 あとは 5 つの操作 (§2) → 断り方 (§3) → 外部連携 (§4) → 横断の決まり (§5) の順に、 窓口の約束を一つずつ見ていきます。"
  chapter-lead-02: "この窓口で受け付ける操作は 5 つです。 それぞれについて「誰が使い」「何を渡すと」「何が返るか」を約束します。 受けられないときの断られ方は §3 のエラーへ、 使う情報のかたまりはデータモデルへ、 それぞれ照会でつなぎます。"
  chapter-lead-03: "できない求めをあいまいに受けないよう、 断り方を 4 通りのエラーとしてあらかじめ約束します。 それぞれ「どんなときに」「どう断り、 何を案内するか」を定めます。 §2 の操作からは、 起こりうる断りがこの一覧の各項目へリンクします。"
  chapter-lead-04: "この仕組みは 2 つの外部連携で外とつながります。 一つは外へ送る連携 (リマインド)、 もう一つは外から受け取る連携 (診療枠と休診日)。 それぞれ、 何を約束して外とやり取りするかを定めます。"
  chapter-lead-05: "どの操作にも共通してかかる決まりを 2 つ定めます。 本人確認と、 患者情報の同意。 最後に、 これらを貫く一つの原則で締めます。"
  chapter-lead-06: "本文に出てくる専門語を、 やさしい言葉で説明します。 読んでいて分からない言葉が出てきたら、 ここに戻れます。"

  # ---- 各操作のやさしい一言 (plain-<operation-id>・当該 operation の request/response/errors + §参照 接地) ----
  plain-check-availability: "空いている時間を尋ねるだけの操作。 予約は動かしません。 空きが無ければ、 ごまかさず「空の一覧」を正直に返します。"
  plain-request-appointment: "空いた枠に予約を申し込む操作。 受かればその枠は確保され、 他の人は入れなくなります。 満枠・時間外・同意なしのときは、 その場で理由を添えて断ります (§3)。"
  plain-change-appointment: "いまの予約を別の枠へ移す操作。 移せたら元の枠は空きに戻ります。 移し先が満枠・時間外なら断ります (§3)。"
  plain-cancel-appointment: "予約を取り消す操作。 枠は空きに戻ります。 記録自体は消さず「取消」として残すので、 後から履歴を追えます。"
  plain-check-in: "来院した患者を当日受付する操作。 氏名と生年月日で本人確認し、 一致すれば予約は「来院済」になります。 一致しなければ別人扱いにせず、 受付で確認し直します (§3)。"
