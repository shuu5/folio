# folio engine (folio-bxpm) — spec-pack prose manifest (③「読みやすさの足場」) — srs-verification fork
#
# opus 著作物。決定的 assembler が空で出力した data-prose-slot に inject-prose.sh が
# HTML escape して注入する。slot-id ↔ 散文の 1:1 対応 (集合一致を inject が fail-closed 検査)。
#
# 各値は機械 SSoT (contract/folio-srs-verification.spec.yaml = srs-verification.html から機械抽出) 接地。捏造/歪曲/脱落は
# fidelity ceiling (機械 SSoT 突合 + persona-walk) の検査対象。値は単一行 (tab/改行禁止)。
#   - cover-summary は doc 全体 (section/要件/照会) に接地する。
#     ★self-host pack (機械層 dual-audience) では機械層を fold に逐語保持する (原本↔生成物 round-trip を floor が enforce) ため、
#     「機械向けの詳細は元の *.html を参照」型の文言は禁止 (読者誤誘導 = gate J finding)。 fold を開けば読めると案内する (README ③)。
#     ★fold のラベル名を本文中で案内する場合は ★生成物に実在するラベル逐語 でなければならない (ADR-0054 §2.2 の
#       平易化で mf-kicker =「機械向けの詳細（原文そのまま）」/ rq-norm summary =「正確な条文（機械向けの厳密な書き方）」
#       へ改名済)。 旧ラベル (『機械層』/『normative (machine)』) の案内は ★存在しない fold 名への誘導 = 読者誤誘導。
#     ★srs-verification は 5 section のうち ★§2 (done-condition REQ) が machine_blocks を 0 件しか持たない (実測 1/1/0/1/1)
#       ため「章ごとの」型の ★全称を書かない (書くと存在しない fold を約束する = folio-sm8 ceiling round-1 の minor と同型)。
#   - chapter-lead-NN は各章 (band) の heading/essence だけに接地し、 SSoT に無い義務や規約を新造しない。
#   - band 順: 01=§0 読み方 / 02=§1 検証境界 / 03=§2 done-condition REQ / 04=§3 被覆 RTM / 05=§4 参照 / 06=§5 照会 (前方) / 07=§6 用語集。
#     ★slot-id は ★連番 (01..07) のまま = 章帯の巨大番号 (§0..§6 = ADR-0054 §2.2 の節番号一致) とは別体系。
#   - ★plain-<要件 anchor> = 「やさしく言うと」の平易行 (ADR-0054 §2.2)。 接地は当該要件の essence / statement のみ
#     (SSoT に無い義務を新造しない・正確さは essence と『正確な条文（機械向けの厳密な書き方）』fold が持ち、 本行は読みの足場)。
#     ★著述規律 (V確定3): 平易行は ★plain text + <a> (class=xref を付けない) のみ — span.term / 人間層 <code> を
#       ★新規に生やさない (凍結 census を 1 も動かさないための構造規律)。
#   - ★prio-<要件 anchor> = RFC-2119 優先度バッジの可視ラベル。 ★contract requirements[].priority (must|should) ごとの
#     ★closed allowlist に ★逐値 で属すること (verify-srs-verification.sh の PRIO_LABEL_OK が逐値突合し FAIL させる):
#       must   → 「必須」 / 「必須・将来」
#       should → 「推奨・現在」
#     ★前方一致ではない。 否定・限定の接尾 (例「必須ではない」) は level と意味が反転するため ★禁止
#       (ehar クラス = 負の主張ラベルへの束縛漏れ)。 語彙を増やすときは prose (本 file) / verify-srs-verification.sh /
#       assemble-srs-verification.sh の PRIO_LABEL_OK を ★三点同時更新 する。

slots:
  cover-summary: "folio の generator が機械 SSoT (contract + prose の YAML) から生成する『SRS プレゼン HTML』が、 いつ『完成した (GREEN)』と言えるかの完成判定を定める仕様です。 判定は二層で、 件数・構造・見た目の崩れ・再組立の byte 一致など算術的に自明なものを決定的で blocking な floor が裁き、 自由文の捏造・可読性・意味カバレッジは LLM の ceiling が裁きます。 中心は 5 つの規範要件 (EARS 記法の REQ-VER-024〜030・027/028 は欠番) で、 検証被覆の一覧 (RTM) を添え、 上位の原則 (constitution)・決定記録 (ADR)・姉妹の検証仕様 (verification) へ前方照会します。 本ページは元の srs-verification.html を機械 SSoT から dual-audience で再生成したもので、 折りたたみ — 章に置かれた『機械向けの詳細（原文そのまま）』(地の文) と各要件の『正確な条文（機械向けの厳密な書き方）』(EARS 規範文) — を開くと精密な記述を確認できます。"

  chapter-lead-01: "まず読み方から。 §1 が機械と LLM のどちらが何を裁くかの検証境界と完成判定モデルを宣言し、 §2 がその境界に沿って完成判定を 5 つの要件 (REQ-VER-024〜030) で形式化します。 §3 が検証被覆の一覧 (RTM)、 §4 が参照です。 folio 自身の検証 (REQ-VER-001〜023 / REQ-NAV-001〜007) は姉妹 spec の verification.html にあります。"
  chapter-lead-02: "機械 SSoT から生成した SRS プレゼン HTML の完成判定を、 決定的で blocking な floor と LLM の ceiling の二層で定義します。 件数・構造・render・再組立の一致など算術的に自明なものだけを floor が blocking で裁き、 自由文の捏造・可読性・意味カバレッジは LLM の ceiling が裁く、 という境界の線引きがこの章の要です。 構造の捏造はそもそも構成上できない (fabrication-free-by-construction) ため、 静的な禁止群は blocking でない warn 級の補助に留め、 floor 単独では GREEN を宣言しません。"
  chapter-lead-03: "生成 SRS の完成判定を、 5 つの規範要件 (REQ-VER-024〜030・027 と 028 は欠番) で形式化します。 各要件が §1 の境界のどこ (blocking な floor / warn 級の補助 / LLM の ceiling) に属すかを、 やさしい要約と機械層の両方に明記します。"
  chapter-lead-04: "5 つの完成判定要件 (024〜030) が、 それぞれどの検証で確かめられているかを一覧します。 検証の列が空いていれば、 それは『まだ検証されていない』gap の可視化です (030 は検証 scenario の spawn 待ち)。"
  chapter-lead-05: "本仕様が依拠する内部・外部の参照文書を一覧します。 読んでいて根拠をたどりたくなったら、 ここから姉妹 spec (verification) や上位の原則 (constitution)・決定記録 (ADR)・設計 SSoT (SRS 部品 taxonomy) へ進めます。"
  chapter-lead-06: "この仕様が前方照会する主要な文書を挙げます。 上位の原則 (constitution の P-x)・決定記録 (ADR)・姉妹の検証仕様 (verification の REQ-VER) への前方照会で、 srs-verification は照会の終わりではありません — より上位の文書へとつながっています。"
  chapter-lead-07: "本文に出てくる専門語を、 やさしい言葉で説明します。 読んでいて分からない言葉が出てきたら、 ここに戻れます。"

  # ★prio-<要件 anchor> = RFC-2119 優先度バッジの可視ラベル (allowlist 逐値・上の header 注記を参照)。
  #   ★srs-verification は 5 件すべてが主節 SHALL|MUST = must (first-modal-wins 導出・SHOULD 出現 0)。
  prio-req-ver-024: "必須"
  prio-req-ver-025: "必須"
  prio-req-ver-026: "必須"
  prio-req-ver-029: "必須"
  prio-req-ver-030: "必須"

  # ★plain-<要件 anchor> = 「やさしく言うと」の平易行 (接地 = 当該要件の essence / statement のみ・上の header 注記を参照)。
  plain-req-ver-024: "検査コマンドは、生成した要件定義書が機械で白黒つく最低線を満たすか調べます。必要な部品がそろっているか・件数が契約と合うか・仮置きの語が残っていないか等は、見つけたら止めます。隠し描画や見た目の欺きを狙う静的チェックは注意を出すだけで、その意味の裁定は LLM 側にあります。すべて通っても「完成」とは言わず、必ず「LLM 判定待ち」と返します。"
  plain-req-ver-025: "見た目が崩れていないかを、本物のブラウザで描いて調べます。明るい配色と暗い配色の両方で 3 つの画面幅を描き、文字と背景の色が薄すぎないか・横スクロールが出ていないか・部品どうしが重なっていないかを見ます。調べる文字が 1 つも見つからなければ、問題なしではなく失敗にします。ブラウザの無い環境では正直に未実行と報告し、通ったことにはしません。"
  plain-req-ver-026: "「完成」と言えるのはどんなときかの定義です。機械側の必須検査 (最低線・見た目の崩れ・作り直しても同じものになるか) がすべて通り、かつ LLM 側の 3 つの視点 (読みやすさ・捏造の有無・意味の取りこぼし) にも合格したときだけ完成です。機械側だけで完成を宣言することは、検査コマンドが必ず「LLM 判定待ち」を返すことで機械的に禁じています。注意を出すだけの静的チェックは、この完成判定に数えません。"
  plain-req-ver-029: "部品名の一覧 (語彙) が、実際に組み立てる側と食い違っていないかを自動処理が調べます。組立側が出す部品名の集合と語彙ファイルの集合が、どちらにも余りの無いぴったり同じであることを求めます。部品を足した・名前を変えた・消したのに語彙を直し忘れると止まります。どちらかの集合が空になったときも、一致とは見なさず止めます。この検査が見るのは語彙が古びていないかだけで、捏造かどうかの判断は LLM 側の役目です。"
  plain-req-ver-030: "できあがったページが、元の機械向け入力から組み立て直したものと 1 バイトも違わないことを確かめます。毎回変わるのは末尾の生成時刻だけなので、そこだけ両方そろえてから比べます。これにより、出来上がったあとで中身を入れ替えた・増やした・消した、隠すための細工を差し込んだ、といった改変を、手口を一つずつ数え上げなくてもまとめて見つけられます。組み立てる側自身のまちがいには気づけないため、契約とページを別々に突き合わせる検査と併せて使います。作り直すための入力が欠けているときは、合格ではなく測定できなかったこととして扱います。"
