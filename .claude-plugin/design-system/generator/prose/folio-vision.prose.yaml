# folio 文書規律エンジン — vision-pack prose manifest (instance#2 / folio-self・folio-qvv)
#
# opus 著作物。 決定的 assembler が空で出力した data-prose-slot に inject-prose.sh が HTML escape して注入する。
# slot-id ↔ 散文の 1:1 対応 (集合一致を inject が fail-closed 検査)。
#
# 各値は機械 SSoT (contract/folio-vision.vision.yaml) 接地。 捏造/歪曲/脱落は fidelity ceiling
# (folio-5se: fidelity-vision + persona-walk-vision) の検査対象。 値は単一行 (tab/改行禁止)。
#   - 章リードが述べる件数 (「3 つの目標」「4 本」等) は contract 配列長に忠実であること (fidelity ceiling が検査・
#     機械 floor は prose 件数を parse しない = machine/LLM 境界)。
#   - ★非発火の honest 言及: folio は照会先の要件文書をまだ持たない (cross_doc 非発火)。 §5 リードは照会が
#     「無い」ことを隠さず述べる (照会があるかのような叙述は捏造)。

slots:
  # ---- 表紙: このビジョンが約束すること (cover-summary) ----
  cover-summary: "folio の文書規律を一般化し、 専門家でない人も機械も読める 「完璧な文書一式」 をどんなプロジェクトにも生成できるようにする — その北極星と、 3 つの目標・3 つの成功基準・4 本の機能の方向をまとめた、 folio 自身の出発点となる文書です。"

  # ---- 章リード (各章の導入・章構成接地) ----
  chapter-lead-01: "ビジョンの中心は次の一文です。 以降の章はすべて、 この一文を 「誰のために・何を・どう確かめて」 実現するかの展開です。"
  chapter-lead-02: "文書が読まれず、 静かに嘘になっていく — これは書き手の怠慢ではなく、 構造の問題です。 個人の注意力では止まらないから、 仕組みとして解きます。"
  chapter-lead-03: "同じ規律でも、 立場によって 「うれしさ」 は違います。 このビジョンが誰に何を約束するかを、 4 つの立場ごとに 「得るもの」 の高さで書きます。"
  chapter-lead-04: "北極星は方向であって物差しではありません。 3 つの目標に割り、 それぞれに 「達成できたと言える状態」 (成功基準) を付けます。 数字でなく状態で測るのは、 このビジョンが質を約束するものだからです。"
  chapter-lead-05: "ビジョンは 「作る機能の一覧表」 ではありません。 目標を実現するための機能の方向を 4 本にまとめます。 folio はまだ照会先となる要件文書を持たないため、 ここでは方向だけを約束します (照会先が生まれたら結びます)。"
  chapter-lead-06: "ビジョンには 「やらないこと」 も書きます。 実現を脅かす 3 つのリスクと、 軸を守るための非目標をはっきりさせます。 リスクの一つ (機械化のやりすぎ) は、 folio 自身が一度踏んで方向転換した実証済みの罠です。"
  chapter-lead-07: "ビジョンの最後に、 このプロジェクトの判断の突き当たりになる原則を 1 つだけ置きます。 folio が生成するすべての文書は、 最終的にこのような動かない原則へ行き着きます。"
