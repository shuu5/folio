# folio engine post-B6 (folio-8cha) — roadmap-pack prose manifest (③「読みやすさの足場」)
#
# opus 著作物。 決定的 assembler が空で出力した data-prose-slot に inject-prose.sh が
# HTML escape して注入する。 slot-id ↔ 散文の 1:1 対応 (集合一致を inject が fail-closed 検査)。
#
# 各値は機械 SSoT (contract/clinic-roadmap.roadmap.yaml) 接地。 捏造/歪曲/脱落は fidelity ceiling
# (fidelity-roadmap + persona-walk-roadmap) の検査対象。 値は単一行 (tab/改行禁止)。
#   - plain-RMx = ★fidelity ceiling の主対象。 当該目標項目の text にだけ接地し、 SSoT に無い目標・理由を新造しない。
#   - nearest-highlight = 直近段階 (seq 昇順の先頭) で何を目指すかの要旨。 priority 件数/項目に接地する。
#   - 段階順 (seq 昇順)・cross-doc 照会先の事実は stages/cross_doc の構造から接地する。

slots:
  # ---- 表紙: このロードマップが約束すること (cover-summary) ----
  cover-summary: "診療予約システムを「予約の芯を固める → 診療時間の枠を守る → 枠を生かし、 本人を守る」の 3 段階で、 何を・どの順で・いつ頃目指すかを宣言し、 各目標が どの機能の方向 (VISION-CLINIC-APPT) へ向かうか / どの要件 (SRS-CLINIC-APPT) を満たすかまでたどれるようにしたロードマップです。"

  # ---- 章リード (各章の導入・章構成接地) ----
  chapter-lead-01: "まず、 いちばん近い段階でこれから何を目指すかをひとめで示します。 必須・推奨・任意の 3 つの優先度ごとに、 その段階での目標の件数を並べます (0 件の優先度は「この優先度の目標はない」を意味します)。"
  chapter-lead-02: "次に、 近い段階から順に、 各段階で何を目指すかを優先度ごとに並べます。 段階は目指す時期の近い順に並び、 それぞれの段階が「どんな状態を目指すか」を先に述べます。"
  chapter-lead-03: "どの目標が、 どの機能の方向 (なぜ) / どの要件のために置かれたかを 1 枚の表で見渡します。 各目標から、 方向を示すビジョンや、 満たすべき要件を定めた要件定義へたどれることを示します。"
  chapter-lead-04: "本文に出てくる専門語を、 やさしい言葉で説明します。 読んでいて分からない言葉が出てきたら、 ここに戻れます。"

  # ---- 直近段階ハイライト (priority 件数/項目に接地) ----
  nearest-highlight: "いちばん近い段階 M1 (2026 Q3) では、 同じ診療枠の取り合いが起きても予約の確定は必ず 1 件になる「予約の芯」を必須の目標として作り、 満枠の枠への申し込みを正しく断る導線を推奨の目標として整えます。"

  # ---- 各目標項目のやさしい一言 (当該 text に接地) ----
  plain-RM1: "空いている枠を選んで申し込むと、 その枠を 1 件だけ押さえて予約が確定する — 申し込みが重なっても二重に通らない仕組みを、 いちばん先に作ります。"
  plain-RM2: "すでに埋まっている枠に申し込まれたときは、 無理に通さず「空きがありません」と正しく伝えるようにします。"
  plain-RM3: "診療時間外や休診日の枠には予約できないようにし、 代わりに受診できる日時を案内します。"
  plain-RM4: "診療枠と休診日を管理する診療予定表を「正しい出どころ」としてつなぐ準備を進めます。"
  plain-RM5: "予約のときも当日の受付のときも本人かどうかを確かめ、 別の人の予約として進んでしまうのを防ぎます。"
  plain-RM6: "予約の変更やキャンセルを受け付け、 空いた枠をすぐ次の人が予約できるように開放します。"
  plain-RM7: "予約の前日に「予約があります」という通知を送り、 うっかり来院を忘れるのを減らします。"
  plain-RM8: "予約の変更やキャンセルを 1 件ずつでなく、 まとめて行える画面を用意します。"
