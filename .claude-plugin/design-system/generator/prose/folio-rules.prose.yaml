  # ★plain-<要件 anchor> = 「やさしく言うと」の平易行 (ADR-0054 §2.2)。 接地は当該要件の essence / statement のみ
  #   (SSoT に無い義務を新造しない・正確さは essence と『正確な条文』fold が持ち、 本行は読みの足場)。
  plain-req-da-struct-1: "人間向けに書いた要件には、必ず対になる機械向けの精密な文を同じ場所に入れます。片方だけの要件は認めません。"
  plain-req-da-struct-2: "同じ要件を指す 3 か所の ID (囲みの id・人間向けバッジ・機械向け表記) は、大文字小文字を揃えたうえで一致させます。"
  plain-req-da-struct-3: "読者の区別に使う値は「機械向け」と「人間向け」の 2 つだけです。似た意味の別名は使いません。"
  plain-req-da-struct-4: "機械向けの部分に「読み上げから隠す」印を付けてはいけません。AI や支援技術から正式な条文が見えなくなるためです。"
  plain-req-da-struct-5: "人間向けに出す要件の型バッジは、機械向けに記録した型と食い違ってはいけません。"
  plain-req-da-js-1: "JavaScript は静的な HTML の中身を見やすくする補助だけに使い、要件や定義そのものを JS で持たせません。"
  plain-req-da-js-2: "JavaScript を切っていても全文が読めるようにします。外部サーバーから読み込む書き方は使わず、部品は同梱します。"
  plain-req-xref-001: "本文から用語や要件を指すときは決まった形のリンクで書き、その用語を定義している場所へ飛ぶようにします。"
  plain-req-xref-002: "参照の網羅を有効にした文書では、本文で正式名を出したら必ずリンクを 1 本は張ります (言いっぱなしを禁止)。"
  plain-req-xref-003: "リンクはクリックで定義へ飛べることを保ち、マウスを乗せたときに出る短い説明も持たせます (JS なしで動きます)。"
  plain-req-xref-004: "1 つの正式 ID は設計文書全体で 1 か所だけで定義し、番号の振り直しや使い回しをしません。"
  plain-req-gloss-001: "用語に印を付けるときは決まった書き方を使い、その説明文が用語集の定義と一致するようにします。"
  plain-req-gloss-002: "自動印付けを有効にした文書では、folio の用語が最初に出てくる箇所へ道具が自動で印を付けます (すべてを拾う保証はしません)。"
  plain-req-gloss-003: "生成した用語集では、各用語の見出しに決まった規則で作った一意の目印 (id) を付けます。作れなければ生成を止めます。"
  plain-req-cm-001: "AI が設計文書を書き換えようとしたとき、システムは「正規の入口から来たか」の合図が立っているかを確かめます。"
  plain-req-cm-002: "AI は設計文書を編集する直前にその合図を立て、終わったらすぐ下ろします。"
  plain-req-cm-003: "合図が無い、または想定外の値なら、書き込みは拒否されます。"
  plain-req-ci-001: "マージを許す前に、下に並べた 7 つの自動チェックをすべて通すことを CI に義務づけます。"
  plain-req-ci-010: "リンク切れが見つかったら、マージを止めます。"
  plain-req-ci-011: "spec が過去形や経緯の語りになっていたら、マージを止めます (spec は現在形の宣言文で書くため)。"
  plain-req-ci-012: "WHAT を書く spec に理由 (WHY) や実装手段 (HOW) が混ざっていたら、マージを止めます。"
  plain-req-ci-013: "正式な用語の代わりに禁止された言い換えが使われていたら、マージを止めます。"
  plain-req-ci-014: "要件が EARS の型に収まっていないときは警告だけ出し、マージは許します。"
  plain-req-ci-015: "改訂の跡を示す印が未解決だったり壊れていたら、マージを止めます。"
  plain-req-ci-016: "すべての spec の head にある機械向け関係データが、決められた形に合っているかを確かめます。"
  plain-req-adr-001: "(a) 元に戻しにくい・(b) 理由が無いと意外・(c) 案どうしに本物の得失がある、の 3 つがそろう決定にだけ、記録を残すことを提案します。"
