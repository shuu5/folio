  # ★plain-<要件 anchor> = 「やさしく言うと」の平易行 (接地 = 当該要件の essence / statement のみ)。
  plain-req-ver-001: "検証の手順書は、決められたフォルダの中に決められた書式のファイルとして置きます。"
  plain-req-ver-002: "どの手順書も「どの要件を確かめるものか」を 1 つだけ名指しします。宙に浮いた検証を作りません。"
  plain-req-ver-003: "合否の判定は、まずコマンドの終了コード (成功か失敗かを表す数値) で行います。"
  plain-req-ver-006: "判定の主役に、道具の JSON 出力を使うのは避けます。その出力には既知の不具合があるためです。"
  plain-req-ver-004: "正解ファイルは「版管理する正本」と「実行のたびに作る手元用」の 2 か所に分け、正本の更新は明示的な承認手順を通します。"
  plain-req-ver-007: "決められた置き場所の外に設計文書を作ろうとすると、書き込み前の見張りがそれを拒みます。"
  plain-req-ver-008: "目次に載っていない新しいページを作ると、書き込み後の見張りが「目次が古い」と知らせます。"
  plain-req-ver-009: "実際に読み込んだ状態で統合検証するときは、担当が手順書どおりに本物の編集を行って見張りを実際に動かし、観察した結果を正解ファイルに記録します。"
  plain-req-ver-010: "文書一覧を作るコマンドは、決められた形式の一覧ファイルを出力します。実行のたびに変わる生成時刻は比較から外します。"
  plain-req-ver-011: "出力比較型の手順書では、コマンドを実行して出力と正解ファイルを整えたうえで 1 文字の違いも無いことと終了コードの一致を確かめます。"
  plain-req-ver-012: "文脈を流し込むコマンドは、各文書の要点だけを並べた短い一覧を出力します。一覧ファイルが古ければ自動で作り直します。"
  plain-req-ver-013: "検査コマンドは設計文書をひととおり見て、リンクが切れていないかと head の機械データの形が正しいかの 2 点を調べます。"
  plain-req-ver-014: "初期化コマンドは入れ物 (フォルダと目次と設定ファイル) だけを用意します。中身は書かず、既にあるファイルは壊しません。"
  plain-req-ver-015: "補修コマンドは、行きのリンクに対応する戻りのリンクを相手側へ書き足します。終了コードは 3 通りあり、補修しただけでは完了とみなさず、あとで検査コマンドを流し直して確認します。"
  plain-req-ver-016: "設計文書を書く正規手順の最終段では、観点の違う review 担当を同時に走らせて指摘をまとめます。"
  plain-req-ver-017: "検査コマンドは、本文から用語や要件を指すリンクについて 3 つの観点 (解決するか・重複定義が無いか・説明文が合っているか) をすべての文書で調べます。4 つ目の「言いっぱなしが無いか」は、その検査を有効にした文書だけが対象です。"
  plain-req-ver-018: "補修コマンドは、有効にした文書の本文で正式名が最初に出てくる箇所を自動でリンクに変えます。指摘が出た状態から補修すると解消します。"
  plain-req-ver-019: "検査コマンドは、印を付けた専門語がきちんと用語集に載っていて、表示される説明も用語集の定義と一致しているかを調べます。"
  plain-req-ver-020: "検査コマンドは、人間向けに書いた要件に対になる機械向けの部分があるか・ID や型が食い違っていないかを調べます。中身が正しいかは人の目 (別レビュー) の担当です。"
  plain-req-ver-021: "検査コマンドは、図の枠のタイトルが 2 行になっている書き方を止めます。描画すると 2 行目が中身に重なるためです。"
  plain-req-ver-022: "マージ前の自動処理では、全ページを本物のブラウザで 3 つの画面幅で描画し、描画後の見た目の崩れを見つけたら止めます。描画できなかったときも止めます。"
  plain-req-ver-023: "検査コマンドは、読みやすさの最低線を調べます。3 つは見つけたら止め、5 つは注意を出すだけです。"
  plain-req-nav-001: "自動生成した表紙ページは、生成し直した結果と 1 文字でも違えば止めます。手書きの表紙は対象外です。"
  plain-req-nav-002: "表紙ページの中に、行き先が存在しないリンクがあれば止めます。"
  plain-req-nav-003: "各フォルダの目次を調べ、どこへも行けない・中身が無い・表紙へ戻れない、のいずれかがあれば知らせます。folio 自身では止め、利用側では注意にとどめます。"
  plain-req-nav-004: "手書きで残す領域は、最初の開始印から最後の終了印までをまとめて取り出して書き戻します。領域の中に印そのものの説明が書かれていても、途中で切り落とさないためです。"
  plain-req-nav-005: "利用側のプロジェクトでは、たどり着けなさの指摘は止めずに注意として出します。導入直後に赤くならないようにするためです。"
  plain-req-nav-006: "目次の本文に書かれたリンクの行き先が無くなっていたら、それも「たどり着けなさ」の検査が拾います。"
  plain-req-nav-007: "上下の共通部分を持つページは、その部分を計算し直した結果と 1 文字も違わないことを保ちます。ずれたら止め、直すのは生成コマンドです。"
  plain-req-ver-005: "この検証を始める時点では、まず見張りの単体検証だけを必ず用意します。統合と隔離は段階的に足していきます。"
  plain-req-ver-031: "生成したページが元の中身を失っていないことを、3 つの独立した仕組み (凍結した数え上げ・機械向けの原文からの組み直し・抽出が壊れた場合の敵対テスト) で確かめます。かつて使っていた「元ページとの見比べ」は、生成後は自分自身と見比べることになってしまうため使いません。"
