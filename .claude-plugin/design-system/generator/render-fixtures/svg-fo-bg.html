<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>render-fixture: svg foreignObject CSS 背景の検査継続</title>
<style>
  /* SVG 境界 skip の「過剰包含」ガード (folio-jyfh B 段)。 mermaid edge label (labelBkg) と同型に、
     foreignObject 内 label 自身へ CSS background-color を与える。 この場合 CSS 祖先歩きは境界到達前に
     不透明 bg を解決できるため検査は継続され、 白字 on teal (#5ac8b8・ratio≈2.0) は low-contrast で
     発火し続けなければならない。 skip が「svg 配下は全 skip」に壊れると本 case が clean 化して FAIL。 */
  body{ margin:0; padding:24px; background:#ffffff; color:#111418; font:16px/1.6 system-ui, sans-serif; }
  h1{ font-size:24px; }
</style>
</head>
<body>
<h1 data-component="doc-cover-band">svg foreignObject CSS 背景 fixture</h1>
<p>foreignObject 内でも CSS 背景が解決する label (edge label 類) は contrast 検査が継続されることを検証する。</p>
<figure class="diagram" data-component="c4-context">
<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="edge label fixture 図">
  <rect x="0" y="0" width="420" height="120" fill="#f5f8fa"/>
  <foreignObject x="10" y="10" width="400" height="100">
    <p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;color:#ffffff;background:#5ac8b8;display:inline-block;padding:2px 6px;font:15px/1.5 system-ui,sans-serif">teal 地の白 edge label (実欠陥クラス)</p>
  </foreignObject>
</svg>
</figure>
</body>
</html>
