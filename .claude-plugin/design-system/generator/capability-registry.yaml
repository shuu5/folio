# capability-registry.yaml — folio verify capability registry
#   (folio-1kif S5・案B = plugin 内部の静的宣言。 consumer は触らない)
#
# 目的:
#   doc-type ごとに「決定的 floor 検査 script を持つか / ceiling reviewer subagent を持つか /
#   `folio verify --type <type>` dispatch で配線・検証済みか / finished(提示用) artifact を検査する
#   floor 呼出 mode は何か」を単一 SSoT で宣言する。
#   `folio verify --type <type>` はこの registry を読み、 未知 type・未配線 type を floor 実行前に
#   明示エラーで弾き (fail-closed)、 wired type は floor_mode に従い verify-<type>.sh を呼ぶ。
#   ceiling lens 集合 (SKILL.md の 3-lens/self-gate literal) もこの registry を SSoT に解決する
#   (folio-1kif errata must-3: SRS=3 / 非SRS=2 を per-type SSoT 化・機械判定は緩めない)。
#
# scope 注記:
#   folio-1kif が SRS+adr の 2 型で dispatch パターンを確立し、 folio-vxpc が残 doc-type へ複製した
#   (各型 = registry 1 行 + ceiling-anchors の per-type anchor 表 + precheck sentinel 統一を同一 commit で land)。
#   floor script が物理存在しても end-to-end 検証が済むまで wired=false に据え置く (存在 ≠ 配線)。
#     - floor:      floor script が物理存在するか (存在の宣言・honest best-effort)
#     - wired:      `folio verify --type` dispatch で floor gate を end-to-end に通し self-test で
#                   検証済みか (= CLI から安全に呼べる保証)。 未配線は floor 存在でも false=fail-closed。
#     - floor_mode: finished(提示用・prose 充填済) artifact を検査する floor 呼出 mode。 未配線型は
#                   null (mode 未確定・dispatch は wired=false で先に弾くため未消費)。
#
# schema:
#   version                          : registry schema バージョン (int)
#   doc_types.<type>.floor           : floor 検査 script のファイル名 (generator/ 相対)、 無ければ null
#   doc_types.<type>.floor_mode      : finished artifact 検査の floor 呼出 mode。 値:
#                                        default  = flag 無し (verify-srs 型・既定 mode が充填を検査)
#                                        artifact = --artifact (verify-adr 型・既定 mode は pre-fill 検査ゆえ
#                                                   finished 検査には --artifact で prose 全充填を要求)
#                                        null     = 未配線ゆえ未確定
#   doc_types.<type>.ceiling         : ceiling reviewer subagent 名のリスト (無ければ [])。 lens 集合 SSoT。
#   doc_types.<type>.wired           : verify --type dispatch で配線・検証済みなら true (既定 false)
#   doc_types.<type>.contract_suffix : contract ファイル名の doctype 部 (<subject>.<suffix>.yaml)
#
# 語彙: 14 canonical doc-type (persona-walk-*/fidelity-* subagent と 1:1 = taxonomy §5.3)。

version: 1

doc_types:
  # --- wired (dispatch 配線 + per-type acceptance 済。 srs/adr=folio-1kif / 他=folio-vxpc) ---
  srs:
    floor: verify-srs.sh
    floor_mode: default
    ceiling: [fidelity-srs, persona-walk-srs, completeness-critic-srs]
    wired: true
    contract_suffix: srs
  adr:
    floor: verify-adr.sh
    floor_mode: artifact
    ceiling: [fidelity-adr, persona-walk-adr]
    wired: true
    contract_suffix: adr

  research:
    floor: verify-research.sh
    floor_mode: artifact
    ceiling: [fidelity-research, persona-walk-research]
    wired: true
    contract_suffix: research

  principle:
    floor: verify-principle.sh
    floor_mode: artifact
    ceiling: [fidelity-principle, persona-walk-principle]
    wired: true
    contract_suffix: principle
  vision:
    floor: verify-vision.sh
    floor_mode: artifact
    ceiling: [fidelity-vision, persona-walk-vision]
    wired: true
    contract_suffix: vision
  glossary:
    floor: verify-glossary.sh
    floor_mode: artifact
    ceiling: [fidelity-glossary, persona-walk-glossary]
    wired: true
    contract_suffix: glossary
  # ★D2 (admin 裁定): registry key は canonical 語彙 architecture・contract_suffix は略記 arch。
  #   suffix→canonical の写像は検出層の責務 (ceiling-anchors.sh の doc_type 検出 + SKILL §0)。
  architecture:
    floor: verify-arch.sh
    floor_mode: artifact
    ceiling: [fidelity-architecture, persona-walk-architecture]
    wired: true
    contract_suffix: arch
  testcases:
    floor: verify-testcases.sh
    floor_mode: artifact
    ceiling: [fidelity-testcases, persona-walk-testcases]
    wired: true
    contract_suffix: testcases
  datamodel:
    floor: verify-datamodel.sh
    floor_mode: artifact
    ceiling: [fidelity-datamodel, persona-walk-datamodel]
    wired: true
    contract_suffix: datamodel
  interface:
    floor: verify-interface.sh
    floor_mode: artifact
    ceiling: [fidelity-interface, persona-walk-interface]
    wired: true
    contract_suffix: interface
  risk:
    floor: verify-risk.sh
    floor_mode: artifact
    ceiling: [fidelity-risk, persona-walk-risk]
    wired: true
    contract_suffix: risk
  changelog:
    floor: verify-changelog.sh
    floor_mode: artifact
    ceiling: [fidelity-changelog, persona-walk-changelog]
    wired: true
    contract_suffix: changelog
  roadmap:
    floor: verify-roadmap.sh
    floor_mode: artifact
    ceiling: [fidelity-roadmap, persona-walk-roadmap]
    wired: true
    contract_suffix: roadmap

  # --- not yet wired (floor script は存在するが本 dispatch では未検証・fail-closed) ---
  #   spec 系 3 instance (folio-rules / folio-relations / folio-verification.spec.yaml) は registry key 粒度 +
  #   ceiling pair 帰属 (fidelity-spec/persona-walk-spec は rules 向け author) が未解決の設計判断ゆえ、
  #   mechanical wiring と混ぜず後続 bead folio-vhew へ切出す (admin 裁定 D1)。
  spec:
    floor: verify-spec.sh
    floor_mode: null
    ceiling: [fidelity-spec, persona-walk-spec]
    wired: false
    contract_suffix: spec
